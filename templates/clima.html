<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clima | CXProjetos</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        :root{
            --mesa:#EFEFF3; --papel:#FFF; --papel-2:#F7F7F9;
            --linha:#E4E4EA; --linha-2:#D3D3DC;
            --tinta:#17171A; --tinta-2:#56565F; --tinta-3:#7C7C88;
            --acao:#6C5CE7; --acao-fraco:#F1EFFE;
            --ok:#0E9F6E; --ok-fraco:#E6F7F0;
            --atencao:#C2660B; --at-fundo:#FFF0D6; --at-borda:#E5BE7F;
            --critico:#D42F2F; --cr-fundo:#FBE3E3; --cr-borda:#E9A9A9;
            --r-card:12px; --r-ctrl:9px; --r-pill:999px;
            --e1:0 1px 2px rgba(23,23,26,.05), 0 0 0 1px var(--linha);
            --e2:0 4px 14px rgba(23,23,26,.07), 0 0 0 1px var(--linha);
            --e3:0 16px 44px rgba(23,23,26,.14), 0 0 0 1px var(--linha);
            /* nomes antigos usados por estilos herdados */
            --text-muted:#7C7C88; --text-main:#17171A; --primary-purple:#6C5CE7;
            --accent-lime:#BEF533; --accent-pink:#FF43C0;
        }
        *,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
        button,input,select,textarea{ font-family:inherit; border:none; }
        body{
            font-family:'Inter',system-ui,sans-serif; background:var(--mesa); color:var(--tinta);
            height:100vh; overflow:hidden; display:flex; flex-direction:column; -webkit-font-smoothing:antialiased;
        }
        .num{ font-family:'IBM Plex Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums; letter-spacing:-.2px; }
        :focus-visible{ outline:2px solid var(--acao); outline-offset:2px; border-radius:4px; }
        @media (prefers-reduced-motion:reduce){ *{ animation:none!important; transition:none!important; } }
        ::-webkit-scrollbar{ width:8px; height:8px; }
        ::-webkit-scrollbar-track{ background:transparent; }
        ::-webkit-scrollbar-thumb{ background:var(--linha-2); border-radius:99px; }

        .top-bar{
            background:var(--papel); height:56px; min-height:56px; flex-shrink:0; padding:0 22px;
            display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--linha); z-index:10;
        }
        .top-bar-logo{ font-size:17px; font-weight:700; letter-spacing:-.4px; cursor:pointer; }
        .top-bar-logo span{ color:var(--acao); }

        .cmd{
            display:flex; align-items:center; gap:12px; padding:0 22px; height:56px; flex-shrink:0;
            background:var(--papel); border-bottom:1px solid var(--linha); flex-wrap:wrap;
        }
        .cmd-tit{ font-size:16px; font-weight:650; letter-spacing:-.35px; white-space:nowrap; }
        .cmd-sep{ width:1px; height:22px; background:var(--linha); }
        .cliente-sel{
            font-size:13px; font-weight:500; color:var(--tinta); padding:7px 11px; background:var(--papel-2);
            border:1px solid transparent; border-radius:var(--r-ctrl); outline:none; cursor:pointer; max-width:250px;
        }
        .cliente-sel:focus{ background:var(--papel); border-color:var(--acao); box-shadow:0 0 0 3px var(--acao-fraco); }
        .cmd-dir{ margin-left:auto; display:flex; align-items:center; gap:9px; }

        .btn-acao,.btn-sec,.btn-ghost{
            font-size:13px; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:7px;
            padding:8px 14px; border-radius:var(--r-ctrl); transition:.15s; white-space:nowrap;
        }
        .btn-acao{ background:var(--acao); color:#fff; }
        .btn-acao:hover{ background:#5a4bd4; }
        .btn-sec{ background:var(--papel-2); color:var(--tinta-2); }
        .btn-sec:hover{ background:var(--linha); color:var(--tinta); }
        .btn-ghost{ background:transparent; color:var(--tinta-2); }
        .btn-ghost:hover{ background:var(--linha); }

        .scroll-area{ flex:1; overflow-y:auto; padding:18px 22px 26px; }
        .loading{ text-align:center; padding:60px; color:var(--tinta-3); font-size:13px; font-weight:500; }
        .empty{ text-align:center; padding:66px 24px; color:var(--tinta-3); }
        .empty .material-symbols-rounded{ font-size:46px; opacity:.25; display:block; margin-bottom:14px; }
        .empty h3{ font-size:15px; font-weight:650; color:var(--tinta-2); margin-bottom:6px; }
        .empty p{ font-size:13px; font-weight:500; line-height:1.6; max-width:400px; margin:0 auto 18px; }

        /* ===== CARD DE PESQUISA ===== */
        .pesq-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(272px,1fr)); gap:12px; }
        .pesq-card{
            background:var(--papel); border-radius:var(--r-card); box-shadow:var(--e1); padding:15px 16px;
            cursor:pointer; transition:box-shadow .16s, transform .16s;
        }
        .pesq-card:hover{ box-shadow:var(--e2); transform:translateY(-1px); }
        .pesq-top{ display:flex; align-items:center; gap:8px; margin-bottom:9px; }
        .pesq-cliente{ font-size:10.5px; font-weight:600; letter-spacing:.5px; text-transform:uppercase; color:var(--tinta-3); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .status-badge{ font-size:10px; font-weight:600; padding:2px 8px; border-radius:99px; white-space:nowrap; flex-shrink:0; }
        .status-rascunho{ background:var(--papel-2); color:var(--tinta-3); }
        .status-ativa{ background:var(--ok-fraco); color:var(--ok); }
        .status-encerrada{ background:var(--acao-fraco); color:var(--acao); }
        .pesq-titulo{ font-size:14px; font-weight:600; line-height:1.35; letter-spacing:-.15px; margin-bottom:12px; }
        .pesq-num{ display:flex; align-items:baseline; gap:6px; margin-bottom:8px; }
        .pesq-val{ font-size:22px; font-weight:700; letter-spacing:-.7px; line-height:1; }
        .pesq-de{ font-size:12px; color:var(--tinta-3); font-weight:500; }
        .barra{ height:5px; background:rgba(0,0,0,.07); border-radius:99px; overflow:hidden; }
        .barra-fill{ height:100%; border-radius:99px; transition:width .4s; }
        .pesq-pe{ display:flex; align-items:center; gap:11px; margin-top:11px; font-size:11px; color:var(--tinta-3); font-weight:500; flex-wrap:wrap; }
        .pesq-pe span{ display:flex; align-items:center; gap:4px; }
        .pesq-pe .material-symbols-rounded{ font-size:14px; }
        .pe-critico{ color:var(--critico); font-weight:600; }

        /* ===== ESTEIRA DE STATUS ===== */
        .esteira{
            display:flex; align-items:center; background:var(--papel); border-radius:var(--r-card);
            box-shadow:var(--e1); padding:13px 18px; margin-bottom:16px; flex-wrap:wrap; gap:0;
        }
        .et{ display:flex; align-items:center; gap:9px; padding-right:16px; }
        .et-bola{ width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; background:var(--papel-2); color:var(--tinta-3); }
        .et-bola .material-symbols-rounded{ font-size:15px; }
        .et.feito .et-bola{ background:var(--ok-fraco); color:var(--ok); }
        .et.agora .et-bola{ background:var(--acao); color:#fff; }
        .et-txt{ font-size:12px; font-weight:550; color:var(--tinta-3); white-space:nowrap; }
        .et.feito .et-txt{ color:var(--tinta-2); }
        .et.agora .et-txt{ color:var(--tinta); font-weight:650; }
        .et-linha{ width:26px; height:1.5px; background:var(--linha); margin-right:16px; flex-shrink:0; }
        .esteira-dir{ margin-left:auto; display:flex; align-items:center; gap:9px; }

        .migalha{ display:flex; align-items:center; gap:7px; margin-bottom:14px; font-size:12.5px; color:var(--tinta-3); font-weight:500; flex-wrap:wrap; }
        .migalha a{ color:var(--acao); cursor:pointer; font-weight:550; }
        .migalha a:hover{ text-decoration:underline; }
        .migalha .material-symbols-rounded{ font-size:15px; }
        .migalha b{ color:var(--tinta); font-weight:600; }

        /* ===== EDITOR ===== */
        .editor{ display:grid; grid-template-columns:1fr 292px; gap:14px; align-items:start; }
        .dim-bloco{ background:var(--papel); border-radius:var(--r-card); box-shadow:var(--e1); margin-bottom:10px; overflow:hidden; }
        .dim-head{ padding:12px 15px; display:flex; align-items:center; gap:10px; border-bottom:1px solid var(--linha); }
        .dim-nome{ font-size:13.5px; font-weight:600; letter-spacing:-.15px; flex:1; min-width:0; }
        .dim-lideranca-tag{ font-size:10px; font-weight:600; padding:2px 7px; border-radius:99px; background:var(--acao-fraco); color:var(--acao); white-space:nowrap; margin-left:6px; }
        .dim-qtd{ font-size:11px; font-weight:600; color:var(--tinta-3); }
        .dim-acoes,.perg-acoes{ display:flex; gap:3px; opacity:0; transition:.15s; }
        .dim-head:hover .dim-acoes, .perg-item:hover .perg-acoes{ opacity:1; }
        .icon-btn{
            width:24px; height:24px; border-radius:6px; background:rgba(0,0,0,.05); color:var(--tinta-3);
            display:flex; align-items:center; justify-content:center; cursor:pointer; transition:.15s; flex-shrink:0;
        }
        .icon-btn:hover{ background:var(--acao); color:#fff; }
        .icon-btn.danger:hover{ background:var(--critico); color:#fff; }
        .icon-btn .material-symbols-rounded{ font-size:15px; }

        .perg-item{ padding:10px 15px; border-bottom:1px solid var(--papel-2); display:flex; align-items:center; gap:10px; transition:background .14s; }
        .perg-item:last-of-type{ border-bottom:none; }
        .perg-item:hover{ background:var(--papel-2); }
        .perg-tipo{ font-size:9.5px; font-weight:600; padding:2px 6px; border-radius:4px; background:var(--papel-2); color:var(--tinta-3); white-space:nowrap; flex-shrink:0; }
        .perg-item:hover .perg-tipo{ background:var(--linha); }
        .perg-texto{ flex:1; min-width:0; font-size:12.5px; color:var(--tinta-2); line-height:1.45; }
        .perg-vazia{ padding:14px 15px; font-size:12px; color:var(--tinta-3); font-weight:500; }

        .add-inline{
            display:flex; align-items:center; justify-content:center; gap:7px; padding:9px;
            border:1.5px dashed var(--linha-2); border-radius:10px; cursor:pointer;
            font-size:12.5px; font-weight:550; color:var(--tinta-3); transition:.15s; margin:10px 15px;
        }
        .add-inline:hover{ border-color:var(--acao); color:var(--acao); background:var(--acao-fraco); }
        .add-inline .material-symbols-rounded{ font-size:17px; }

        /* ===== COLUNA DE APOIO ===== */
        .lado{ background:var(--papel); border-radius:var(--r-card); box-shadow:var(--e1); padding:15px 16px; margin-bottom:12px; }
        .lado-tit{ font-size:12px; font-weight:650; letter-spacing:-.1px; margin-bottom:11px; display:flex; align-items:center; gap:7px; }
        .lado-tit .material-symbols-rounded{ font-size:16px; color:var(--tinta-3); }
        .lado-qtd{ margin-left:auto; font-size:11px; color:var(--tinta-3); font-weight:600; }
        .cfg-hint{ font-size:11px; color:var(--tinta-3); line-height:1.5; margin-bottom:11px; }
        .chip-item{
            display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:500;
            background:var(--papel-2); color:var(--tinta-2); padding:5px 6px 5px 10px; border-radius:99px; margin:0 5px 5px 0;
        }
        .chip-cargo{ color:var(--tinta-3); }
        .chip-item .icon-btn{ width:18px; height:18px; background:transparent; }
        .chip-item .icon-btn .material-symbols-rounded{ font-size:13px; }
        .add-row{ display:flex; gap:7px; margin-top:9px; }
        .add-row input{
            flex:1; min-width:0; font-size:12.5px; padding:8px 10px; background:var(--papel-2);
            border:1px solid transparent; border-radius:var(--r-ctrl); outline:none; color:var(--tinta);
        }
        .add-row input:focus{ background:var(--papel); border-color:var(--acao); box-shadow:0 0 0 3px var(--acao-fraco); }
        .add-row button{
            width:34px; height:34px; border-radius:var(--r-ctrl); background:var(--acao); color:#fff;
            display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; transition:.15s;
        }
        .add-row button:hover{ background:#5a4bd4; }
        .link-box{ display:flex; align-items:center; gap:8px; background:var(--papel-2); border-radius:var(--r-ctrl); padding:8px 10px; }
        .link-box input{
            flex:1; min-width:0; background:transparent; font-size:11.5px;
            font-family:'IBM Plex Mono',monospace; color:var(--tinta-2); outline:none;
        }
        .link-copiar{ color:var(--acao); cursor:pointer; display:flex; flex-shrink:0; }
        .link-copiar .material-symbols-rounded{ font-size:16px; }

        /* ===== MODAIS ===== */
        .modal-overlay{
            position:fixed; inset:0; background:rgba(23,23,26,.45); z-index:1000;
            display:none; align-items:center; justify-content:center; padding:20px;
        }
        .modal-overlay.show{ display:flex; }
        .modal{ background:var(--papel); border-radius:16px; box-shadow:var(--e3); width:100%; max-width:470px; overflow:hidden; padding:20px; }
        .modal-titulo{ font-size:16px; font-weight:650; letter-spacing:-.3px; margin-bottom:17px; }
        .input-group{ margin-bottom:14px; }
        .input-group label{ display:block; font-size:11px; font-weight:600; color:var(--tinta-3); text-transform:uppercase; letter-spacing:.5px; margin-bottom:7px; }
        .input-group input, .input-group textarea, .input-group select{
            width:100%; font-size:13px; color:var(--tinta); padding:9px 11px; background:var(--papel-2);
            border:1px solid transparent; border-radius:var(--r-ctrl); outline:none; transition:.15s;
        }
        .input-group textarea{ resize:vertical; min-height:70px; line-height:1.5; }
        .input-group input:focus, .input-group textarea:focus, .input-group select:focus{
            background:var(--papel); border-color:var(--acao); box-shadow:0 0 0 3px var(--acao-fraco);
        }
        .check-row{ display:flex; align-items:center; gap:9px; margin-bottom:14px; cursor:pointer; }
        .check-row input{ width:15px; height:15px; accent-color:var(--acao); cursor:pointer; }
        .check-row label{ font-size:12.5px; color:var(--tinta-2); font-weight:500; cursor:pointer; }
        .modal-acoes{ display:flex; gap:9px; justify-content:flex-end; margin-top:18px; }

        /* ===== TOAST ===== */
        .toast{
            position:fixed; bottom:26px; left:50%; transform:translateX(-50%) translateY(14px);
            background:rgba(23,23,26,.95); color:#fff; padding:11px 20px; border-radius:var(--r-pill);
            font-size:12.5px; font-weight:500; box-shadow:0 10px 30px rgba(0,0,0,.2);
            opacity:0; pointer-events:none; transition:.25s; z-index:10001;
        }
        .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
        .toast.error{ background:var(--critico); }

        /* ===== RESPONSIVO ===== */
        @media (max-width:960px){ .editor{ grid-template-columns:1fr; } }
        @media (max-width:900px){
            body{ height:auto; min-height:100vh; overflow:visible; }
            .top-bar{ padding:0 16px 0 60px; }
            .cmd{ padding:10px 16px; height:auto; row-gap:9px; }
            .cliente-sel{ flex:1; max-width:none; }
            .cmd-dir{ width:100%; margin-left:0; }
            .scroll-area{ padding:14px 16px 24px; }
            .pesq-grid{ grid-template-columns:1fr; }
            .dim-acoes,.perg-acoes{ opacity:1; }
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <div class="top-bar-logo" onclick="window.location.href='/'">CX<span>Projetos</span></div>
        {% include '_usermenu.html' %}
    </div>
    {% include '_sidebar.html' %}

    <div class="cmd">
        <span class="cmd-tit" id="tituloBarra">Clima</span>
        <div class="cmd-sep"></div>
        <select class="cliente-sel" id="selCliente" onchange="filtrarPorCliente()" style="display:none;">
            <option value="">Todos os clientes</option>
        </select>
        <div class="cmd-dir" id="acoesTopo">
            <button class="btn-sec" onclick="abrirModelo()"><span class="material-symbols-rounded" style="font-size:17px;">tune</span>Modelo base</button>
            <button class="btn-acao" onclick="abrirNovaPesquisa()"><span class="material-symbols-rounded" style="font-size:17px;">add</span>Nova pesquisa</button>
        </div>
    </div>

    <div class="scroll-area" id="conteudo">
        <div class="loading">Carregando...</div>
    </div>

<div class="modal-overlay" id="modalPesquisa">
        <div class="modal">
            <div class="modal-titulo" id="modalPesqTitulo">Nova pesquisa</div>
            <div class="input-group">
                <label>Cliente *</label>
                <select id="pesqCliente"></select>
            </div>
            <div class="input-group">
                <label>Título da pesquisa *</label>
                <input type="text" id="pesqTitulo" placeholder="Ex: Pesquisa de Clima 2026">
            </div>
            <div class="input-group">
                <label>Descrição (mensagem de abertura)</label>
                <textarea id="pesqDesc" placeholder="Texto que o colaborador vê ao abrir a pesquisa..."></textarea>
            </div>
            <div class="modal-acoes">
                <button class="btn-ghost" onclick="fecharModal('modalPesquisa')">Cancelar</button>
                <button class="btn-acao" onclick="salvarPesquisa()">Criar pesquisa</button>
            </div>
        </div>
    </div>

    <!-- MODAL: Dimensão -->
    <div class="modal-overlay" id="modalDimensao">
        <div class="modal">
            <div class="modal-titulo" id="modalDimTitulo">Nova dimensão</div>
            <div class="input-group">
                <label>Nome da dimensão *</label>
                <input type="text" id="dimNome" placeholder="Ex: Liderança">
            </div>
            <div class="check-row">
                <input type="checkbox" id="dimLideranca">
                <label for="dimLideranca">É uma dimensão de liderança (as perguntas se repetem para cada líder marcado)</label>
            </div>
            <div class="modal-acoes">
                <button class="btn-ghost" onclick="fecharModal('modalDimensao')">Cancelar</button>
                <button class="btn-acao" onclick="salvarDimensao()">Salvar</button>
            </div>
        </div>
    </div>

    <!-- MODAL: Pergunta -->
    <div class="modal-overlay" id="modalPergunta">
        <div class="modal">
            <div class="modal-titulo" id="modalPergTitulo">Nova pergunta</div>
            <div class="input-group">
                <label>Texto da pergunta *</label>
                <textarea id="pergTexto" placeholder="Ex: Estou satisfeito com meu ambiente de trabalho"></textarea>
            </div>
            <div class="input-group">
                <label>Tipo de resposta *</label>
                <select id="pergTipo">
                    <option value="likert">Escala Likert (Concordo totalmente → Discordo totalmente)</option>
                    <option value="escala10">Escala 0 a 10 (NPS / nota)</option>
                    <option value="texto">Resposta aberta (texto)</option>
                </select>
            </div>
            <div class="modal-acoes">
                <button class="btn-ghost" onclick="fecharModal('modalPergunta')">Cancelar</button>
                <button class="btn-acao" onclick="salvarPergunta()">Salvar</button>
            </div>
        </div>
    </div>
    <div class="toast" id="toast"></div>

    <script>
        const NIVEL_ACESSO = "{{ nivel_acesso }}";
        let pesquisas = [], clientes = [], mostraSeletor = true;
        let pesquisaAberta = null;
        let modeloAberto = false;
        let ctxDim = {};

        document.addEventListener('DOMContentLoaded', carregarLista);

        function escH(s){ if(!s) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
        function showToast(msg, tipo){ const t=document.getElementById('toast'); t.textContent=msg; t.className='toast show '+(tipo||''); setTimeout(()=>t.className='toast',2600); }
        function fecharModal(id){ document.getElementById(id).classList.remove('show'); }
        function tipoLabel(t){ return {likert:'Likert', escala10:'Escala 0-10', texto:'Aberta', multipla:'Múltipla'}[t]||t; }
        function tipoIcon(t){ return {likert:'linear_scale', escala10:'pin', texto:'notes', multipla:'checklist'}[t]||'help'; }
        function statusLabel(s){ return {rascunho:'Rascunho', ativa:'Coletando', encerrada:'Encerrada'}[s]||s; }

        // ===== LISTA DE PESQUISAS =====
        async function carregarLista() {
            try {
                const res = await fetch('/api/clima/pesquisas');
                if (res.status === 403) { document.getElementById('conteudo').innerHTML='<div class="empty"><h3>Acesso negado</h3></div>'; return; }
                const data = await res.json();
                pesquisas = data.pesquisas || [];
                clientes = data.clientes || [];
                mostraSeletor = data.mostra_seletor !== false;
                const sc = document.getElementById('selCliente');
                sc.innerHTML = '<option value="">Todos os clientes</option>' + clientes.map(c=>`<option value="${c.id}">${escH(c.nome)}</option>`).join('');
                if (mostraSeletor && clientes.length > 1) sc.style.display = 'block';
                const pc = document.getElementById('pesqCliente');
                pc.innerHTML = clientes.map(c=>`<option value="${c.id}">${escH(c.nome)}</option>`).join('');
                renderLista();
            } catch(e) { console.error(e); document.getElementById('conteudo').innerHTML='<div class="empty"><h3>Erro ao carregar</h3></div>'; }
        }

        function nomeCliente(id){ const c = clientes.find(x=>String(x.id)===String(id)); return c?c.nome:'—'; }

        // Contagem de dimensões e perguntas quando a lista já traz o resumo
        function contaPerguntas(p){
            if (typeof p.total_perguntas === 'number') return p.total_perguntas;
            let n=0; (p.dimensoes||[]).forEach(d=>n+=(d.perguntas||[]).length); return n;
        }
        function contaDimensoes(p){
            if (typeof p.total_dimensoes === 'number') return p.total_dimensoes;
            return (p.dimensoes||[]).length;
        }

        function renderLista() {
            pesquisaAberta = null; modeloAberto = false;
            document.getElementById('acoesTopo').style.display = 'flex';
            document.getElementById('tituloBarra').textContent = 'Clima';
            if (mostraSeletor && clientes.length > 1) document.getElementById('selCliente').style.display = 'block';

            const filtro = document.getElementById('selCliente').value;
            let lista = pesquisas;
            if (filtro) lista = lista.filter(p => String(p.cliente_id)===String(filtro));

            if (!lista.length) {
                document.getElementById('conteudo').innerHTML = `
                    <div class="empty">
                        <span class="material-symbols-rounded">mood</span>
                        <h3>Nenhuma pesquisa ainda</h3>
                        <p>Crie a primeira pesquisa de clima. Ela parte do modelo base e você ajusta as perguntas para cada cliente.</p>
                        <button class="btn-acao" style="margin:0 auto;" onclick="abrirNovaPesquisa()"><span class="material-symbols-rounded" style="font-size:17px;">add</span>Nova pesquisa</button>
                    </div>`;
                return;
            }

            const cards = lista.map(p => {
                const n = p.total_respostas || 0;
                const nd = contaDimensoes(p), np = contaPerguntas(p);
                let bloco, rodape;

                if (p.status === 'rascunho') {
                    bloco = `<div class="pesq-num"><span class="pesq-val num" style="color:var(--tinta-3);">—</span><span class="pesq-de">ainda não publicada</span></div>
                             <div class="barra"><div class="barra-fill" style="width:0%;"></div></div>`;
                    rodape = `<span><span class="material-symbols-rounded">category</span>${nd} dimensõe${nd!==1?'s':''}</span>`;
                    if (np) rodape += `<span><span class="material-symbols-rounded">help</span>${np} pergunta${np!==1?'s':''}</span>`;
                } else {
                    // Sem total de convidados no banco, mostramos a contagem absoluta.
                    // A barra usa 30 respostas como referência visual de massa crítica.
                    const ref = 30, pctVis = Math.min(100, Math.round(n/ref*100));
                    const tom = n >= 30 ? 'var(--ok)' : (n >= 15 ? 'var(--atencao)' : 'var(--critico)');
                    bloco = `<div class="pesq-num"><span class="pesq-val num" style="color:${tom};">${n}</span><span class="pesq-de">resposta${n!==1?'s':''}</span></div>
                             <div class="barra"><div class="barra-fill" style="width:${pctVis}%; background:${tom};"></div></div>`;
                    if (p.status === 'ativa' && n < 15) {
                        rodape = `<span class="pe-critico"><span class="material-symbols-rounded">error</span>amostra ainda pequena</span>`;
                    } else if (p.status === 'encerrada') {
                        rodape = `<span><span class="material-symbols-rounded">event</span>encerrada</span>
                                  <span><span class="material-symbols-rounded">category</span>${nd} dimensõe${nd!==1?'s':''}</span>`;
                    } else {
                        rodape = `<span><span class="material-symbols-rounded">category</span>${nd} dimensõe${nd!==1?'s':''}</span>`;
                        if (np) rodape += `<span><span class="material-symbols-rounded">help</span>${np} pergunta${np!==1?'s':''}</span>`;
                    }
                }

                return `<div class="pesq-card" onclick="abrirPesquisa('${p.id}')">
                    <div class="pesq-top">
                        <span class="pesq-cliente">${escH(nomeCliente(p.cliente_id))}</span>
                        <span class="status-badge status-${p.status}">${statusLabel(p.status)}</span>
                    </div>
                    <div class="pesq-titulo">${escH(p.titulo)}</div>
                    ${bloco}
                    <div class="pesq-pe">${rodape}</div>
                </div>`;
            }).join('');

            document.getElementById('conteudo').innerHTML = `<div class="pesq-grid">${cards}</div>`;
        }

        function filtrarPorCliente() { if (!pesquisaAberta) renderLista(); }

        // ===== NOVA PESQUISA =====
        function abrirNovaPesquisa() {
            if (!clientes.length) { showToast('Cadastre um cliente antes.', 'error'); return; }
            document.getElementById('pesqTitulo').value = '';
            document.getElementById('pesqDesc').value = '';
            document.getElementById('modalPesquisa').classList.add('show');
        }

        async function salvarPesquisa() {
            const cliente_id = document.getElementById('pesqCliente').value;
            const titulo = document.getElementById('pesqTitulo').value.trim();
            if (!titulo) { showToast('Informe o título.', 'error'); return; }
            try {
                const res = await fetch('/api/clima/pesquisa', { method:'POST', headers:{'Content-Type':'application/json'},
                    body: JSON.stringify({ cliente_id, titulo, descricao: document.getElementById('pesqDesc').value.trim() }) });
                const data = await res.json();
                if (res.ok) { showToast('Pesquisa criada!', 'success'); fecharModal('modalPesquisa'); await carregarLista(); if(data.pesquisa_id) abrirPesquisa(data.pesquisa_id); }
                else showToast(data.mensagem||'Erro ao criar.', 'error');
            } catch(e) { showToast('Erro de conexão.', 'error'); }
        }

        // ===== EDITOR =====
        async function abrirPesquisa(pid) {
            document.getElementById('conteudo').innerHTML = '<div class="loading">Carregando pesquisa...</div>';
            try {
                const res = await fetch('/api/clima/pesquisa/' + pid);
                const data = await res.json();
                if (!res.ok) { showToast('Erro ao abrir.', 'error'); return; }
                pesquisaAberta = data.pesquisa;
                document.getElementById('acoesTopo').style.display = 'none';
                document.getElementById('selCliente').style.display = 'none';
                renderEditor();
            } catch(e) { showToast('Erro de conexão.', 'error'); }
        }

        function renderEditor() {
            const p = pesquisaAberta;
            const link = window.location.origin + '/clima/responder/' + p.token;
            const n = p.total_respostas || 0;
            document.getElementById('tituloBarra').textContent = p.titulo;

            // esteira: montagem -> coletando -> resultados
            const emColeta = p.status === 'ativa';
            const encerrada = p.status === 'encerrada';
            const esteira = `
                <div class="esteira">
                    <div class="et ${p.status!=='rascunho'?'feito':'agora'}">
                        <span class="et-bola"><span class="material-symbols-rounded">${p.status!=='rascunho'?'check':'edit_note'}</span></span>
                        <span class="et-txt">Montagem</span>
                    </div>
                    <span class="et-linha"></span>
                    <div class="et ${encerrada?'feito':(emColeta?'agora':'')}">
                        <span class="et-bola"><span class="material-symbols-rounded">${encerrada?'check':'campaign'}</span></span>
                        <span class="et-txt">${emColeta? 'Coletando · '+n+' resposta'+(n!==1?'s':'') : 'Coleta'}</span>
                    </div>
                    <span class="et-linha"></span>
                    <div class="et ${encerrada?'agora':''}">
                        <span class="et-bola"><span class="material-symbols-rounded">insights</span></span>
                        <span class="et-txt">Resultados</span>
                    </div>
                    <div class="esteira-dir">
                        ${p.status==='rascunho' ? `<button class="btn-acao" onclick="mudarStatus('ativa')"><span class="material-symbols-rounded" style="font-size:16px;">play_arrow</span>Publicar</button>` : ''}
                        ${emColeta ? `<button class="btn-sec" onclick="mudarStatus('encerrada')"><span class="material-symbols-rounded" style="font-size:16px;">lock</span>Encerrar coleta</button>` : ''}
                        ${encerrada ? `<button class="btn-sec" onclick="mudarStatus('ativa')"><span class="material-symbols-rounded" style="font-size:16px;">refresh</span>Reabrir</button>` : ''}
                        ${n>0 ? `<button class="btn-acao" onclick="window.location.href='/clima/dashboard'"><span class="material-symbols-rounded" style="font-size:16px;">insights</span>Ver dashboard</button>` : ''}
                    </div>
                </div>`;

            const dims = p.dimensoes || [];
            let principal = dims.map(d => {
                const perbs = d.perguntas || [];
                return `<div class="dim-bloco">
                    <div class="dim-head">
                        <span class="dim-nome">${escH(d.nome)}${d.eh_lideranca?'<span class="dim-lideranca-tag">avaliada por líder</span>':''}</span>
                        <span class="dim-qtd num">${perbs.length}</span>
                        <div class="dim-acoes">
                            <div class="icon-btn" title="Editar" onclick="editarDimensao('${d.id}')"><span class="material-symbols-rounded">edit</span></div>
                            <div class="icon-btn danger" title="Excluir" onclick="excluirDimensao('${d.id}')"><span class="material-symbols-rounded">delete</span></div>
                        </div>
                    </div>
                    ${perbs.map(pg => `
                        <div class="perg-item">
                            <span class="perg-tipo">${tipoLabel(pg.tipo)}</span>
                            <span class="perg-texto">${escH(pg.texto)}</span>
                            <div class="perg-acoes">
                                <div class="icon-btn" title="Editar" onclick="editarPergunta('${d.id}','${pg.id}')"><span class="material-symbols-rounded">edit</span></div>
                                <div class="icon-btn danger" title="Excluir" onclick="excluirPergunta('${pg.id}')"><span class="material-symbols-rounded">delete</span></div>
                            </div>
                        </div>`).join('') || '<div class="perg-vazia">Sem perguntas nesta dimensão.</div>'}
                    <div class="add-inline" onclick="novaPergunta('${d.id}')"><span class="material-symbols-rounded">add</span>Nova pergunta</div>
                </div>`;
            }).join('');
            principal += `<div class="add-inline" style="margin:0;" onclick="novaDimensao()"><span class="material-symbols-rounded">add</span>Nova dimensão</div>`;

            const lideres = p.lideres || [];
            const setores = p.setores || [];
            const lado = `
                <div class="lado">
                    <div class="lado-tit"><span class="material-symbols-rounded">link</span>Link da pesquisa</div>
                    ${emColeta ? `
                        <div class="link-box">
                            <input type="text" id="linkResp" value="${link}" readonly onclick="this.select()">
                            <span class="link-copiar" onclick="copiarLink()" title="Copiar"><span class="material-symbols-rounded">content_copy</span></span>
                        </div>
                        <div class="cfg-hint" style="margin:8px 0 0;">Anônimo. Nenhum dado de identificação é gravado junto da resposta.</div>`
                        : `<div class="cfg-hint" style="margin:0;">Publique a pesquisa para gerar o link de resposta anônimo.</div>`}
                </div>

                <div class="lado">
                    <div class="lado-tit"><span class="material-symbols-rounded">domain</span>Setores<span class="lado-qtd num">${setores.length}</span></div>
                    <div class="cfg-hint">O respondente escolhe o dele — permite cruzar o clima por área.</div>
                    <div>${setores.map(s => `<span class="chip-item"><span>${escH(s.nome)}</span>
                        <div class="icon-btn danger" onclick="excluirSetor('${s.id}')"><span class="material-symbols-rounded">close</span></div></span>`).join('')
                        || '<div class="cfg-hint" style="margin:0;">Nenhum setor cadastrado.</div>'}</div>
                    <div class="add-row">
                        <input type="text" id="novoSetorNome" placeholder="Nome do setor" onkeydown="if(event.key==='Enter')addSetor()">
                        <button onclick="addSetor()" title="Adicionar"><span class="material-symbols-rounded" style="font-size:19px;">add</span></button>
                    </div>
                </div>

                <div class="lado">
                    <div class="lado-tit"><span class="material-symbols-rounded">supervisor_account</span>Líderes<span class="lado-qtd num">${lideres.length}</span></div>
                    <div class="cfg-hint">O respondente marca o(s) dele(s), e as perguntas de liderança se repetem para cada um.</div>
                    <div>${lideres.map(l => `<span class="chip-item"><span>${escH(l.nome)}${l.cargo?` <span class="chip-cargo">· ${escH(l.cargo)}</span>`:''}</span>
                        <div class="icon-btn danger" onclick="excluirLider('${l.id}')"><span class="material-symbols-rounded">close</span></div></span>`).join('')
                        || '<div class="cfg-hint" style="margin:0;">Nenhum líder cadastrado.</div>'}</div>
                    <div class="add-row">
                        <input type="text" id="novoLiderNome" placeholder="Nome do líder" onkeydown="if(event.key==='Enter')addLider()">
                        <button onclick="addLider()" title="Adicionar"><span class="material-symbols-rounded" style="font-size:19px;">add</span></button>
                    </div>
                </div>`;

            document.getElementById('conteudo').innerHTML = `
                <div class="migalha">
                    <a onclick="renderLista()">Pesquisas</a>
                    <span class="material-symbols-rounded">chevron_right</span>
                    <span>${escH(nomeCliente(p.cliente_id))}</span>
                    <span class="material-symbols-rounded">chevron_right</span>
                    <b>${escH(p.titulo)}</b>
                </div>
                ${esteira}
                <div class="editor"><div>${principal}</div><div>${lado}</div></div>`;
        }

        // ===== AÇÕES: STATUS, LINK =====
        async function mudarStatus(novo) {
            try {
                const res = await fetch('/api/clima/pesquisa/' + pesquisaAberta.id, { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ status: novo }) });
                if (res.ok) { pesquisaAberta.status = novo; showToast(novo==='ativa'?'Pesquisa publicada!':novo==='encerrada'?'Coleta encerrada.':'Atualizado.', 'success'); renderEditor(); }
                else showToast('Erro ao atualizar.', 'error');
            } catch(e) { showToast('Erro de conexão.', 'error'); }
        }
        function copiarLink() { const el=document.getElementById('linkResp'); el.select(); navigator.clipboard.writeText(el.value).then(()=>showToast('Link copiado!', 'success')); }


        // ===== DIMENSÕES =====
        function novaDimensao() { ctxDim={modo:'nova'}; document.getElementById('modalDimTitulo').textContent='Nova dimensão'; document.getElementById('dimNome').value=''; document.getElementById('dimLideranca').checked=false; document.getElementById('modalDimensao').classList.add('show'); }
        function editarDimensao(did) { const d=(pesquisaAberta.dimensoes||[]).find(x=>x.id===did); if(!d)return; ctxDim={modo:'editar', id:did}; document.getElementById('modalDimTitulo').textContent='Editar dimensão'; document.getElementById('dimNome').value=d.nome; document.getElementById('dimLideranca').checked=!!d.eh_lideranca; document.getElementById('modalDimensao').classList.add('show'); }
        async function salvarDimensao() {
            const nome=document.getElementById('dimNome').value.trim();
            if(!nome){ showToast('Informe o nome.', 'error'); return; }
            const payload={ nome, eh_lideranca: document.getElementById('dimLideranca').checked };
            if(ctxDim.modo==='editar') payload.id=ctxDim.id; else payload.pesquisa_id=pesquisaAberta.id;
            try {
                const res=await fetch('/api/clima/dimensao', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
                if(res.ok){ showToast('Salvo!', 'success'); fecharModal('modalDimensao'); await recarregarPesquisa(); }
                else showToast('Erro ao salvar.', 'error');
            } catch(e){ showToast('Erro de conexão.', 'error'); }
        }
        async function excluirDimensao(did) {
            if(!confirm('Excluir esta dimensão e todas as suas perguntas?')) return;
            try { const res=await fetch('/api/clima/dimensao/'+did, {method:'DELETE'}); if(res.ok){ showToast('Excluída.', 'success'); await recarregarPesquisa(); } } catch(e){ showToast('Erro.', 'error'); }
        }

        // ===== PERGUNTAS =====
        function novaPergunta(did) { ctxDim={modo:'nova', dimensao_id:did}; document.getElementById('modalPergTitulo').textContent='Nova pergunta'; document.getElementById('pergTexto').value=''; document.getElementById('pergTipo').value='likert'; document.getElementById('modalPergunta').classList.add('show'); }
        function editarPergunta(did, pid) {
            const d=(pesquisaAberta.dimensoes||[]).find(x=>x.id===did); if(!d)return;
            const pg=(d.perguntas||[]).find(x=>x.id===pid); if(!pg)return;
            ctxDim={modo:'editar', id:pid}; document.getElementById('modalPergTitulo').textContent='Editar pergunta';
            document.getElementById('pergTexto').value=pg.texto; document.getElementById('pergTipo').value=pg.tipo;
            document.getElementById('modalPergunta').classList.add('show');
        }
        async function salvarPergunta() {
            const texto=document.getElementById('pergTexto').value.trim();
            if(!texto){ showToast('Informe o texto.', 'error'); return; }
            const payload={ texto, tipo: document.getElementById('pergTipo').value };
            if(ctxDim.modo==='editar') payload.id=ctxDim.id; else payload.dimensao_id=ctxDim.dimensao_id;
            try {
                const res=await fetch('/api/clima/pergunta', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
                if(res.ok){ showToast('Salvo!', 'success'); fecharModal('modalPergunta'); await recarregarPesquisa(); }
                else showToast('Erro ao salvar.', 'error');
            } catch(e){ showToast('Erro de conexão.', 'error'); }
        }
        async function excluirPergunta(pid) {
            if(!confirm('Excluir esta pergunta?')) return;
            try { const res=await fetch('/api/clima/pergunta/'+pid, {method:'DELETE'}); if(res.ok){ showToast('Excluída.', 'success'); await recarregarPesquisa(); } } catch(e){ showToast('Erro.', 'error'); }
        }

        // ===== LÍDERES E SETORES =====
        async function addLider() {
            const nome=document.getElementById('novoLiderNome').value.trim();
            if(!nome) return;
            try { const res=await fetch('/api/clima/lider', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ cliente_id: pesquisaAberta.cliente_id, nome })});
                if(res.ok){ await recarregarPesquisa(); } } catch(e){ showToast('Erro.', 'error'); }
        }
        async function excluirLider(lid) {
            try { const res=await fetch('/api/clima/lider/'+lid, {method:'DELETE'}); if(res.ok){ await recarregarPesquisa(); } } catch(e){ showToast('Erro.', 'error'); }
        }
        async function addSetor() {
            const nome=document.getElementById('novoSetorNome').value.trim();
            if(!nome) return;
            try { const res=await fetch('/api/clima/setor', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ cliente_id: pesquisaAberta.cliente_id, nome })});
                if(res.ok){ await recarregarPesquisa(); } } catch(e){ showToast('Erro.', 'error'); }
        }
        async function excluirSetor(sid) {
            try { const res=await fetch('/api/clima/setor/'+sid, {method:'DELETE'}); if(res.ok){ await recarregarPesquisa(); } } catch(e){ showToast('Erro.', 'error'); }
        }

        async function recarregarPesquisa() {
            const res = await fetch('/api/clima/pesquisa/' + pesquisaAberta.id);
            const data = await res.json();
            if (res.ok) { pesquisaAberta = data.pesquisa; renderEditor(); }
        }

        // ===== MODELO BASE =====
        async function abrirModelo() {
            modeloAberto = true; pesquisaAberta = null;
            document.getElementById('acoesTopo').style.display = 'none';
            document.getElementById('selCliente').style.display = 'none';
            document.getElementById('conteudo').innerHTML = '<div class="loading">Carregando modelo base...</div>';
            try {
                const res = await fetch('/api/clima/modelo');
                const data = await res.json();
                renderModelo(data.dimensoes || []);
            } catch(e) { showToast('Erro ao carregar modelo.', 'error'); }
        }

        function renderModelo(dims) {
            let html = `
                <div class="breadcrumb">
                    <span class="crumb" onclick="renderLista()"><span class="material-symbols-rounded" style="font-size:16px;">arrow_back</span> Pesquisas</span>
                    <span class="sep">/</span>
                    <span class="crumb active">Modelo base</span>
                </div>
                <div class="editor-head">
                    <div class="editor-titulo">Modelo base</div>
                    <div class="editor-desc">Este é o template mestre. Toda pesquisa nova parte dele. Editar aqui afeta apenas as próximas pesquisas — as já criadas são independentes.</div>
                </div>`;
            dims.forEach(d => {
                html += `
                <div class="dim-bloco">
                    <div class="dim-head">
                        <div class="dim-nome">${escH(d.nome)} ${d.eh_lideranca?'<span class="dim-lideranca-tag">Liderança</span>':''}</div>
                        <div class="dim-acoes">
                            <div class="icon-btn" onclick="editarDimModelo('${d.id}')" title="Editar"><span class="material-symbols-rounded" style="font-size:18px;">edit</span></div>
                            <div class="icon-btn danger" onclick="excluirDimModelo('${d.id}')" title="Excluir"><span class="material-symbols-rounded" style="font-size:18px;">delete</span></div>
                        </div>
                    </div>
                    <div class="perg-lista">
                        ${(d.perguntas||[]).map(pg => `
                            <div class="perg-item">
                                <div class="perg-tipo-icon"><span class="material-symbols-rounded">${tipoIcon(pg.tipo)}</span></div>
                                <div class="perg-texto">${escH(pg.texto)}<div class="perg-tipo-label">${tipoLabel(pg.tipo)}</div></div>
                                <div class="perg-acoes">
                                    <div class="icon-btn" onclick="editarPergModelo('${d.id}','${pg.id}')"><span class="material-symbols-rounded" style="font-size:17px;">edit</span></div>
                                    <div class="icon-btn danger" onclick="excluirPergModelo('${pg.id}')"><span class="material-symbols-rounded" style="font-size:17px;">delete</span></div>
                                </div>
                            </div>`).join('') || '<div style="padding:14px 24px; font-size:12px; color:var(--text-muted);">Sem perguntas.</div>'}
                        <div class="add-inline" onclick="novaPergModelo('${d.id}')"><span class="material-symbols-rounded" style="font-size:16px;">add</span> Adicionar pergunta</div>
                    </div>
                </div>`;
            });
            html += `<button class="btn-sec" style="margin-top:6px;" onclick="novaDimModelo()"><span class="material-symbols-rounded" style="font-size:17px;">add</span> Adicionar dimensão</button>`;
            document.getElementById('conteudo').innerHTML = html;
        }

        // Modelo: dimensões
        function novaDimModelo() { ctxDim={modo:'nova', modelo:true}; document.getElementById('modalDimTitulo').textContent='Nova dimensão (modelo)'; document.getElementById('dimNome').value=''; document.getElementById('dimLideranca').checked=false; document.getElementById('modalDimensao').classList.add('show'); }
        function editarDimModelo(did) { ctxDim={modo:'editar', id:did, modelo:true}; const el=document.getElementById('modalDimTitulo'); el.textContent='Editar dimensão'; fetch('/api/clima/modelo').then(r=>r.json()).then(data=>{ const d=(data.dimensoes||[]).find(x=>x.id===did); if(d){ document.getElementById('dimNome').value=d.nome; document.getElementById('dimLideranca').checked=!!d.eh_lideranca; document.getElementById('modalDimensao').classList.add('show'); } }); }
        async function excluirDimModelo(did) { if(!confirm('Excluir esta dimensão do modelo base?')) return; const res=await fetch('/api/clima/modelo/dimensao/'+did, {method:'DELETE'}); if(res.ok){ showToast('Excluída.', 'success'); abrirModelo(); } }

        // Modelo: perguntas
        function novaPergModelo(did) { ctxDim={modo:'nova', dimensao_id:did, modelo:true}; document.getElementById('modalPergTitulo').textContent='Nova pergunta (modelo)'; document.getElementById('pergTexto').value=''; document.getElementById('pergTipo').value='likert'; document.getElementById('modalPergunta').classList.add('show'); }
        function editarPergModelo(did, pid) { fetch('/api/clima/modelo').then(r=>r.json()).then(data=>{ const d=(data.dimensoes||[]).find(x=>x.id===did); const pg=d&&(d.perguntas||[]).find(x=>x.id===pid); if(pg){ ctxDim={modo:'editar', id:pid, modelo:true}; document.getElementById('modalPergTitulo').textContent='Editar pergunta'; document.getElementById('pergTexto').value=pg.texto; document.getElementById('pergTipo').value=pg.tipo; document.getElementById('modalPergunta').classList.add('show'); } }); }
        async function excluirPergModelo(pid) { if(!confirm('Excluir esta pergunta do modelo?')) return; const res=await fetch('/api/clima/modelo/pergunta/'+pid, {method:'DELETE'}); if(res.ok){ showToast('Excluída.', 'success'); abrirModelo(); } }

        // Salvamento unificado (detecta se é modelo ou pesquisa via ctxDim.modelo)
        const _salvarDimensaoOrig = salvarDimensao;
        salvarDimensao = async function() {
            if (!ctxDim.modelo) return _salvarDimensaoOrig();
            const nome=document.getElementById('dimNome').value.trim();
            if(!nome){ showToast('Informe o nome.', 'error'); return; }
            const payload={ nome, eh_lideranca: document.getElementById('dimLideranca').checked };
            if(ctxDim.modo==='editar') payload.id=ctxDim.id;
            const res=await fetch('/api/clima/modelo/dimensao', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)});
            if(res.ok){ showToast('Salvo!', 'success'); fecharModal('modalDimensao'); abrirModelo(); } else showToast('Erro.', 'error');
        };
        const _salvarPerguntaOrig = salvarPergunta;
        salvarPergunta = async function() {
            if (!ctxDim.modelo) return _salvarPerguntaOrig();
            const texto=document.getElementById('pergTexto').value.trim();
            if(!texto){ showToast('Informe o texto.', 'error'); return; }
            const payload={ texto, tipo: document.getElementById('pergTipo').value };
            if(ctxDim.modo==='editar') payload.id=ctxDim.id; else payload.dimensao_id=ctxDim.dimensao_id;
            const res=await fetch('/api/clima/modelo/pergunta', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)});
            if(res.ok){ showToast('Salvo!', 'success'); fecharModal('modalPergunta'); abrirModelo(); } else showToast('Erro.', 'error');
        };

        document.querySelectorAll('.modal-overlay').forEach(function(m){
            m.addEventListener('click', function(e){ if(e.target===this) this.classList.remove('show'); });
        });
        document.addEventListener('keydown', function(e){
            if(e.key==='Escape') document.querySelectorAll('.modal-overlay.show').forEach(m=>m.classList.remove('show'));
        });
    </script>
</body>
</html>
