<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OKR | core.cx</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='core-cx-favicon.png') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        :root{
            --mesa:#EFEFF3; --papel:#FFF; --papel-2:#F7F7F9;
            --linha:#E4E4EA; --linha-2:#D3D3DC;
            --tinta:#17171A; --tinta-2:#56565F; --tinta-3:#7C7C88;
            --acao:#6C5CE7; --acao-fraco:#F1EFFE;
            --ok:#0E9F6E; --ok-fraco:#E6F7F0;
            --atencao:#C2660B; --at-fundo:#FFF0D6; --at-borda:#E5BE7F;
            --critico:#D42F2F; --cr-fundo:#FBE3E3; --cr-borda:#E9A9A9;
            --r-card:12px; --r-ctrl:9px; --r-pill:999px;
            --e1:0 1px 2px rgba(23,23,26,.05), 0 0 0 1px var(--linha);
            --e2:0 4px 14px rgba(23,23,26,.07), 0 0 0 1px var(--linha);
            --e3:0 16px 44px rgba(23,23,26,.14), 0 0 0 1px var(--linha);
            /* nomes antigos, para estilos herdados não quebrarem */
            --green:#0E9F6E; --amber:#C2660B; --red:#D42F2F;
            --accent-lime:#BEF533; --accent-pink:#FF43C0;
        }
        *,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
        button,input,select,textarea{ font-family:inherit; border:none; }
        body{
            font-family:'Inter',system-ui,sans-serif; background:var(--mesa); color:var(--tinta);
            height:100vh; overflow:hidden; display:flex; flex-direction:column;
            -webkit-font-smoothing:antialiased;
        }
        .num{ font-family:'IBM Plex Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums; letter-spacing:-.2px; }
        :focus-visible{ outline:2px solid var(--acao); outline-offset:2px; border-radius:4px; }
        @media (prefers-reduced-motion:reduce){ *{ animation:none!important; transition:none!important; } }
        ::-webkit-scrollbar{ width:8px; height:8px; }
        ::-webkit-scrollbar-track{ background:transparent; }
        ::-webkit-scrollbar-thumb{ background:var(--linha-2); border-radius:99px; }

        /* ===== TOPO ===== */
        .top-bar{
            background:var(--papel); height:56px; min-height:56px; flex-shrink:0;
            padding:0 22px; display:flex; justify-content:space-between; align-items:center;
            border-bottom:1px solid var(--linha); z-index:10;
        }
        .top-bar-logo{ font-size:17px; font-weight:700; letter-spacing:-.4px; cursor:pointer; }
        .top-bar-logo span{ color:var(--acao); }

        .cmd{
            display:flex; align-items:center; gap:12px; padding:0 22px; height:56px;
            flex-shrink:0; background:var(--papel); border-bottom:1px solid var(--linha); flex-wrap:wrap;
        }
        .cmd-tit{ font-size:16px; font-weight:650; letter-spacing:-.35px; white-space:nowrap; }
        .cmd-sep{ width:1px; height:22px; background:var(--linha); }
        .cliente-sel{
            font-size:13px; font-weight:500; color:var(--tinta); padding:7px 11px;
            background:var(--papel-2); border:1px solid transparent; border-radius:var(--r-ctrl);
            outline:none; cursor:pointer; max-width:260px;
        }
        .cliente-sel:focus{ background:var(--papel); border-color:var(--acao); box-shadow:0 0 0 3px var(--acao-fraco); }
        .cmd-dir{ margin-left:auto; display:flex; align-items:center; gap:9px; }

        .btn{
            font-size:13px; font-weight:600; cursor:pointer; display:inline-flex; align-items:center;
            gap:7px; padding:8px 14px; border-radius:var(--r-ctrl); transition:.15s; white-space:nowrap;
        }
        .btn .material-symbols-rounded{ font-size:18px; }
        .btn-sec{ background:var(--papel-2); color:var(--tinta-2); }
        .btn-sec:hover{ background:var(--linha); color:var(--tinta); }
        .btn-acao{ background:var(--acao); color:#fff; }
        .btn-acao:hover{ background:#5a4bd4; }
        .btn-acao:disabled{ background:var(--tinta-3); cursor:not-allowed; }

        /* ===== CORPO: conteúdo + painel lateral ===== */
        .corpo{ flex:1; display:grid; grid-template-columns:1fr; min-height:0; transition:grid-template-columns .22s ease; }
        .corpo.com-painel{ grid-template-columns:1fr 340px; }
        .scroll-area{ overflow-y:auto; padding:18px 22px 26px; }

        .empty{ text-align:center; padding:70px 24px; color:var(--tinta-3); }
        .empty .material-symbols-rounded{ font-size:46px; opacity:.25; display:block; margin-bottom:14px; }
        .empty h3{ font-size:15px; font-weight:650; color:var(--tinta-2); margin-bottom:6px; }
        .empty p{ font-size:13px; font-weight:500; line-height:1.6; max-width:380px; margin:0 auto; }
        .loading{ text-align:center; padding:60px; color:var(--tinta-3); font-size:13px; font-weight:500; }

        /* ===== FAIXA DE RESUMO ===== */
        .resumo{ display:grid; grid-template-columns:repeat(auto-fit,minmax(148px,1fr)); gap:11px; margin-bottom:16px; }
        .rz{ background:var(--papel); border-radius:var(--r-card); box-shadow:var(--e1); padding:13px 15px; }
        .rz-rot{ font-size:10.5px; font-weight:600; text-transform:uppercase; letter-spacing:.5px; color:var(--tinta-3); margin-bottom:6px; }
        .rz-val{ font-size:22px; font-weight:700; letter-spacing:-.7px; line-height:1; }
        .rz-pe{ font-size:11px; color:var(--tinta-3); font-weight:500; margin-top:5px; }
        .rz.alerta{ background:var(--cr-fundo); box-shadow:0 1px 2px rgba(23,23,26,.05),0 0 0 1px var(--cr-borda); }
        .rz.alerta .rz-val{ color:var(--critico); }

        /* ===== MACRO OBJETIVO ===== */
        .macro{
            background:var(--papel); border-radius:var(--r-card); box-shadow:var(--e1);
            padding:15px 17px; margin-bottom:16px; cursor:pointer; transition:box-shadow .16s; position:relative;
        }
        .macro:hover{ box-shadow:var(--e2); }
        .macro-rot{ font-size:10.5px; font-weight:600; text-transform:uppercase; letter-spacing:.5px; color:var(--tinta-3); margin-bottom:6px; }
        .macro-tit{ font-size:15px; font-weight:650; letter-spacing:-.25px; line-height:1.4; padding-right:28px; }
        .macro-tit.vazio{ color:var(--tinta-3); font-weight:500; }
        .macro-edit{ position:absolute; top:13px; right:13px; color:var(--tinta-3); display:flex; opacity:0; transition:.15s; }
        .macro:hover .macro-edit{ opacity:1; }
        .macro-edit .material-symbols-rounded{ font-size:17px; }

        .secao-rot{
            font-size:10.5px; font-weight:600; text-transform:uppercase; letter-spacing:.6px;
            color:var(--tinta-3); margin:0 0 11px 2px; display:flex; align-items:center; gap:10px;
        }
        .secao-rot::after{ content:''; flex:1; height:1px; background:var(--linha); }

        /* ===== CARD DE DEPARTAMENTO ===== */
        .dept-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(248px,1fr)); gap:11px; }
        .dept-card{
            background:var(--papel); border-radius:var(--r-card); box-shadow:var(--e1);
            padding:15px 16px; cursor:pointer; transition:box-shadow .16s, transform .16s; position:relative;
        }
        .dept-card:hover{ box-shadow:var(--e2); transform:translateY(-1px); }
        .dept-card.atencao{ background:var(--at-fundo); box-shadow:0 1px 2px rgba(23,23,26,.05),0 0 0 1px var(--at-borda); }
        .dept-card.critico{ background:var(--cr-fundo); box-shadow:0 1px 2px rgba(23,23,26,.05),0 0 0 1px var(--cr-borda); }
        .dept-top{ display:flex; align-items:center; gap:8px; margin-bottom:11px; }
        .dept-nome{ font-size:13.5px; font-weight:600; letter-spacing:-.15px; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .dept-acoes{ display:flex; gap:3px; opacity:0; transition:.15s; }
        .dept-card:hover .dept-acoes{ opacity:1; }
        .btn-mini{
            width:24px; height:24px; border-radius:6px; background:rgba(0,0,0,.05); color:var(--tinta-3);
            display:flex; align-items:center; justify-content:center; cursor:pointer; transition:.15s;
        }
        .btn-mini:hover{ background:var(--acao); color:#fff; }
        .btn-mini.danger:hover{ background:var(--critico); color:#fff; }
        .btn-mini .material-symbols-rounded{ font-size:15px; }
        .dept-pct{ font-size:24px; font-weight:700; letter-spacing:-.8px; line-height:1; margin-bottom:9px; }
        .barra{ height:6px; background:rgba(0,0,0,.07); border-radius:99px; overflow:hidden; }
        .barra-fill{ height:100%; border-radius:99px; transition:width .4s; }
        .dept-pe{ display:flex; align-items:center; gap:11px; margin-top:11px; font-size:11px; color:var(--tinta-3); font-weight:500; flex-wrap:wrap; }
        .dept-pe span{ display:flex; align-items:center; gap:4px; }
        .dept-pe .material-symbols-rounded{ font-size:14px; }
        .pe-critico{ color:var(--critico); font-weight:600; }
        .pe-atencao{ color:var(--atencao); font-weight:600; }

        /* ===== NÍVEL 2 ===== */
        .migalha{ display:flex; align-items:center; gap:7px; margin-bottom:14px; font-size:12.5px; color:var(--tinta-3); font-weight:500; flex-wrap:wrap; }
        .migalha a{ color:var(--acao); cursor:pointer; font-weight:550; }
        .migalha a:hover{ text-decoration:underline; }
        .migalha .material-symbols-rounded{ font-size:15px; }
        .migalha b{ color:var(--tinta); font-weight:600; }

        .obj{ background:var(--papel); border-radius:var(--r-card); box-shadow:var(--e1); overflow:hidden; margin-bottom:11px; }
        .obj-cab{ padding:13px 16px; display:flex; align-items:center; gap:11px; border-bottom:1px solid var(--linha); }
        .obj-tit{ font-size:13.5px; font-weight:600; letter-spacing:-.15px; flex:1; min-width:0; }
        .obj-pct{ font-size:13px; font-weight:650; white-space:nowrap; }
        .obj-acoes{ display:flex; gap:3px; opacity:0; transition:.15s; }
        .obj:hover .obj-acoes{ opacity:1; }

        .kr-grade{ display:grid; grid-template-columns:repeat(auto-fill,minmax(252px,1fr)); gap:10px; padding:12px 14px; }
        .kr-card{
            background:var(--papel); border-radius:11px; box-shadow:0 1px 2px rgba(0,0,0,.04),0 0 0 1px var(--linha);
            padding:13px; cursor:pointer; transition:box-shadow .16s, transform .16s;
            display:flex; gap:12px; align-items:flex-start; text-align:left; width:100%; position:relative;
        }
        .kr-card:hover{ box-shadow:var(--e2); transform:translateY(-1px); }
        .kr-card.venc{ background:var(--cr-fundo); box-shadow:0 1px 2px rgba(0,0,0,.04),0 0 0 1px var(--cr-borda); }
        .kr-card.sel{ box-shadow:0 4px 14px rgba(108,92,231,.16),0 0 0 1.5px var(--acao); }
        .anel{ position:relative; flex-shrink:0; }
        .anel svg{ transform:rotate(-90deg); display:block; }
        .anel-txt{
            position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
            font-size:14px; font-weight:700; letter-spacing:-.4px;
            font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums;
        }
        .kr-corpo{ flex:1; min-width:0; }
        .kr-desc{ font-size:12.5px; font-weight:550; color:var(--tinta); line-height:1.4; margin-bottom:7px; }
        .kr-vals{ display:flex; align-items:baseline; gap:5px; margin-bottom:8px; }
        .kr-atual{ font-size:14.5px; font-weight:650; font-family:'IBM Plex Mono',monospace; letter-spacing:-.3px; cursor:text; border-radius:4px; padding:0 2px; }
        .kr-atual:hover{ background:var(--acao-fraco); color:var(--acao); }
        .kr-meta{ font-size:11.5px; color:var(--tinta-3); font-family:'IBM Plex Mono',monospace; }
        .kr-val-input{
            width:88px; font-size:14px; font-weight:650; font-family:'IBM Plex Mono',monospace;
            padding:2px 6px; border:1.5px solid var(--acao); border-radius:6px; outline:none; background:var(--papel);
        }
        .kr-pe{ display:flex; align-items:center; gap:7px; }
        .selo{
            font-size:10.5px; font-weight:600; padding:3px 8px; border-radius:99px; white-space:nowrap;
            background:var(--papel-2); color:var(--tinta-3); display:inline-flex; align-items:center; gap:4px;
        }
        .selo .material-symbols-rounded{ font-size:13px; }
        .selo.venc{ background:rgba(212,47,47,.12); color:var(--critico); }
        .kr-menu{
            width:24px; height:24px; border-radius:6px; background:rgba(0,0,0,.05); color:var(--tinta-3);
            display:flex; align-items:center; justify-content:center; cursor:pointer; transition:.15s;
            margin-left:auto; flex-shrink:0; opacity:0;
        }
        .kr-card:hover .kr-menu{ opacity:1; }
        .kr-menu:hover{ background:var(--acao); color:#fff; }
        .kr-menu .material-symbols-rounded{ font-size:15px; }
        .kr-vazio{ padding:16px 14px; }

        .add-linha{
            display:flex; align-items:center; justify-content:center; gap:7px; padding:10px;
            border:1.5px dashed var(--linha-2); border-radius:10px; cursor:pointer;
            font-size:12.5px; font-weight:550; color:var(--tinta-3); transition:.15s; margin:0 14px 12px;
        }
        .add-linha:hover{ border-color:var(--acao); color:var(--acao); background:var(--acao-fraco); }
        .add-linha .material-symbols-rounded{ font-size:17px; }

        /* ===== PAINEL LATERAL DE TAREFAS ===== */
        .dw{ background:var(--papel); border-left:1px solid var(--linha); display:none; flex-direction:column; min-height:0; position:relative; }
        .corpo.com-painel .dw{ display:flex; }
        .dw-cab{ padding:15px 17px; border-bottom:1px solid var(--linha); flex-shrink:0; }
        .dw-rot{ font-size:10.5px; font-weight:600; text-transform:uppercase; letter-spacing:.5px; color:var(--tinta-3); margin-bottom:5px; }
        .dw-tit{ font-size:14px; font-weight:650; letter-spacing:-.2px; line-height:1.35; padding-right:32px; }
        .dw-medida{ display:flex; align-items:center; gap:13px; margin-top:13px; }
        .dw-num{ display:flex; align-items:baseline; gap:6px; }
        .dw-atual{ font-size:17px; font-weight:650; font-family:'IBM Plex Mono',monospace; letter-spacing:-.4px; }
        .dw-meta{ font-size:12px; color:var(--tinta-3); font-family:'IBM Plex Mono',monospace; }
        .dw-fechar{
            position:absolute; top:13px; right:13px; width:26px; height:26px; border-radius:7px;
            background:var(--papel-2); color:var(--tinta-3); cursor:pointer;
            display:flex; align-items:center; justify-content:center; transition:.15s;
        }
        .dw-fechar:hover{ background:var(--linha); color:var(--tinta); }
        .dw-fechar .material-symbols-rounded{ font-size:16px; }
        .dw-corpo{ flex:1; overflow-y:auto; padding:13px 17px; }
        .dw-secao{ font-size:10.5px; font-weight:600; text-transform:uppercase; letter-spacing:.5px; color:var(--tinta-3); margin:2px 0 10px; }
        .dw-pe{ padding:12px 17px; border-top:1px solid var(--linha); flex-shrink:0; }

        .tf{ display:flex; align-items:flex-start; gap:10px; padding:10px 0; border-bottom:1px solid var(--papel-2); }
        .tf:last-child{ border-bottom:none; }
        .tf-check{
            width:17px; height:17px; min-width:17px; border-radius:5px; border:1.5px solid var(--linha-2);
            cursor:pointer; margin-top:1px; display:flex; align-items:center; justify-content:center;
            background:var(--papel); transition:.15s; padding:0;
        }
        .tf-check:hover{ border-color:var(--ok); }
        .tf-check.feito{ background:var(--ok); border-color:var(--ok); color:#fff; }
        .tf-check.andamento{ border-color:var(--acao); background:var(--acao-fraco); }
        .tf-check .material-symbols-rounded{ font-size:12px; opacity:0; }
        .tf-check.feito .material-symbols-rounded{ opacity:1; }
        .tf-corpo{ flex:1; min-width:0; }
        .tf-desc{ font-size:12.5px; font-weight:500; color:var(--tinta); line-height:1.45; }
        .tf.ok .tf-desc{ color:var(--tinta-3); text-decoration:line-through; }
        .tf-meta{ display:flex; align-items:center; gap:9px; margin-top:5px; font-size:11px; color:var(--tinta-3); font-weight:500; flex-wrap:wrap; }
        .tf-meta .material-symbols-rounded{ font-size:13px; }
        .tf-prazo{ display:flex; align-items:center; gap:3px; font-family:'IBM Plex Mono',monospace; }
        .tf-prazo.venc{ color:var(--critico); font-weight:600; }
        .tf-link{ color:var(--acao); display:flex; align-items:center; gap:3px; cursor:pointer; }
        .tf-menu{ color:var(--tinta-3); cursor:pointer; display:flex; border-radius:5px; padding:2px; opacity:0; transition:.15s; flex-shrink:0; }
        .tf:hover .tf-menu{ opacity:1; }
        .tf-menu:hover{ background:var(--papel-2); color:var(--tinta); }
        .tf-menu .material-symbols-rounded{ font-size:16px; }
        .dw-vazio{ padding:40px 16px; text-align:center; color:var(--tinta-3); }
        .dw-vazio .material-symbols-rounded{ font-size:34px; opacity:.28; display:block; margin-bottom:11px; }
        .dw-vazio p{ font-size:12.5px; font-weight:500; line-height:1.55; }

        /* ===== MENU FLUTUANTE ===== */
        .menu-flutuante{
            position:fixed; z-index:900; width:172px; background:var(--papel);
            border-radius:11px; box-shadow:var(--e3); overflow:hidden; padding:5px;
        }
        .menu-item{
            display:flex; align-items:center; gap:9px; padding:8px 9px; border-radius:7px;
            font-size:12.5px; font-weight:500; color:var(--tinta-2); cursor:pointer; transition:.14s;
        }
        .menu-item:hover{ background:var(--papel-2); color:var(--tinta); }
        .menu-item.danger{ color:var(--critico); }
        .menu-item.danger:hover{ background:#FDEDED; }
        .menu-item .material-symbols-rounded{ font-size:16px; }

        /* ===== MODAL ===== */
        .modal-overlay{
            position:fixed; inset:0; background:rgba(23,23,26,.45); z-index:1000;
            display:none; align-items:center; justify-content:center; padding:20px;
        }
        .modal-overlay.show{ display:flex; }
        .modal-box{ background:var(--papel); border-radius:16px; box-shadow:var(--e3); width:100%; max-width:470px; overflow:hidden; }
        .modal-header{ padding:17px 20px 15px; border-bottom:1px solid var(--linha); display:flex; align-items:center; justify-content:space-between; gap:12px; }
        .modal-title{ font-size:16px; font-weight:650; letter-spacing:-.3px; }
        .btn-icon-round{
            width:28px; height:28px; border-radius:8px; background:var(--papel-2); color:var(--tinta-3);
            display:flex; align-items:center; justify-content:center; cursor:pointer; transition:.15s; flex-shrink:0;
        }
        .btn-icon-round:hover{ background:var(--linha); color:var(--tinta); }
        #modalCorpo{ padding:18px 20px; display:flex; flex-direction:column; gap:15px; }
        .input-group label{ display:block; font-size:11px; font-weight:600; color:var(--tinta-3); text-transform:uppercase; letter-spacing:.5px; margin-bottom:7px; }
        .input-group input, .input-group textarea, .input-group select{
            width:100%; font-size:13px; color:var(--tinta); padding:9px 11px; background:var(--papel-2);
            border:1px solid transparent; border-radius:var(--r-ctrl); outline:none; transition:.15s;
        }
        .input-group textarea{ resize:vertical; min-height:70px; line-height:1.5; }
        .input-group input:focus, .input-group textarea:focus, .input-group select:focus{
            background:var(--papel); border-color:var(--acao); box-shadow:0 0 0 3px var(--acao-fraco);
        }
        .input-row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
        .modal-footer{ padding:13px 20px; border-top:1px solid var(--linha); display:flex; gap:9px; justify-content:flex-end; background:var(--papel-2); }

        /* ===== TOAST ===== */
        .toast-container{ position:fixed; bottom:26px; left:50%; transform:translateX(-50%); z-index:10001; display:flex; flex-direction:column; gap:9px; }
        .toast{
            background:rgba(23,23,26,.95); color:#fff; padding:11px 20px; border-radius:var(--r-pill);
            font-size:12.5px; font-weight:500; box-shadow:0 10px 30px rgba(0,0,0,.2);
            display:flex; align-items:center; gap:9px; animation:sobe .3s ease forwards;
        }
        @keyframes sobe{ from{ opacity:0; transform:translateY(14px);} to{ opacity:1; transform:translateY(0);} }

        /* ===== RESPONSIVO ===== */
        @media (max-width:1100px){
            .corpo.com-painel{ grid-template-columns:1fr; }
            .dw{
                position:fixed; top:0; right:0; bottom:0; width:340px; max-width:88vw;
                z-index:800; box-shadow:-14px 0 44px rgba(23,23,26,.16); border-left:none;
            }
        }
        @media (max-width:900px){
            body{ height:auto; min-height:100vh; overflow:visible; }
            .top-bar{ padding:0 16px 0 60px; }
            .cmd{ padding:10px 16px; height:auto; row-gap:9px; }
            .cliente-sel{ flex:1; max-width:none; }
            .cmd-dir{ width:100%; margin-left:0; }
            .scroll-area{ padding:14px 16px 24px; }
            .corpo{ display:block; }
            .kr-grade{ grid-template-columns:1fr; }
            .dept-grid{ grid-template-columns:1fr; }
            /* painel vira folha que sobe */
            .dw{ top:auto; left:0; right:0; width:100%; max-width:none; height:78vh; border-radius:18px 18px 0 0; box-shadow:0 -12px 40px rgba(23,23,26,.2); }
            .kr-menu, .dept-acoes, .obj-acoes, .tf-menu, .macro-edit{ opacity:1; }
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <div class="top-bar-logo" onclick="window.location.href='/'">core<span>.cx</span></div>
        {% include '_usermenu.html' %}
    </div>
    {% include '_sidebar.html' %}

    <div class="cmd">
        <span class="cmd-tit">OKR</span>
        <div class="cmd-sep"></div>
        <select class="cliente-sel" id="selCliente" onchange="trocarCliente()">
            <option value="">Selecione um cliente...</option>
        </select>
        <div class="cmd-dir">
            <button class="btn btn-acao" id="btnNovo" onclick="acaoNovo()" style="display:none;">
                <span class="material-symbols-rounded">add</span><span id="btnNovoTxt">Departamento</span>
            </button>
        </div>
    </div>

    <div class="corpo" id="corpo">
        <div class="scroll-area" id="conteudo">
            <div class="empty">
                <span class="material-symbols-rounded">target</span>
                <h3>Selecione um cliente</h3>
                <p>Escolha um cliente acima para ver o painel de objetivos e resultados-chave.</p>
            </div>
        </div>
        <aside class="dw" id="painelKr"></aside>
    </div>

    <!-- MODAL GENÉRICO -->
    <div class="modal-overlay" id="modal">
        <div class="modal-box">
            <div class="modal-header">
                <span class="modal-title" id="modalTitulo">Novo</span>
                <div class="btn-icon-round" onclick="fecharModal()"><span class="material-symbols-rounded" style="font-size:17px;">close</span></div>
            </div>
            <div id="modalCorpo"></div>
            <div class="modal-footer">
                <button class="btn btn-sec" onclick="fecharModal()">Cancelar</button>
                <button class="btn btn-acao" id="btnSalvarModal" onclick="salvarModal()">Salvar</button>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script>
        const NIVEL_ACESSO = "{{ nivel_acesso }}";
        let clienteAtual = '';
        let dadosArvore = null;
        let modalCtx = {};
        let nivel = 1;              // 1=painel, 2=departamento
        let deptFocadoId = null;
        let krSelecionadoId = null;  // KR aberto no painel lateral

        document.addEventListener('DOMContentLoaded', carregarInicial);

        function escH(s){ if(!s) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
        function fmtNum(n){ const v = parseFloat(n)||0; return v.toLocaleString('pt-BR', { maximumFractionDigits: 2 }); }
        function fmtData(d){ if(!d) return ''; const p = String(d).split('-'); return p.length===3 ? `${p[2]}/${p[1]}` : d; }

        // ===================== CARGA =====================
        async function carregarInicial() {
            try {
                const res = await fetch('/api/okr/arvore');
                if (res.status === 403) { document.getElementById('conteudo').innerHTML = '<div class="empty"><h3>Acesso negado</h3></div>'; return; }
                const data = await res.json();
                const mostraSeletor = data.mostra_seletor !== false;
                const sel = document.getElementById('selCliente');

                if (!mostraSeletor) {
                    sel.style.display = 'none';
                    if (data.cliente_atual || (data.clientes||[]).length === 1) {
                        clienteAtual = data.cliente_atual || data.clientes[0].id;
                        await carregarArvore();
                    } else {
                        document.getElementById('conteudo').innerHTML = '<div class="empty"><span class="material-symbols-rounded">target</span><h3>Nenhum OKR vinculado</h3><p>Seu acesso ainda não tem um OKR associado. Fale com o administrador.</p></div>';
                    }
                    return;
                }

                sel.innerHTML = '<option value="">Selecione um cliente...</option>' +
                    (data.clientes||[]).map(c => `<option value="${c.id}">${escH(c.nome)}</option>`).join('');
                if ((data.clientes||[]).length === 1) {
                    sel.value = data.clientes[0].id;
                    clienteAtual = data.clientes[0].id;
                    await carregarArvore();
                }
            } catch(e) { showToast('Erro ao carregar clientes.', 'error'); }
        }

        async function trocarCliente() {
            clienteAtual = document.getElementById('selCliente').value;
            nivel = 1; deptFocadoId = null; fecharPainelKr();
            if (!clienteAtual) {
                document.getElementById('btnNovo').style.display = 'none';
                document.getElementById('conteudo').innerHTML = '<div class="empty"><span class="material-symbols-rounded">target</span><h3>Selecione um cliente</h3><p>Escolha um cliente acima para ver o painel de objetivos e resultados-chave.</p></div>';
                return;
            }
            await carregarArvore();
        }

        async function carregarArvore() {
            document.getElementById('conteudo').innerHTML = '<div class="loading">Carregando OKRs...</div>';
            try {
                const res = await fetch('/api/okr/arvore?cliente_id=' + encodeURIComponent(clienteAtual));
                dadosArvore = await res.json();
                render();
            } catch(e) { showToast('Erro ao carregar OKRs.', 'error'); }
        }

        // ===================== CÁLCULOS =====================
        function calcKrPct(kr){ const meta=parseFloat(kr.valor_meta)||0, atual=parseFloat(kr.valor_atual)||0; if(meta<=0) return 0; return Math.min(100, Math.round((atual/meta)*100)); }
        function calcDeptPct(dept){ let krs=[]; (dept.objetivos||[]).forEach(o=>(o.key_results||[]).forEach(k=>krs.push(k))); if(!krs.length) return 0; return Math.round(krs.reduce((a,k)=>a+calcKrPct(k),0)/krs.length); }
        function calcObjPct(obj){ const krs=obj.key_results||[]; if(!krs.length) return 0; return Math.round(krs.reduce((a,k)=>a+calcKrPct(k),0)/krs.length); }
        function calcGeralPct(){ const ds=dadosArvore.departamentos||[]; if(!ds.length) return 0; const comKr=ds.filter(d=>{let n=0;(d.objetivos||[]).forEach(o=>n+=(o.key_results||[]).length);return n>0;}); if(!comKr.length) return 0; return Math.round(comKr.reduce((a,d)=>a+calcDeptPct(d),0)/comKr.length); }
        function cor(pct){ if(pct>=70) return 'var(--ok)'; if(pct>=40) return 'var(--atencao)'; return 'var(--critico)'; }
        function corHex(pct){ if(pct>=70) return '#0E9F6E'; if(pct>=40) return '#C2660B'; return '#D42F2F'; }
        function contar(){ let nObj=0,nKr=0,nTask=0,nTaskFin=0; (dadosArvore.departamentos||[]).forEach(d=>(d.objetivos||[]).forEach(o=>{nObj++;(o.key_results||[]).forEach(k=>{nKr++;(k.tarefas||[]).forEach(t=>{nTask++; if(t.status==='Finalizado')nTaskFin++;});});})); return {nObj,nKr,nTask,nTaskFin}; }

        // ----- risco vem do prazo da tarefa; sem ciclo, é o sinal disponível -----
        function hoje0(){ const d=new Date(); d.setHours(0,0,0,0); return d; }
        function dataDe(s){ if(!s) return null; const p=String(s).split('-'); if(p.length!==3) return null; const d=new Date(+p[0], +p[1]-1, +p[2]); d.setHours(0,0,0,0); return d; }
        function tarefaVencida(t){ if(!t || t.status==='Finalizado') return false; const d=dataDe(t.prazo); return !!d && d < hoje0(); }
        function diasAtraso(t){ const d=dataDe(t.prazo); if(!d) return 0; return Math.round((hoje0()-d)/86400000); }
        function tarefaPerto(t){ if(!t || t.status==='Finalizado') return false; const d=dataDe(t.prazo); if(!d) return false; const dif=Math.round((d-hoje0())/86400000); return dif>=0 && dif<=7; }
        function krVencidas(kr){ return (kr.tarefas||[]).filter(tarefaVencida).length; }
        function deptVencidas(dept){ let n=0; (dept.objetivos||[]).forEach(o=>(o.key_results||[]).forEach(k=>n+=krVencidas(k))); return n; }
        function deptPerto(dept){ let n=0; (dept.objetivos||[]).forEach(o=>(o.key_results||[]).forEach(k=>(k.tarefas||[]).forEach(t=>{ if(tarefaPerto(t)) n++; }))); return n; }
        function totaisRisco(){
            let venc=0, perto=0, krsComVenc=0;
            (dadosArvore.departamentos||[]).forEach(d=>(d.objetivos||[]).forEach(o=>(o.key_results||[]).forEach(k=>{
                const v = krVencidas(k); if(v>0) krsComVenc++; venc += v;
                (k.tarefas||[]).forEach(t=>{ if(tarefaPerto(t)) perto++; });
            })));
            return { venc, perto, krsComVenc };
        }

        // anel SVG — sem biblioteca
        function anelSvg(pct, tam){
            const sw = tam>=56 ? 6 : 5;
            const r  = (tam/2) - sw - 1;
            const c  = 2*Math.PI*r;
            const off= (c*(1-pct/100)).toFixed(1);
            const cx = tam/2;
            return `<div class="anel" style="width:${tam}px;height:${tam}px">
                <svg width="${tam}" height="${tam}" viewBox="0 0 ${tam} ${tam}">
                    <circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="rgba(0,0,0,.07)" stroke-width="${sw}"/>
                    <circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="${corHex(pct)}" stroke-width="${sw}"
                            stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off}"
                            style="transition:stroke-dashoffset .5s;"/>
                </svg>
                <span class="anel-txt" style="color:${cor(pct)};${tam<56?'font-size:11px;':''}">${pct}%</span>
            </div>`;
        }

        function render() {
            if (nivel === 2 && deptFocadoId) return renderDepartamento();
            fecharPainelKr();
            return renderPainel();
        }

        // ===================== NÍVEL 1: PAINEL =====================
        function renderPainel() {
            const c = document.getElementById('conteudo');
            const macro = dadosArvore.macro;
            const depts = dadosArvore.departamentos || [];
            const cnt = contar();
            const risco = totaisRisco();

            const bt = document.getElementById('btnNovo');
            bt.style.display = 'inline-flex';
            document.getElementById('btnNovoTxt').textContent = 'Departamento';

            let html = `
                <div class="resumo">
                    <div class="rz"><div class="rz-rot">Progresso geral</div><div class="rz-val num">${calcGeralPct()}%</div><div class="rz-pe">média de ${cnt.nKr} KR${cnt.nKr!==1?'s':''}</div></div>
                    <div class="rz"><div class="rz-rot">Objetivos</div><div class="rz-val num">${cnt.nObj}</div><div class="rz-pe">em ${depts.length} departamento${depts.length!==1?'s':''}</div></div>
                    <div class="rz ${risco.venc?'alerta':''}"><div class="rz-rot">Tarefas vencidas</div><div class="rz-val num">${risco.venc}</div><div class="rz-pe">${risco.venc? 'em '+risco.krsComVenc+' KR'+(risco.krsComVenc!==1?'s':'') : 'nada atrasado'}</div></div>
                    <div class="rz"><div class="rz-rot">Vencem em 7 dias</div><div class="rz-val num">${risco.perto}</div><div class="rz-pe">de ${cnt.nTask-cnt.nTaskFin} tarefa(s) aberta(s)</div></div>
                </div>

                <div class="macro" onclick="abrirMacro()">
                    <div class="macro-edit"><span class="material-symbols-rounded">edit</span></div>
                    <div class="macro-rot">Objetivo macro</div>
                    <div class="macro-tit ${macro && macro.titulo ? '' : 'vazio'}">${macro && macro.titulo ? escH(macro.titulo) : 'Clique para definir o objetivo macro'}</div>
                </div>

                <div class="secao-rot">Departamentos</div>`;

            if (!depts.length) {
                html += `<div class="empty"><span class="material-symbols-rounded">account_tree</span>
                    <h3>Nenhum departamento ainda</h3>
                    <p>Crie o primeiro departamento para começar a estruturar os objetivos deste cliente.</p></div>`;
                c.innerHTML = html;
                return;
            }

            html += `<div class="dept-grid">`;
            depts.forEach(dept => {
                const pct = calcDeptPct(dept);
                const venc = deptVencidas(dept);
                const perto = deptPerto(dept);
                let nObj = (dept.objetivos||[]).length, nKr = 0;
                (dept.objetivos||[]).forEach(o => nKr += (o.key_results||[]).length);
                const classe = venc ? 'critico' : (perto ? 'atencao' : '');

                let rodape = `<span><span class="material-symbols-rounded">flag</span>${nObj} objetivo${nObj!==1?'s':''}</span>`;
                if (venc)       rodape += `<span class="pe-critico"><span class="material-symbols-rounded">error</span>${venc} vencida${venc!==1?'s':''}</span>`;
                else if (perto) rodape += `<span class="pe-atencao"><span class="material-symbols-rounded">schedule</span>${perto} vence${perto!==1?'m':''} em 7 dias</span>`;
                else            rodape += `<span><span class="material-symbols-rounded">target</span>${nKr} KR${nKr!==1?'s':''}</span>`;

                html += `<div class="dept-card ${classe}" onclick="abrirDepartamento('${dept.id}')">
                    <div class="dept-top">
                        <div class="dept-nome">${escH(dept.nome)}</div>
                        <div class="dept-acoes" onclick="event.stopPropagation()">
                            <div class="btn-mini" title="Renomear" onclick="abrirDept('${dept.id}','${escH(dept.nome)}')"><span class="material-symbols-rounded">edit</span></div>
                            <div class="btn-mini danger" title="Excluir" onclick="excluirItem('departamento','${dept.id}','Excluir o departamento e tudo dentro dele?')"><span class="material-symbols-rounded">delete</span></div>
                        </div>
                    </div>
                    <div class="dept-pct num" style="color:${cor(pct)};">${pct}%</div>
                    <div class="barra"><div class="barra-fill" style="width:${pct}%; background:${cor(pct)};"></div></div>
                    <div class="dept-pe">${rodape}</div>
                </div>`;
            });
            html += `</div>`;
            c.innerHTML = html;
        }

        function abrirDepartamento(id){ deptFocadoId = id; nivel = 2; krSelecionadoId = null; render(); document.getElementById('conteudo').scrollTop = 0; }
        function voltarPainel(){ nivel = 1; deptFocadoId = null; krSelecionadoId = null; render(); }

        // ===================== NÍVEL 2: DEPARTAMENTO =====================
        function renderDepartamento() {
            const c = document.getElementById('conteudo');
            const dept = (dadosArvore.departamentos||[]).find(d => d.id === deptFocadoId);
            if (!dept) { voltarPainel(); return; }

            document.getElementById('btnNovoTxt').textContent = 'Objetivo';
            document.getElementById('btnNovo').style.display = 'inline-flex';

            const macro = dadosArvore.macro;
            let html = `<div class="migalha">
                <a onclick="voltarPainel()">Painel</a>
                <span class="material-symbols-rounded">chevron_right</span>
                ${macro && macro.titulo ? escH(macro.titulo) + '<span class="material-symbols-rounded">chevron_right</span>' : ''}
                <b>${escH(dept.nome)}</b>
            </div>`;

            const objs = dept.objetivos || [];
            if (!objs.length) {
                html += `<div class="empty"><span class="material-symbols-rounded">flag</span>
                    <h3>Nenhum objetivo neste departamento</h3>
                    <p>Crie o primeiro objetivo para começar a medir resultados.</p></div>`;
                c.innerHTML = html;
                return;
            }

            objs.forEach(obj => {
                const pctO = calcObjPct(obj);
                const krs = obj.key_results || [];
                html += `<div class="obj">
                    <div class="obj-cab">
                        <span class="obj-tit">${escH(obj.titulo)}</span>
                        <span class="obj-pct num" style="color:${cor(pctO)};">${pctO}%</span>
                        <div class="obj-acoes">
                            <div class="btn-mini" title="Editar objetivo" onclick="abrirObj('${dept.id}','${obj.id}','${escH(obj.titulo)}')"><span class="material-symbols-rounded">edit</span></div>
                            <div class="btn-mini danger" title="Excluir objetivo" onclick="excluirItem('objetivo','${obj.id}','Excluir este objetivo e seus KRs?')"><span class="material-symbols-rounded">delete</span></div>
                        </div>
                    </div>`;

                if (krs.length) {
                    html += `<div class="kr-grade">`;
                    krs.forEach(kr => {
                        const pct = calcKrPct(kr);
                        const venc = krVencidas(kr);
                        const tarefas = kr.tarefas || [];
                        const feitas = tarefas.filter(t => t.status === 'Finalizado').length;
                        const selo = venc
                            ? `<span class="selo venc"><span class="material-symbols-rounded">error</span>${venc} vencida${venc!==1?'s':''}</span>`
                            : `<span class="selo"><span class="material-symbols-rounded">checklist</span>${feitas}/${tarefas.length}</span>`;
                        html += `<div class="kr-card ${venc?'venc':''} ${krSelecionadoId===kr.id?'sel':''}" onclick="selecionarKr('${kr.id}')">
                            ${anelSvg(pct, 56)}
                            <div class="kr-corpo">
                                <div class="kr-desc">${escH(kr.descricao)}</div>
                                <div class="kr-vals">
                                    <span class="kr-atual num" title="Clique para atualizar"
                                          onclick="event.stopPropagation(); editarValorKr(this, ${JSON.stringify(kr).replace(/"/g,'&quot;')})">${fmtNum(kr.valor_atual)}</span>
                                    <span class="kr-meta num">/ ${fmtNum(kr.valor_meta)}</span>
                                </div>
                                <div class="kr-pe">
                                    ${selo}
                                    <div class="kr-menu" onclick="abrirMenuKr(event, '${obj.id}', ${JSON.stringify(kr).replace(/"/g,'&quot;')})"><span class="material-symbols-rounded">more_horiz</span></div>
                                </div>
                            </div>
                        </div>`;
                    });
                    html += `</div>`;
                } else {
                    html += `<div class="kr-vazio"></div>`;
                }
                html += `<div class="add-linha" onclick="abrirKr('${obj.id}', null)"><span class="material-symbols-rounded">add</span>Novo Key Result</div>`;
                html += `</div>`;
            });

            c.innerHTML = html;
            if (krSelecionadoId) renderPainelKr(); else fecharPainelKr();
        }

        // ===================== PAINEL LATERAL =====================
        function selecionarKr(id){
            krSelecionadoId = (krSelecionadoId === id) ? null : id;
            renderDepartamento();
        }
        function fecharPainelKr(){
            krSelecionadoId = null;
            document.getElementById('corpo').classList.remove('com-painel');
            document.getElementById('painelKr').innerHTML = '';
            document.querySelectorAll('.kr-card.sel').forEach(k => k.classList.remove('sel'));
        }
        function renderPainelKr(){
            const kr = encontrarKr(krSelecionadoId);
            if (!kr) { fecharPainelKr(); return; }
            document.getElementById('corpo').classList.add('com-painel');

            const pct = calcKrPct(kr);
            const tarefas = kr.tarefas || [];
            const feitas = tarefas.filter(t => t.status === 'Finalizado').length;

            let lista = tarefas.length ? tarefas.map(t => {
                const feito = t.status === 'Finalizado';
                const andamento = t.status === 'Em andamento';
                const venc = tarefaVencida(t);
                const dias = venc ? diasAtraso(t) : 0;
                const jt = JSON.stringify(t).replace(/"/g,'&quot;');
                return `<div class="tf ${feito?'ok':''}">
                    <div class="tf-check ${feito?'feito':''} ${andamento?'andamento':''}" title="Alternar status"
                         onclick="ciclarStatus(${jt})"><span class="material-symbols-rounded">check</span></div>
                    <div class="tf-corpo">
                        <div class="tf-desc">${escH(t.descricao)}</div>
                        <div class="tf-meta">
                            ${t.responsavel ? '<span>'+escH(t.responsavel)+'</span>' : ''}
                            ${t.prazo ? `<span class="tf-prazo ${venc?'venc':''}"><span class="material-symbols-rounded">${venc?'event_busy':'event'}</span>${fmtData(t.prazo)}${venc?' · '+dias+'d':''}</span>` : ''}
                            ${t.link_entregavel ? `<span class="tf-link" onclick="event.stopPropagation(); window.open('${escH(t.link_entregavel)}','_blank')"><span class="material-symbols-rounded">link</span>entregável</span>` : ''}
                        </div>
                    </div>
                    <div class="tf-menu" onclick="abrirMenuTarefa(event, '${kr.id}', ${jt})"><span class="material-symbols-rounded">more_horiz</span></div>
                </div>`;
            }).join('') : `<div class="dw-vazio"><span class="material-symbols-rounded">task_alt</span><p>Nenhuma tarefa ainda.<br>Use o botão abaixo para criar a primeira.</p></div>`;

            document.getElementById('painelKr').innerHTML = `
                <div class="dw-cab">
                    <div class="dw-fechar" onclick="fecharPainelKr()"><span class="material-symbols-rounded">close</span></div>
                    <div class="dw-rot">Key Result</div>
                    <div class="dw-tit">${escH(kr.descricao)}</div>
                    <div class="dw-medida">
                        ${anelSvg(pct, 44)}
                        <div class="dw-num"><span class="dw-atual num">${fmtNum(kr.valor_atual)}</span><span class="dw-meta num">/ ${fmtNum(kr.valor_meta)}</span></div>
                    </div>
                </div>
                <div class="dw-corpo">
                    <div class="dw-secao">Tarefas${tarefas.length? ' · '+feitas+' de '+tarefas.length+' concluída'+(tarefas.length!==1?'s':'') : ''}</div>
                    ${lista}
                </div>
                <div class="dw-pe">
                    <button class="btn btn-sec" style="width:100%; justify-content:center;" onclick="abrirTarefa('${kr.id}', null)">
                        <span class="material-symbols-rounded">add</span>Nova tarefa
                    </button>
                </div>`;
        }

        // ===================== MENUS FLUTUANTES =====================
        function abrirMenuKr(e, objId, kr) {
            e.stopPropagation();
            fecharMenusFlutuantes();
            const menu = document.createElement('div');
            menu.className = 'menu-flutuante';
            menu.innerHTML = `
                <div class="menu-item" onclick='abrirKr("${objId}", ${JSON.stringify(kr).replace(/'/g,"&#39;")}); fecharMenusFlutuantes();'><span class="material-symbols-rounded">edit</span>Editar KR</div>
                <div class="menu-item danger" onclick="excluirItem('kr','${kr.id}','Excluir este KR e suas tarefas?'); fecharMenusFlutuantes();"><span class="material-symbols-rounded">delete</span>Excluir KR</div>`;
            document.body.appendChild(menu);
            const rect = e.currentTarget.getBoundingClientRect();
            let top = rect.bottom + 6;
            if (top + menu.offsetHeight > window.innerHeight) top = rect.top - menu.offsetHeight - 6;
            menu.style.top = top + 'px';
            menu.style.left = Math.max(10, rect.right - 172) + 'px';
            setTimeout(() => document.addEventListener('click', fecharMenusFlutuantes, { once: true }), 0);
        }
        function fecharMenusFlutuantes() {
            document.querySelectorAll('.menu-flutuante').forEach(m => m.remove());
        }

        // Edição inline do valor atual do KR
        function editarValorKr(span, kr) {
            const atualTxt = span.textContent.trim().replace(/\./g,'').replace(',','.');
            const input = document.createElement('input');
            input.type = 'number'; input.step = 'any'; input.className = 'kr-val-input';
            input.value = parseFloat(atualTxt) || 0;
            span.replaceWith(input);
            input.focus(); input.select();
            input.addEventListener('click', e => e.stopPropagation());

            let salvou = false;
            async function salvar() {
                if (salvou) return; salvou = true;
                const novo = parseFloat(input.value) || 0;
                await fetch('/api/okr/item', { method:'PUT', headers:{'Content-Type':'application/json'},
                    body: JSON.stringify({ tipo:'kr', id:kr.id, descricao:kr.descricao, valor_atual:novo, valor_meta:kr.valor_meta })});
                await recarregarMantendoDept();
            }
            input.addEventListener('blur', salvar);
            input.addEventListener('keydown', e => {
                if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
                if (e.key === 'Escape') { salvou = true; render(); }
            });
        }

        async function recarregarMantendoDept() {
            const res = await fetch('/api/okr/arvore?cliente_id=' + encodeURIComponent(clienteAtual));
            dadosArvore = await res.json();
            render();
        }
        async function recarregarMantendoKr() {
            const res = await fetch('/api/okr/arvore?cliente_id=' + encodeURIComponent(clienteAtual));
            dadosArvore = await res.json();
            render();
        }

        function encontrarKr(krId) {
            let achado = null;
            const dept = (dadosArvore.departamentos||[]).find(d => d.id === deptFocadoId);
            if (!dept) return null;
            (dept.objetivos||[]).forEach(o => (o.key_results||[]).forEach(k => { if (k.id === krId) achado = k; }));
            return achado;
        }

        // ===================== TAREFAS =====================
        function abrirMenuTarefa(e, krId, t) {
            e.stopPropagation();
            fecharMenusFlutuantes();
            const menu = document.createElement('div');
            menu.className = 'menu-flutuante';
            menu.style.width = '190px';
            const mk = (s, lbl, ic) => `<div class="menu-item" onclick='setStatus(${JSON.stringify(t).replace(/'/g,"&#39;")},"${s}"); fecharMenusFlutuantes();'><span class="material-symbols-rounded">${ic}</span>${lbl}</div>`;
            menu.innerHTML =
                mk('Não iniciado','Não iniciado','radio_button_unchecked') +
                mk('Em andamento','Em andamento','pace') +
                mk('Finalizado','Finalizado','check_circle') +
                `<div style="height:1px;background:#E4E4EA;margin:5px 8px;"></div>
                <div class="menu-item" onclick='abrirTarefa("${krId}", ${JSON.stringify(t).replace(/'/g,"&#39;")}); fecharMenusFlutuantes();'><span class="material-symbols-rounded">edit</span>Editar</div>
                <div class="menu-item danger" onclick="excluirItem('tarefa','${t.id}','Excluir esta tarefa?', true); fecharMenusFlutuantes();"><span class="material-symbols-rounded">delete</span>Excluir</div>`;
            document.body.appendChild(menu);
            const rect = e.currentTarget.getBoundingClientRect();
            let top = rect.bottom + 6;
            if (top + menu.offsetHeight > window.innerHeight) top = rect.top - menu.offsetHeight - 6;
            menu.style.top = top + 'px';
            menu.style.left = Math.max(10, rect.right - 190) + 'px';
            setTimeout(() => document.addEventListener('click', fecharMenusFlutuantes, { once: true }), 0);
        }

        async function setStatus(t, novo) {
            fecharMenusFlutuantes();
            await fetch('/api/okr/item', { method:'PUT', headers:{'Content-Type':'application/json'},
                body: JSON.stringify({ tipo:'tarefa', id:t.id, descricao:t.descricao, responsavel:t.responsavel, prazo:t.prazo, link_entregavel:t.link_entregavel, status:novo })});
            await recarregarMantendoKr();
        }
        function ciclarStatus(t) {
            const ordem = ['Não iniciado','Em andamento','Finalizado'];
            const prox = ordem[(ordem.indexOf(t.status||'Não iniciado')+1)%3];
            setStatus(t, prox);
        }

        // ===================== MODAIS =====================
        function acaoNovo(){
            if (nivel === 2 && deptFocadoId) abrirObj(deptFocadoId, null, '');
            else abrirDept(null, '');
        }
        function abrirMacro() {
            const m = (dadosArvore && dadosArvore.macro) || {};
            modalCtx = { tipo: 'macro', id: m.id };
            setModal('Objetivo macro', `
                <div class="input-group"><label>Título do objetivo macro</label><textarea id="f_titulo" placeholder="Ex: Atingir R$ 1.5M em vendas">${escH(m.titulo||'')}</textarea></div>
                <div class="input-group"><label>Identificação (opcional)</label><input type="text" id="f_ciclo" value="${escH(m.ciclo||'')}" placeholder="Ex: 2026, Plano de expansão"></div>`);
        }
        function abrirDept(id, nome) {
            modalCtx = { tipo: 'departamento', id: id || null };
            setModal(id?'Renomear departamento':'Novo departamento', `<div class="input-group"><label>Nome do departamento</label><input type="text" id="f_nome" value="${escH(nome||'')}" placeholder="Ex: Comercial" autofocus></div>`);
        }
        function abrirObj(deptId, objId, titulo) {
            modalCtx = { tipo: 'objetivo', id: objId || null, departamento_id: deptId };
            setModal(objId?'Editar objetivo':'Novo objetivo', `<div class="input-group"><label>Título do objetivo</label><textarea id="f_titulo" placeholder="Descreva o objetivo">${objId?escH(titulo||''):''}</textarea></div>`);
        }
        function abrirKr(objId, kr) {
            kr = kr || {};
            modalCtx = { tipo: 'kr', id: kr.id || null, parent_id: objId };
            setModal(kr.id?'Editar Key Result':'Novo Key Result', `
                <div class="input-group"><label>Descrição do KR</label><textarea id="f_desc" placeholder="O que será medido">${escH(kr.descricao||'')}</textarea></div>
                <div class="input-row">
                    <div class="input-group"><label>Valor atual</label><input type="number" id="f_atual" value="${kr.valor_atual!=null?kr.valor_atual:0}" step="any"></div>
                    <div class="input-group"><label>Meta</label><input type="number" id="f_meta" value="${kr.valor_meta!=null?kr.valor_meta:0}" step="any"></div>
                </div>`);
        }
        function abrirTarefa(krId, t) {
            t = t || {};
            modalCtx = { tipo: 'tarefa', id: t.id || null, parent_id: krId };
            const statusOpts = ['Não iniciado','Em andamento','Finalizado'].map(s => `<option value="${s}" ${t.status===s?'selected':''}>${s}</option>`).join('');
            setModal(t.id?'Editar tarefa':'Nova tarefa', `
                <div class="input-group"><label>Descrição</label><textarea id="f_desc" placeholder="O que precisa ser feito">${escH(t.descricao||'')}</textarea></div>
                <div class="input-row">
                    <div class="input-group"><label>Responsável</label><input type="text" id="f_resp" value="${escH(t.responsavel||'')}" placeholder="Nome"></div>
                    <div class="input-group"><label>Prazo</label><input type="date" id="f_prazo" value="${t.prazo||''}"></div>
                </div>
                ${t.id?`<div class="input-group"><label>Status</label><select id="f_status">${statusOpts}</select></div>`:''}
                <div class="input-group"><label>Link do entregável (opcional)</label><input type="text" id="f_link" value="${escH(t.link_entregavel||'')}" placeholder="https://..."></div>`);
        }

        function setModal(titulo, corpo){ document.getElementById('modalTitulo').textContent = titulo; document.getElementById('modalCorpo').innerHTML = corpo; document.getElementById('modal').classList.add('show'); }
        function fecharModal(){ document.getElementById('modal').classList.remove('show'); }

        async function salvarModal() {
            const t = modalCtx.tipo;
            let url='', method='POST', payload={};
            if (t==='macro') { url='/api/okr/macro'; payload={ id:modalCtx.id, cliente_id:clienteAtual, titulo:val('f_titulo'), ciclo:val('f_ciclo') }; if(!payload.titulo) return showToast('Informe o título.','error'); }
            else if (t==='departamento') { url='/api/okr/departamento'; payload={ id:modalCtx.id, cliente_id:clienteAtual, nome:val('f_nome') }; if(!payload.nome) return showToast('Informe o nome.','error'); }
            else if (t==='objetivo') { url='/api/okr/item'; method=modalCtx.id?'PUT':'POST'; payload={ tipo:'objetivo', id:modalCtx.id, cliente_id:clienteAtual, departamento_id:modalCtx.departamento_id, titulo:val('f_titulo') }; if(!payload.titulo) return showToast('Informe o título.','error'); }
            else if (t==='kr') { url='/api/okr/item'; method=modalCtx.id?'PUT':'POST'; payload={ tipo:'kr', id:modalCtx.id, parent_id:modalCtx.parent_id, descricao:val('f_desc'), valor_atual:val('f_atual'), valor_meta:val('f_meta') }; if(!payload.descricao) return showToast('Informe a descrição.','error'); }
            else if (t==='tarefa') { url='/api/okr/item'; method=modalCtx.id?'PUT':'POST'; payload={ tipo:'tarefa', id:modalCtx.id, parent_id:modalCtx.parent_id, descricao:val('f_desc'), responsavel:val('f_resp'), prazo:val('f_prazo'), link_entregavel:val('f_link'), status:modalCtx.id?val('f_status'):'Não iniciado' }; if(!payload.descricao) return showToast('Informe a descrição.','error'); }

            const btn = document.getElementById('btnSalvarModal');
            btn.disabled = true; btn.textContent = 'Salvando...';
            try {
                const res = await fetch(url, { method, headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
                if (res.ok) { showToast('Salvo!','success'); fecharModal(); if(nivel===2) await recarregarMantendoKr(); else await carregarArvore(); }
                else { const e = await res.json(); showToast('Erro: '+(e.mensagem||'falha'),'error'); }
            } catch(e) { showToast('Erro de conexão.','error'); }
            finally { btn.disabled=false; btn.textContent='Salvar'; }
        }

        async function excluirItem(tipo, id, msg, manterKr) {
            if (!confirm(msg||'Excluir?')) return;
            fecharMenusFlutuantes();
            let url, opts;
            if (tipo==='departamento') { url='/api/okr/departamento/'+id; opts={ method:'DELETE' }; }
            else { url='/api/okr/item'; opts={ method:'DELETE', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ tipo, id }) }; }
            try {
                const res = await fetch(url, opts);
                if (res.ok) {
                    showToast('Excluído.','success');
                    if (tipo==='departamento') { krSelecionadoId=null; voltarPainel(); await carregarArvore(); }
                    else if (tipo==='kr' && id===krSelecionadoId) { krSelecionadoId=null; await recarregarMantendoKr(); }
                    else if (nivel===2) { await recarregarMantendoKr(); }
                    else { await carregarArvore(); }
                }
                else showToast('Erro ao excluir.','error');
            } catch(e) { showToast('Erro de conexão.','error'); }
        }

        function val(id){ const el=document.getElementById(id); return el?el.value.trim():''; }
        function showToast(msg, tipo='success') {
            const c = document.getElementById('toastContainer');
            const t = document.createElement('div');
            t.className = 'toast';
            t.innerHTML = `<span class="material-symbols-rounded" style="font-size:16px; color:${tipo==='success'?'var(--accent-lime)':'var(--accent-pink)'};">${tipo==='success'?'check_circle':'error'}</span>${msg}`;
            c.appendChild(t); setTimeout(()=>t.remove(), 3500);
        }
        document.getElementById('modal').addEventListener('click', function(e){ if(e.target===this) fecharModal(); });
        document.addEventListener('keydown', function(e){ if(e.key==='Escape'){ fecharMenusFlutuantes(); fecharModal(); } });
    </script>
</body>
</html>
