<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acessos | CXProjetos</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        :root{
            --mesa:#EFEFF3; --papel:#FFF; --papel-2:#F7F7F9;
            --linha:#E4E4EA; --linha-2:#D3D3DC;
            --tinta:#17171A; --tinta-2:#56565F; --tinta-3:#7C7C88;
            --acao:#6C5CE7; --acao-fraco:#F1EFFE; --lime:#BEF533;
            --ok:#0E9F6E; --ok-fraco:#E6F7F0;
            --atencao:#C2660B; --at-fundo:#FFF0D6; --at-borda:#E5BE7F;
            --critico:#D42F2F; --cr-fundo:#FBE3E3; --cr-borda:#E9A9A9;
            --externo:#DB2777; --externo-fraco:#FCE7F3;
            --r-card:12px; --r-ctrl:9px; --r-pill:999px;
            --e1:0 1px 2px rgba(23,23,26,.05), 0 0 0 1px var(--linha);
            --e2:0 4px 14px rgba(23,23,26,.07), 0 0 0 1px var(--linha);
            --e-pop:0 16px 44px rgba(23,23,26,.14), 0 0 0 1px var(--linha);
            --accent-lime:#BEF533; --accent-pink:#FF43C0;
        }
        *,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
        button,input,select,textarea{ font-family:inherit; border:none; background:none; color:inherit; }
        body{ font-family:'Inter',system-ui,sans-serif; background:var(--mesa); color:var(--tinta);
              min-height:100vh; -webkit-font-smoothing:antialiased; }
        .num{ font-family:'IBM Plex Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums; letter-spacing:-.2px; }
        :focus-visible{ outline:2px solid var(--acao); outline-offset:2px; border-radius:5px; }
        @media (prefers-reduced-motion:reduce){ *{ animation:none!important; transition:none!important; } }
        ::-webkit-scrollbar{ width:8px; height:8px; } ::-webkit-scrollbar-track{ background:transparent; }
        ::-webkit-scrollbar-thumb{ background:var(--linha-2); border-radius:99px; }

        .top-bar{ background:var(--papel); height:56px; padding:0 22px; display:flex;
            justify-content:space-between; align-items:center; border-bottom:1px solid var(--linha);
            position:sticky; top:0; z-index:20; }
        .top-bar-logo{ font-size:17px; font-weight:700; letter-spacing:-.4px; cursor:pointer; }
        .top-bar-logo span{ color:var(--acao); }

        /* ===== CABEÇALHO DA TELA ===== */
        .cabecalho{ background:var(--papel); border-bottom:1px solid var(--linha);
            position:sticky; top:56px; z-index:15; }
        .cb-topo{ max-width:1160px; margin:0 auto; padding:20px 22px 0; }
        .cb-tit{ font-size:22px; font-weight:700; letter-spacing:-.7px; line-height:1.1; }
        .cb-sub{ font-size:13px; color:var(--tinta-3); margin-top:5px; line-height:1.5; max-width:560px; }
        .cb-abas{ max-width:1160px; margin:0 auto; padding:0 22px; display:flex; gap:2px; margin-top:16px; }
        .aba{ font-size:13px; font-weight:550; padding:10px 14px; color:var(--tinta-3); cursor:pointer;
            border-bottom:2px solid transparent; transition:.14s; display:flex; align-items:center; gap:7px; }
        .aba:hover{ color:var(--tinta-2); }
        .aba.on{ color:var(--tinta); font-weight:650; border-bottom-color:var(--acao); }
        .aba-n{ font-size:10.5px; font-weight:600; padding:1px 7px; border-radius:99px;
            background:var(--papel-2); color:var(--tinta-3); }
        .aba.on .aba-n{ background:var(--acao-fraco); color:var(--acao); }

        .wrap{ max-width:1160px; margin:0 auto; padding:20px 22px 80px; }
        .painel-aba{ display:none; }
        .painel-aba.on{ display:block; }

        /* ===== ESTADOS ===== */
        .loading{ text-align:center; padding:64px; color:var(--tinta-3); font-size:13px; font-weight:500; }
        .empty{ text-align:center; padding:56px 24px; color:var(--tinta-3); background:var(--papel);
            border-radius:var(--r-card); box-shadow:var(--e1); }
        .empty .material-symbols-rounded{ font-size:38px; opacity:.3; display:block; margin-bottom:12px; }
        .empty h3{ font-size:14.5px; font-weight:650; color:var(--tinta-2); margin-bottom:5px; }
        .empty p{ font-size:12.5px; font-weight:500; line-height:1.6; max-width:340px; margin:0 auto; }

        /* ===== BARRA DE FERRAMENTAS ===== */
        .ferramentas{ display:flex; align-items:center; gap:10px; margin-bottom:18px; flex-wrap:wrap; }
        .busca{ position:relative; flex:1; min-width:200px; max-width:320px; }
        .busca .material-symbols-rounded{ position:absolute; left:11px; top:50%; transform:translateY(-50%);
            font-size:18px; color:var(--tinta-3); pointer-events:none; }
        .busca input{ width:100%; font-size:13px; padding:9px 12px 9px 36px; background:var(--papel);
            border:1px solid var(--linha); border-radius:var(--r-ctrl); outline:none; color:var(--tinta);
            transition:.14s; }
        .busca input::placeholder{ color:var(--tinta-3); }
        .busca input:focus{ border-color:var(--acao); box-shadow:0 0 0 3px var(--acao-fraco); }
        .filtro{ font-size:12.5px; font-weight:550; padding:9px 12px; background:var(--papel);
            border:1px solid var(--linha); border-radius:var(--r-ctrl); color:var(--tinta-2);
            cursor:pointer; outline:none; transition:.14s; }
        .filtro:focus{ border-color:var(--acao); }
        .cont{ margin-left:auto; font-size:12.5px; font-weight:550; color:var(--tinta-3); }
        .cont b{ font-weight:650; color:var(--tinta); }

        /* ===== RESUMO ===== */
        .resumo{ display:flex; gap:1px; background:var(--linha); border-radius:var(--r-card);
            overflow:hidden; margin-bottom:20px; box-shadow:var(--e1); }
        .rs{ flex:1; background:var(--papel); padding:13px 16px; min-width:0; cursor:pointer;
            transition:.14s; text-align:left; }
        .rs:hover{ background:var(--papel-2); }
        .rs.on{ background:var(--papel-2); }
        .rs-topo{ display:flex; align-items:center; gap:7px; margin-bottom:7px; }
        .rs-pt{ width:7px; height:7px; border-radius:50%; flex-shrink:0; }
        .rs-rot{ font-size:11px; font-weight:600; color:var(--tinta-3); letter-spacing:.2px;
            overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .rs-v{ font-size:21px; font-weight:700; letter-spacing:-.6px; line-height:1; }
        .rs-p{ font-size:10.5px; color:var(--tinta-3); font-weight:500; margin-top:4px; }
        @media(max-width:760px){ .resumo{ flex-wrap:wrap; } .rs{ min-width:calc(50% - 1px); } }

        /* ===== GRUPO POR NÍVEL ===== */
        .grupo{ margin-bottom:26px; }
        .gr-cab{ display:flex; align-items:center; gap:11px; margin-bottom:10px; padding:0 2px; }
        .gr-ico{ width:28px; height:28px; min-width:28px; border-radius:8px; display:flex;
            align-items:center; justify-content:center; }
        .gr-ico .material-symbols-rounded{ font-size:16px; }
        .gr-t{ font-size:13.5px; font-weight:650; letter-spacing:-.2px; }
        .gr-d{ font-size:12px; color:var(--tinta-3); }
        .gr-n{ margin-left:auto; font-size:11.5px; font-weight:600; color:var(--tinta-3);
            background:var(--papel); padding:4px 10px; border-radius:99px; box-shadow:var(--e1); }

        /* ===== CARTÃO DE PESSOA ===== */
        .pc{ background:var(--papel); border-radius:var(--r-card); box-shadow:var(--e1);
            margin-bottom:7px; overflow:hidden; transition:box-shadow .14s; }
        .pc:hover{ box-shadow:var(--e2); }
        .pc.aberto{ box-shadow:var(--e2); }
        .pc-cab{ padding:13px 16px; display:flex; align-items:center; gap:13px; cursor:pointer;
            width:100%; text-align:left; }
        .av{ width:36px; height:36px; min-width:36px; border-radius:50%; display:flex;
            align-items:center; justify-content:center; font-size:11.5px; font-weight:600; }
        .pc-id{ flex:1; min-width:0; }
        .pc-nome{ font-size:13.5px; font-weight:650; letter-spacing:-.1px; overflow:hidden;
            text-overflow:ellipsis; white-space:nowrap; }
        .pc-mail{ font-size:11.5px; color:var(--tinta-3); font-family:'IBM Plex Mono',monospace;
            overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-top:1px; }
        .pc-selos{ display:flex; gap:6px; align-items:center; flex-wrap:wrap; justify-content:flex-end; }
        .selo{ font-size:11px; font-weight:600; padding:4px 10px; border-radius:99px; white-space:nowrap;
            display:inline-flex; align-items:center; gap:5px; }
        .selo .material-symbols-rounded{ font-size:13px; }
        .s-eq{ background:var(--papel-2); color:var(--tinta-2); }
        .s-q{ background:#E9F2FB; color:#1A5FA0; }
        .s-a{ background:var(--ok-fraco); color:var(--ok); }
        .s-aj{ background:var(--at-fundo); color:var(--atencao); }
        .s-off{ background:var(--papel-2); color:var(--tinta-3); }
        .s-alerta{ background:var(--cr-fundo); color:var(--critico); }
        .pc-seta{ width:26px; height:26px; min-width:26px; border-radius:7px; display:flex;
            align-items:center; justify-content:center; color:var(--tinta-3); transition:.14s; }
        .pc.aberto .pc-seta{ background:var(--papel-2); color:var(--tinta); transform:rotate(180deg); }
        .pc-seta .material-symbols-rounded{ font-size:19px; }
        .pc.inativo .av, .pc.inativo .pc-id{ opacity:.45; }

        /* ===== CORPO EXPANDIDO ===== */
        .pc-corpo{ display:none; border-top:1px solid var(--linha); background:var(--papel-2); }
        .pc.aberto .pc-corpo{ display:grid; grid-template-columns:274px 1fr; }
        @media(max-width:820px){ .pc.aberto .pc-corpo{ grid-template-columns:1fr; } }
        .col-e{ padding:18px; border-right:1px solid var(--linha); }
        .col-d{ padding:18px; min-width:0; }
        @media(max-width:820px){ .col-e{ border-right:none; border-bottom:1px solid var(--linha); } }
        .campo{ margin-bottom:20px; }
        .campo:last-child{ margin-bottom:0; }
        .campo-t{ font-size:10.5px; font-weight:600; text-transform:uppercase; letter-spacing:.6px;
            color:var(--tinta-3); margin-bottom:9px; display:flex; align-items:center; gap:7px; }
        .campo-t .cnt{ font-weight:600; color:var(--tinta-2); background:var(--papel);
            padding:1px 7px; border-radius:99px; letter-spacing:0; box-shadow:var(--e1); }
        .dica{ font-size:11.5px; color:var(--tinta-3); line-height:1.5; margin-top:9px; }
        .dica.alerta{ color:var(--atencao); }

        /* níveis como opções */
        .niveis{ display:flex; flex-direction:column; gap:5px; }
        .nv{ display:flex; align-items:flex-start; gap:10px; padding:10px 12px; border-radius:var(--r-ctrl);
            background:var(--papel); cursor:pointer; transition:.14s; width:100%; text-align:left;
            box-shadow:inset 0 0 0 1px var(--linha); }
        .nv:hover{ box-shadow:inset 0 0 0 1px var(--linha-2); }
        .nv.on{ box-shadow:inset 0 0 0 1.5px var(--cor,var(--acao)); background:var(--papel); }
        .nv-r{ width:15px; height:15px; min-width:15px; border-radius:50%; margin-top:1px;
            box-shadow:inset 0 0 0 1.5px var(--linha-2); transition:.14s; }
        .nv.on .nv-r{ box-shadow:inset 0 0 0 4.5px var(--cor,var(--acao)); }
        .nv-txt{ flex:1; min-width:0; }
        .nv-t{ font-size:12.5px; font-weight:600; color:var(--tinta); display:flex; align-items:center; gap:6px; }
        .nv-t .material-symbols-rounded{ font-size:15px; color:var(--cor,var(--tinta-3)); }
        .nv-d{ font-size:11px; color:var(--tinta-3); line-height:1.45; margin-top:2px; }
        .nv:disabled{ opacity:.5; cursor:not-allowed; }

        .eq-campo{ position:relative; }
        .eq-campo input{ width:100%; font-size:12.5px; padding:9px 12px; background:var(--papel);
            border:1px solid var(--linha); border-radius:var(--r-ctrl); color:var(--tinta); outline:none; transition:.14s; }
        .eq-campo input:focus{ border-color:var(--acao); box-shadow:0 0 0 3px var(--acao-fraco); }
        .eq-campo input::placeholder{ color:var(--tinta-3); }

        /* chips de quadro e área */
        .chips{ display:flex; gap:6px; flex-wrap:wrap; }
        .chip{ font-size:12px; font-weight:550; padding:7px 12px; border-radius:var(--r-pill);
            background:var(--papel); color:var(--tinta-3); cursor:pointer; display:inline-flex;
            align-items:center; gap:6px; transition:.14s; box-shadow:inset 0 0 0 1px var(--linha); }
        .chip:hover{ box-shadow:inset 0 0 0 1px var(--linha-2); color:var(--tinta-2); }
        .chip .material-symbols-rounded{ font-size:14px; opacity:0; width:0; transition:.14s; }
        .chip.on{ background:var(--acao-fraco); color:var(--acao); font-weight:600;
            box-shadow:inset 0 0 0 1px var(--acao); }
        .chip.on .material-symbols-rounded{ opacity:1; width:14px; }
        .chip:disabled{ opacity:.5; cursor:not-allowed; }
        .chip-tudo{ font-size:11.5px; font-weight:600; color:var(--acao); cursor:pointer;
            padding:7px 10px; border-radius:var(--r-pill); transition:.14s; }
        .chip-tudo:hover{ background:var(--acao-fraco); }

        .divisor{ height:1px; background:var(--linha); margin:20px 0; }

        /* pé do cartão */
        .pc-pe{ grid-column:1/-1; border-top:1px solid var(--linha); padding:11px 18px;
            display:flex; align-items:center; gap:11px; flex-wrap:wrap; background:var(--papel); }
        .pe-status{ font-size:11.5px; color:var(--tinta-3); font-weight:500; flex:1; min-width:140px;
            display:flex; align-items:center; gap:6px; }
        .pe-status .material-symbols-rounded{ font-size:14px; }
        .pe-status.salvo{ color:var(--ok); }
        .btn{ font-size:12.5px; font-weight:600; cursor:pointer; display:inline-flex; align-items:center;
            gap:6px; padding:7px 12px; border-radius:var(--r-ctrl); transition:.14s; white-space:nowrap; }
        .btn .material-symbols-rounded{ font-size:16px; }
        .btn-fant{ background:var(--papel-2); color:var(--tinta-2); }
        .btn-fant:hover{ background:var(--linha); color:var(--tinta); }
        .btn-perigo{ background:var(--papel); color:var(--critico); box-shadow:inset 0 0 0 1px var(--cr-borda); }
        .btn-perigo:hover{ background:#FDEDED; }
        .btn-acao{ background:var(--acao); color:#fff; }
        .btn-acao:hover{ background:#5a4bd4; }

        /* ===== ABA NÍVEIS ===== */
        .nivel-card{ background:var(--papel); border-radius:var(--r-card); box-shadow:var(--e1);
            margin-bottom:11px; overflow:hidden; }
        .nc-cab{ padding:16px 18px; display:flex; align-items:flex-start; gap:13px; }
        .nc-ico{ width:36px; height:36px; min-width:36px; border-radius:10px; display:flex;
            align-items:center; justify-content:center; }
        .nc-ico .material-symbols-rounded{ font-size:19px; }
        .nc-t{ font-size:14.5px; font-weight:650; letter-spacing:-.2px; }
        .nc-d{ font-size:12.5px; color:var(--tinta-3); margin-top:3px; line-height:1.5; }
        .nc-n{ margin-left:auto; font-size:11.5px; font-weight:600; color:var(--tinta-3);
            background:var(--papel-2); padding:5px 11px; border-radius:99px; white-space:nowrap; }
        .nc-caps{ padding:0 18px 16px; display:flex; gap:6px; flex-wrap:wrap; }
        .capsula{ font-size:11px; font-weight:550; padding:4px 10px; border-radius:99px;
            background:var(--papel-2); color:var(--tinta-2); display:inline-flex; align-items:center; gap:5px; }
        .capsula .esc{ font-size:9.5px; font-weight:600; padding:1px 6px; border-radius:99px; }
        .esc-tudo{ background:var(--ok-fraco); color:var(--ok); }
        .esc-time{ background:var(--acao-fraco); color:var(--acao); }
        .esc-proprio{ background:var(--at-fundo); color:var(--atencao); }
        .capsula.sensivel{ background:#F3EEFF; color:#7C3AED; }

        /* ===== REGISTRO ===== */
        .reg{ background:var(--papel); border-radius:var(--r-card); box-shadow:var(--e1); overflow:hidden; }
        .rl{ display:grid; grid-template-columns:120px 1fr 150px; gap:14px; padding:12px 18px;
            border-bottom:1px solid var(--linha); align-items:baseline; }
        .rl:last-child{ border:none; }
        .rl.th{ background:var(--papel-2); }
        .rl.th div{ font-size:10.5px; font-weight:600; text-transform:uppercase; letter-spacing:.6px; color:var(--tinta-3); }
        .rl-q{ font-size:11.5px; color:var(--tinta-3); font-family:'IBM Plex Mono',monospace; }
        .rl-o{ font-size:12.5px; color:var(--tinta-2); line-height:1.5; }
        .rl-o b{ font-weight:650; color:var(--tinta); }
        .rl-w{ font-size:12px; color:var(--tinta-2); font-weight:550; }
        .rl-det{ font-size:11px; color:var(--tinta-3); font-family:'IBM Plex Mono',monospace; margin-top:3px; }
        .rl.divg{ background:var(--at-fundo); }
        .rl.divg .rl-o{ color:#7A4A0C; }
        @media(max-width:760px){ .rl{ grid-template-columns:1fr; gap:4px; } .rl.th{ display:none; } }

        .faixa{ border-radius:var(--r-card); padding:15px 17px; display:flex; gap:12px;
            align-items:flex-start; margin-bottom:16px; }
        .faixa .material-symbols-rounded{ font-size:19px; flex-shrink:0; margin-top:1px; }
        .fx-t{ font-size:13px; font-weight:650; margin-bottom:3px; }
        .fx-s{ font-size:12.5px; line-height:1.55; }
        .faixa.aviso{ background:var(--at-fundo); box-shadow:0 0 0 1px var(--at-borda); }
        .faixa.aviso .material-symbols-rounded, .faixa.aviso .fx-t, .faixa.aviso .fx-s{ color:#7A4A0C; }
        .faixa.limpo{ background:var(--ok-fraco); box-shadow:0 0 0 1px #A5DEC8; }
        .faixa.limpo .material-symbols-rounded, .faixa.limpo .fx-t, .faixa.limpo .fx-s{ color:#0A5C42; }
        .faixa.info{ background:var(--acao-fraco); box-shadow:0 0 0 1px #D6CEFB; }
        .faixa.info .material-symbols-rounded, .faixa.info .fx-t, .faixa.info .fx-s{ color:#3C3489; }

        .toast-container{ position:fixed; bottom:26px; left:50%; transform:translateX(-50%); z-index:10001;
            display:flex; flex-direction:column; gap:9px; }
        .toast{ background:rgba(23,23,26,.95); color:#fff; padding:11px 20px; border-radius:var(--r-pill);
            font-size:12.5px; font-weight:500; box-shadow:0 10px 30px rgba(0,0,0,.2);
            display:flex; align-items:center; gap:9px; max-width:88vw; }

        @media (max-width:900px){
            .top-bar{ padding:0 16px 0 60px; }
            .cb-topo{ padding:16px 16px 0; }
            .cb-abas{ padding:0 16px; overflow-x:auto; }
            .cb-abas::-webkit-scrollbar{ display:none; }
            .aba{ white-space:nowrap; }
            .wrap{ padding:16px 16px 70px; }
            .pc-cab{ flex-wrap:wrap; gap:10px; }
            .pc-selos{ width:100%; justify-content:flex-start; padding-left:49px; }
            .cont{ width:100%; margin-left:0; }
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <div class="top-bar-logo" onclick="window.location.href='/'">CX<span>Projetos</span></div>
        {% include '_usermenu.html' %}
    </div>
    {% include '_sidebar.html' %}

    <div class="cabecalho">
        <div class="cb-topo">
            <h1 class="cb-tit">Acessos</h1>
            <p class="cb-sub">Defina o nível de cada pessoa, em quais quadros ela trabalha
               e quais áreas da plataforma pode abrir.</p>
        </div>
        <div class="cb-abas">
            <button class="aba on" data-aba="pessoas" onclick="trocarAba('pessoas')">
                Pessoas<span class="aba-n" id="nPessoas">–</span></button>
            <button class="aba" data-aba="niveis" onclick="trocarAba('niveis')">Níveis</button>
            <button class="aba" data-aba="registro" onclick="trocarAba('registro')">Registro</button>
        </div>
    </div>

    <div class="wrap">
        <div class="painel-aba on" id="abaPessoas"><div class="loading">Carregando...</div></div>
        <div class="painel-aba" id="abaNiveis"><div class="loading">Carregando...</div></div>
        <div class="painel-aba" id="abaRegistro"><div class="loading">Carregando...</div></div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script>
        const USUARIO = "{{ usuario_nome }}";

        /* Cor por nível: comunica alcance de poder, não decoração.
           Vermelho = configura o sistema; roxo = vê tudo; verde = time;
           neutro = só o próprio; rosa = externo. */
        const CORES_NIVEL = {
            'Administrador': { cor:'#D42F2F', fundo:'#FBE3E3', ico:'shield_person' },
            'Diretoria':     { cor:'#6C5CE7', fundo:'#F1EFFE', ico:'diamond' },
            'Líder':         { cor:'#0E9F6E', fundo:'#E6F7F0', ico:'supervisor_account' },
            'Colaborador':   { cor:'#56565F', fundo:'#F7F7F9', ico:'badge' },
            'Cliente':       { cor:'#DB2777', fundo:'#FCE7F3', ico:'business' }
        };
        const PALETA = [['#EEEDFE','#3C3489'],['#E1F5EE','#0F6E56'],['#FAECE7','#993C1D'],
            ['#FBEAF0','#993556'],['#E6F1FB','#185FA5'],['#EAF3DE','#3B6D11'],['#FAEEDA','#854F0B']];
        const ROT_ESCOPO = { tudo:'todos', time:'do time', proprio:'próprios' };

        let catalogo = [], gruposCat = [], quadros = [], areas = [];
        let niveis = [], pessoas = [], equipes = [];
        let abertos = new Set(), filtroNivel = '', busca = '';
        let abaAtiva = 'pessoas', salvando = {};

        document.addEventListener('DOMContentLoaded', iniciar);

        function escH(s){ if(s===null||s===undefined) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
        function escA(s){ return escH(s).replace(/'/g,'&#39;'); }
        function cor(n){ let h=0; for(let i=0;i<(n||'').length;i++) h=n.charCodeAt(i)+((h<<5)-h); return PALETA[Math.abs(h)%PALETA.length]; }
        function iniciais(n){ return (n||'?').trim().split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase(); }
        function visualNivel(nome){ return CORES_NIVEL[nome] || { cor:'#7C7C88', fundo:'#F7F7F9', ico:'badge' }; }

        async function motivo(resp, padrao){
            try{ const d = await resp.json();
                if(d && d.detalhe) return (d.mensagem||padrao)+' '+d.detalhe;
                if(d && d.mensagem) return d.mensagem;
                if(d && d.erro) return d.erro;
            }catch(e){}
            return padrao+' (HTTP '+resp.status+')';
        }
        function erroEm(alvo, msg){
            document.getElementById(alvo).innerHTML =
                `<div class="empty"><span class="material-symbols-rounded">error</span>
                 <h3>Não foi possível carregar</h3><p>${escH(msg)}</p></div>`;
        }

        async function iniciar(){
            try{
                const r = await fetch('/api/acessos/catalogo');
                if(!r.ok){ erroEm('abaPessoas', await motivo(r,'Erro ao carregar o catálogo.')); return; }
                const d = await r.json();
                catalogo = d.capacidades || []; gruposCat = d.grupos || [];
                quadros = d.quadros || []; areas = d.areas || [];
            }catch(e){ erroEm('abaPessoas','Sem conexão com o servidor.'); return; }
            await Promise.all([carregarNiveis(), carregarPessoas()]);
        }

        function trocarAba(a){
            abaAtiva = a;
            document.querySelectorAll('.aba').forEach(b => b.classList.toggle('on', b.getAttribute('data-aba')===a));
            document.querySelectorAll('.painel-aba').forEach(p => p.classList.remove('on'));
            document.getElementById('aba' + a.charAt(0).toUpperCase() + a.slice(1)).classList.add('on');
            if(a === 'niveis') renderNiveis();
            if(a === 'registro') carregarRegistro();
        }

        /* ==================== DADOS ==================== */
        async function carregarNiveis(){
            try{
                const r = await fetch('/api/acessos/papeis');
                if(!r.ok) return;
                const d = await r.json();
                niveis = (d.papeis || []).sort((a,b)=>(a.ordem||99)-(b.ordem||99));
            }catch(e){}
        }

        async function carregarPessoas(){
            try{
                const r = await fetch('/api/acessos/pessoas');
                if(!r.ok){ erroEm('abaPessoas', await motivo(r,'Erro ao carregar pessoas.')); return; }
                const d = await r.json();
                pessoas = d.pessoas || []; equipes = d.equipes || [];
            }catch(e){ erroEm('abaPessoas','Sem conexão com o servidor.'); return; }
            renderPessoas();
        }

        function nivelDe(p){ return niveis.find(n => String(n.id) === String(p.papel_id)); }
        function nomeNivel(p){ const n = nivelDe(p); return n ? n.nome : null; }

        /* ==================== PESSOAS ==================== */
        function renderPessoas(){
            document.getElementById('nPessoas').innerText = pessoas.length;

            const t = busca.trim().toLowerCase();
            const lista = pessoas.filter(p => {
                if(t && !(p.nome||'').toLowerCase().includes(t) && !(p.email||'').toLowerCase().includes(t)) return false;
                if(filtroNivel === '__sem') return !p.papel_id;
                if(filtroNivel && String(p.papel_id) !== filtroNivel) return false;
                return true;
            });

            // Agrupa por nível: a hierarquia de acesso É a estrutura da lista.
            const ordem = niveis.map(n => String(n.id)).concat(['__sem']);
            const porNivel = {};
            lista.forEach(p => {
                const k = p.papel_id ? String(p.papel_id) : '__sem';
                (porNivel[k] = porNivel[k] || []).push(p);
            });

            const semPapel = pessoas.filter(p => !p.papel_id).length;
            const admins = pessoas.filter(p => nomeNivel(p) === 'Administrador' && p.ativo !== false).length;

            let html = resumoHtml() + ferramentasHtml(lista.length);

            if(semPapel){
                html += `<div class="faixa info"><span class="material-symbols-rounded">info</span>
                    <div><div class="fx-t">${semPapel} pessoa${semPapel===1?'':'s'} sem nível definido</div>
                    <div class="fx-s">Enquanto não tiverem nível, seguem no modelo antigo de permissões.
                    Defina o nível e peça para saírem e entrarem de novo.</div></div></div>`;
            }
            if(admins > 2){
                html += `<div class="faixa aviso"><span class="material-symbols-rounded">gpp_maybe</span>
                    <div><div class="fx-t">${admins} pessoas com nível Administrador</div>
                    <div class="fx-s">Administrador configura acessos e apaga em definitivo.
                    Quem só precisa enxergar tudo cabe em Diretoria.</div></div></div>`;
            }

            if(!lista.length){
                html += `<div class="empty"><span class="material-symbols-rounded">person_search</span>
                    <h3>Ninguém encontrado</h3><p>Ajuste a busca ou o filtro de nível para ver mais pessoas.</p></div>`;
            } else {
                ordem.forEach(k => {
                    const gente = porNivel[k];
                    if(!gente || !gente.length) return;
                    const n = k === '__sem' ? null : niveis.find(x => String(x.id) === k);
                    const nome = n ? n.nome : 'Sem nível';
                    const v = n ? visualNivel(nome) : { cor:'#C2660B', fundo:'#FFF0D6', ico:'help' };
                    html += `<section class="grupo">
                        <header class="gr-cab">
                            <span class="gr-ico" style="background:${v.fundo}">
                                <span class="material-symbols-rounded" style="color:${v.cor}">${v.ico}</span></span>
                            <div><div class="gr-t">${escH(nome)}</div>
                                <div class="gr-d">${escH(n ? (n.descricao||'') : 'Ainda usando o modelo antigo')}</div></div>
                            <span class="gr-n">${gente.length}</span>
                        </header>
                        ${gente.map(cartaoPessoa).join('')}
                    </section>`;
                });
            }
            document.getElementById('abaPessoas').innerHTML = html;
            const bp = document.getElementById('buscaPessoa');
            if(bp && document.activeElement !== bp) bp.value = busca;
        }

        function resumoHtml(){
            const cont = {};
            pessoas.forEach(p => { const n = nomeNivel(p) || 'Sem nível'; cont[n] = (cont[n]||0)+1; });
            const ordem = niveis.map(n => n.nome).concat(cont['Sem nível'] ? ['Sem nível'] : []);
            return `<div class="resumo">${ordem.map(nome => {
                const v = nome === 'Sem nível' ? { cor:'#C2660B' } : visualNivel(nome);
                const n = cont[nome] || 0;
                const alvo = nome === 'Sem nível' ? '__sem' : (niveis.find(x=>x.nome===nome)||{}).id;
                const ativo = String(filtroNivel) === String(alvo);
                return `<button class="rs ${ativo?'on':''}" onclick="filtrarNivel('${escA(alvo)}')">
                    <div class="rs-topo"><span class="rs-pt" style="background:${v.cor}"></span>
                        <span class="rs-rot">${escH(nome)}</span></div>
                    <div class="rs-v num" style="color:${n?v.cor:'var(--linha-2)'}">${n}</div>
                    <div class="rs-p">${ativo?'filtrando':(n===1?'pessoa':'pessoas')}</div>
                </button>`;
            }).join('')}</div>`;
        }

        function ferramentasHtml(qtd){
            return `<div class="ferramentas">
                <div class="busca"><span class="material-symbols-rounded">search</span>
                    <input id="buscaPessoa" placeholder="Buscar por nome ou e-mail" value="${escA(busca)}"
                           oninput="aoBuscar(this.value)"></div>
                <select class="filtro" onchange="filtrarNivel(this.value)">
                    <option value="">Todos os níveis</option>
                    ${niveis.map(n=>`<option value="${escA(n.id)}" ${String(filtroNivel)===String(n.id)?'selected':''}>${escH(n.nome)}</option>`).join('')}
                    <option value="__sem" ${filtroNivel==='__sem'?'selected':''}>Sem nível</option>
                </select>
                <span class="cont">${qtd === pessoas.length ? `<b>${pessoas.length}</b> pessoas` : `<b>${qtd}</b> de ${pessoas.length}`}</span>
            </div>`;
        }

        function aoBuscar(v){ busca = v; renderPessoas(); }
        function filtrarNivel(v){ filtroNivel = (String(filtroNivel)===String(v)) ? '' : v; renderPessoas(); }

        function cartaoPessoa(p){
            const [bg,fg] = cor(p.nome);
            const aberto = abertos.has(String(p.id));
            const inativo = p.ativo === false;
            const qs = p.quadros || [], as = p.areas || [];
            const ajustes = Object.keys(p.ajustes || {}).length;

            const selos = [];
            if(inativo) selos.push(`<span class="selo s-off"><span class="material-symbols-rounded">block</span>Inativo</span>`);
            if(p.equipe) selos.push(`<span class="selo s-eq"><span class="material-symbols-rounded">groups</span>${escH(p.equipe)}</span>`);
            if(qs.length) selos.push(`<span class="selo s-q">${qs.length} ${qs.length===1?'quadro':'quadros'}</span>`);
            else if(!p.tipo_usuario || p.tipo_usuario === 'interno')
                selos.push(`<span class="selo s-alerta"><span class="material-symbols-rounded">warning</span>Sem quadro</span>`);
            if(as.length) selos.push(`<span class="selo s-a">${as.length} ${as.length===1?'área':'áreas'}</span>`);
            if(ajustes) selos.push(`<span class="selo s-aj"><span class="material-symbols-rounded">tune</span>${ajustes} ${ajustes===1?'ajuste':'ajustes'}</span>`);

            return `<article class="pc ${aberto?'aberto':''} ${inativo?'inativo':''}" id="pc-${escA(p.id)}">
                <button class="pc-cab" onclick="alternar('${escA(p.id)}')" aria-expanded="${aberto}">
                    <span class="av" style="background:${bg};color:${fg}">${iniciais(p.nome)}</span>
                    <span class="pc-id"><span class="pc-nome">${escH(p.nome)}</span>
                        <span class="pc-mail">${escH(p.email)}</span></span>
                    <span class="pc-selos">${selos.join('')}</span>
                    <span class="pc-seta"><span class="material-symbols-rounded">expand_more</span></span>
                </button>
                ${aberto ? corpoPessoa(p) : ''}
            </article>`;
        }

        function corpoPessoa(p){
            const qs = p.quadros || [], as = p.areas || [];
            const externo = p.tipo_usuario === 'externo';
            const nivelNome = nomeNivel(p);
            const ehLider = nivelNome === 'Líder';
            const internos = niveis.filter(n => !n.externo);
            const listaNiveis = externo ? niveis.filter(n => n.externo) : internos;
            const semEquipe = ehLider && !p.equipe;

            return `<div class="pc-corpo">
                <div class="col-e">
                    <div class="campo">
                        <div class="campo-t">Nível de acesso</div>
                        <div class="niveis">
                            ${listaNiveis.map(n => {
                                const v = visualNivel(n.nome);
                                const on = String(n.id) === String(p.papel_id);
                                return `<button class="nv ${on?'on':''}" style="--cor:${v.cor}"
                                        onclick="mudar('${escA(p.id)}','papel_id','${escA(n.id)}')">
                                    <span class="nv-r"></span>
                                    <span class="nv-txt">
                                        <span class="nv-t"><span class="material-symbols-rounded">${v.ico}</span>${escH(n.nome)}</span>
                                        <span class="nv-d">${escH(n.descricao||'')}</span>
                                    </span></button>`;
                            }).join('')}
                        </div>
                    </div>
                    <div class="campo">
                        <div class="campo-t">Equipe</div>
                        <div class="eq-campo">
                            <input list="equipesLista" value="${escA(p.equipe||'')}" placeholder="Ex.: Comercial"
                                   onchange="mudar('${escA(p.id)}','equipe',this.value)">
                        </div>
                        <div class="dica ${semEquipe?'alerta':''}">
                            ${semEquipe
                                ? 'O nível Líder precisa de equipe. Sem ela, esta pessoa enxerga só o que é dela.'
                                : 'Define quem o nível Líder enxerga.'}
                        </div>
                    </div>
                </div>

                <div class="col-d">
                    <div class="campo">
                        <div class="campo-t">Quadros de trabalho
                            <span class="cnt">${qs.length} de ${quadros.length}</span>
                            <button class="chip-tudo" onclick="marcarTudo('${escA(p.id)}','quadros')">
                                ${qs.length === quadros.length ? 'Limpar' : 'Marcar todos'}</button>
                        </div>
                        <div class="chips">
                            ${quadros.map(q => `<button class="chip ${qs.includes(q.chave)?'on':''}"
                                onclick="alternarItem('${escA(p.id)}','quadros','${escA(q.chave)}')">
                                <span class="material-symbols-rounded">check</span>${escH(q.nome)}</button>`).join('')}
                        </div>
                        ${!qs.length ? '<div class="dica alerta">Sem quadro marcado, esta pessoa não vê nenhum quadro de trabalho.</div>' : ''}
                    </div>

                    <div class="divisor"></div>

                    <div class="campo">
                        <div class="campo-t">Áreas da plataforma
                            <span class="cnt">${as.length} de ${areas.length}</span>
                            <button class="chip-tudo" onclick="marcarTudo('${escA(p.id)}','areas')">
                                ${as.length === areas.length ? 'Limpar' : 'Marcar todas'}</button>
                        </div>
                        <div class="chips">
                            ${areas.map(a => `<button class="chip ${as.includes(a.chave)?'on':''}"
                                onclick="alternarItem('${escA(p.id)}','areas','${escA(a.chave)}')" title="${escA(a.descricao)}">
                                <span class="material-symbols-rounded">check</span>${escH(a.nome)}</button>`).join('')}
                        </div>
                    </div>
                </div>

                <div class="pc-pe">
                    <span class="pe-status ${salvando[p.id]==='ok'?'salvo':''}" id="st-${escA(p.id)}">
                        ${salvando[p.id]==='ok'
                            ? '<span class="material-symbols-rounded">check_circle</span>Alterações salvas'
                            : 'As alterações valem no próximo login desta pessoa.'}
                    </span>
                    <button class="btn ${p.ativo===false?'btn-acao':'btn-perigo'}"
                            onclick="mudar('${escA(p.id)}','ativo',${p.ativo===false})">
                        <span class="material-symbols-rounded">${p.ativo===false?'person_check':'block'}</span>
                        ${p.ativo===false?'Reativar acesso':'Desativar acesso'}</button>
                </div>
            </div>`;
        }

        function alternar(id){
            const k = String(id);
            if(abertos.has(k)) abertos.delete(k); else abertos.add(k);
            renderPessoas();
        }

        function alternarItem(id, campo, valor){
            const p = pessoas.find(x => String(x.id)===String(id)); if(!p) return;
            const atual = (p[campo] || []).slice();
            const i = atual.indexOf(valor);
            if(i >= 0) atual.splice(i,1); else atual.push(valor);
            mudar(id, campo, atual);
        }

        function marcarTudo(id, campo){
            const p = pessoas.find(x => String(x.id)===String(id)); if(!p) return;
            const todos = campo === 'quadros' ? quadros.map(q=>q.chave) : areas.map(a=>a.chave);
            const cheio = (p[campo]||[]).length === todos.length;
            mudar(id, campo, cheio ? [] : todos);
        }

        async function mudar(id, campo, valor){
            const p = pessoas.find(x => String(x.id)===String(id)); if(!p) return;
            const anterior = p[campo];
            p[campo] = valor;                       // otimista: a tela responde na hora
            if(campo === 'equipe' && valor && !equipes.includes(valor)) equipes.push(valor);
            renderPessoas();
            try{
                const corpo = {}; corpo[campo] = valor;
                const r = await fetch('/api/acessos/pessoas/'+id, {
                    method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(corpo) });
                if(!r.ok){
                    p[campo] = anterior;            // desfaz o que o servidor recusou
                    showToast(await motivo(r,'Não foi possível salvar.'),'error');
                    renderPessoas();
                    return;
                }
                salvando[id] = 'ok';
                renderPessoas();
                setTimeout(()=>{ delete salvando[id]; if(abertos.has(String(id))) renderPessoas(); }, 2600);
                if(campo === 'papel_id') carregarNiveis().then(renderPessoas);
            }catch(e){
                p[campo] = anterior;
                showToast('Sem conexão com o servidor.','error');
                renderPessoas();
            }
        }

        /* ==================== NÍVEIS ==================== */
        function renderNiveis(){
            if(!niveis.length){ erroEm('abaNiveis','Nenhum nível cadastrado.'); return; }
            document.getElementById('abaNiveis').innerHTML = `
                <div class="faixa info"><span class="material-symbols-rounded">info</span>
                    <div><div class="fx-t">O que cada nível permite</div>
                    <div class="fx-s">Os níveis são fixos e valem para toda a plataforma.
                    O que muda por pessoa são os quadros, as áreas e a equipe — tudo na aba Pessoas.</div></div></div>
                ${niveis.map(n => {
                    const v = visualNivel(n.nome);
                    const caps = Object.entries(n.capacidades || {});
                    return `<div class="nivel-card">
                        <div class="nc-cab">
                            <span class="nc-ico" style="background:${v.fundo}">
                                <span class="material-symbols-rounded" style="color:${v.cor}">${v.ico}</span></span>
                            <div style="flex:1;min-width:0">
                                <div class="nc-t">${escH(n.nome)}</div>
                                <div class="nc-d">${escH(n.descricao||'')}</div>
                            </div>
                            <span class="nc-n">${n.pessoas||0} ${(n.pessoas||0)===1?'pessoa':'pessoas'}</span>
                        </div>
                        <div class="nc-caps">
                            ${caps.length ? caps.map(([c,e]) => {
                                const info = catalogo.find(x => x.chave === c) || { rotulo:c, escopos:[], sensivel:false };
                                return `<span class="capsula ${info.sensivel?'sensivel':''}">${escH(info.rotulo)}
                                    ${info.escopos && info.escopos.length ? `<span class="esc esc-${escA(e)}">${ROT_ESCOPO[e]||e}</span>` : ''}</span>`;
                            }).join('') : '<span class="capsula">Nenhuma permissão</span>'}
                        </div>
                    </div>`;
                }).join('')}`;
        }

        /* ==================== REGISTRO ==================== */
        const ROT_ACAO = {
            papel_criado:'criou o nível', papel_alterado:'alterou o nível',
            papel_excluido:'excluiu o nível', acesso_alterado:'alterou o acesso de',
            divergencia_permissao:'divergência entre modelos',
        };
        const ROT_CAMPO = { papel_id:'nível', quadros:'quadros', areas:'áreas',
                            equipe:'equipe', ativo:'situação', ajustes:'ajustes' };

        async function carregarRegistro(){
            document.getElementById('abaRegistro').innerHTML = '<div class="loading">Carregando...</div>';
            let regs = [];
            try{
                const r = await fetch('/api/acessos/auditoria');
                if(!r.ok){ erroEm('abaRegistro', await motivo(r,'Erro ao carregar o registro.')); return; }
                const d = await r.json();
                regs = d.registros || [];
            }catch(e){ erroEm('abaRegistro','Sem conexão com o servidor.'); return; }

            const divs = regs.filter(r => r.acao === 'divergencia_permissao');
            const distintas = new Set(divs.map(r => {
                const d = r.detalhe || {};
                return [r.recurso, d.antigo, d.novo, d.nivel].join('|');
            })).size;

            const faixa = divs.length
                ? `<div class="faixa aviso"><span class="material-symbols-rounded">warning</span>
                    <div><div class="fx-t">${distintas} divergência${distintas===1?'':'s'} entre o modelo antigo e o novo</div>
                    <div class="fx-s">Nada quebrou: enquanto houver divergência, o modelo antigo continua decidindo.
                    Ajuste os níveis até a lista zerar.</div></div></div>`
                : `<div class="faixa limpo"><span class="material-symbols-rounded">check_circle</span>
                    <div><div class="fx-t">Os dois modelos estão concordando</div>
                    <div class="fx-s">Depois de alguns dias assim, o modelo novo pode assumir com segurança.</div></div></div>`;

            document.getElementById('abaRegistro').innerHTML = faixa + `
                <div class="reg">
                    <div class="rl th"><div>Quando</div><div>O que aconteceu</div><div>Quem fez</div></div>
                    ${regs.length ? regs.map(r => {
                        const d = r.detalhe || {};
                        const div = r.acao === 'divergencia_permissao';
                        let texto, det = '';
                        if(div){
                            texto = `<b>${escH(r.recurso)}</b> — antigo diz <b>${d.antigo?'sim':'não'}</b>, novo diz <b>${d.novo?'sim':'não'}</b>`;
                            if(d.papel) det = `nível: ${escH(d.papel)}`;
                        } else if(r.acao === 'acesso_alterado'){
                            const campos = Object.keys(d).map(k => ROT_CAMPO[k] || k);
                            texto = `alterou <b>${escH(campos.join(', ') || 'o acesso')}</b> de alguém`;
                        } else {
                            texto = `${escH(ROT_ACAO[r.acao] || r.acao)} <b>${escH(d.nome || r.alvo_id || '')}</b>`;
                        }
                        return `<div class="rl ${div?'divg':''}">
                            <div class="rl-q">${fmtData(r.criado_em)}</div>
                            <div><div class="rl-o">${texto}</div>${det?`<div class="rl-det">${det}</div>`:''}</div>
                            <div class="rl-w">${escH(r.usuario)||'—'}</div>
                        </div>`;
                    }).join('') : `<div class="empty"><span class="material-symbols-rounded">history</span>
                        <h3>Nada registrado ainda</h3><p>As alterações de acesso aparecem aqui assim que acontecerem.</p></div>`}
                </div>`;
        }

        function fmtData(s){
            const d = new Date(s); if(isNaN(d)) return '—';
            const hoje = new Date();
            const mesmoDia = d.toDateString() === hoje.toDateString();
            return (mesmoDia ? 'hoje' : d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}))
                   + ' · ' + d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
        }

        /* ==================== UTIL ==================== */
        function showToast(msg,tipo){
            const c=document.getElementById('toastContainer');
            const t=document.createElement('div'); t.className='toast';
            t.innerHTML = `<span class="material-symbols-rounded" style="font-size:16px;color:${tipo==='error'?'var(--accent-pink)':'var(--accent-lime)'}">${tipo==='error'?'error':'check_circle'}</span>${escH(msg)}`;
            c.appendChild(t); setTimeout(()=>t.remove(),4200);
        }
    </script>
    <datalist id="equipesLista"></datalist>
</body>
</html>
