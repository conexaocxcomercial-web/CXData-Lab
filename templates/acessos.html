<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acessos | core.cx</title>
<link rel="icon" href="{{ url_for('static', filename='cx-icon.png') }}">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
<style>
:root{
    --mesa:#EFEFF3; --papel:#FFF; --papel-2:#F7F7F9;
    --linha:#E4E4EA; --linha-2:#D3D3DC;
    --tinta:#17171A; --tinta-2:#56565F; --tinta-3:#7C7C88;
    --acao:#6C5CE7; --acao-fraco:#F1EFFE; --lime:#BEF533;
    --ok:#0E9F6E; --ok-fraco:#E6F7F0;
    --atencao:#C2660B; --at-fundo:#FFF0D6; --at-borda:#E5BE7F;
    --critico:#D42F2F; --cr-fundo:#FBE3E3; --cr-borda:#E9A9A9;
    --azul:#1A5FA0; --azul-fraco:#E9F2FB;
    --r-card:12px; --r-ctrl:9px; --r-pill:999px;
    --e1:0 1px 2px rgba(23,23,26,.05), 0 0 0 1px var(--linha);
    --e2:0 4px 14px rgba(23,23,26,.07), 0 0 0 1px var(--linha);
}
*,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
button,input,select,textarea{ font-family:inherit; border:none; background:none; color:inherit; }
body{ font-family:'Inter',system-ui,sans-serif; background:var(--mesa); color:var(--tinta);
      min-height:100vh; -webkit-font-smoothing:antialiased; }
.num{ font-family:'IBM Plex Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums; }
:focus-visible{ outline:2px solid var(--acao); outline-offset:2px; border-radius:5px; }
@media (prefers-reduced-motion:reduce){ *{ animation:none!important; transition:none!important; } }
::-webkit-scrollbar{ width:8px; height:8px; } ::-webkit-scrollbar-track{ background:transparent; }
::-webkit-scrollbar-thumb{ background:var(--linha-2); border-radius:99px; }

/* ===== ESTRUTURA ===== */
.top-bar{ background:var(--papel); height:56px; padding:0 22px; display:flex;
    justify-content:space-between; align-items:center; border-bottom:1px solid var(--linha);
    position:sticky; top:0; z-index:20; }
.top-bar-logo{ font-size:17px; font-weight:700; letter-spacing:-.4px; cursor:pointer; }
.top-bar-logo span{ color:var(--acao); }

.cmd{ display:flex; align-items:center; gap:11px; padding:0 22px; height:56px;
    background:var(--papel); border-bottom:1px solid var(--linha); flex-wrap:wrap;
    position:sticky; top:56px; z-index:15; }
.cmd-tit{ font-size:16px; font-weight:650; letter-spacing:-.35px; white-space:nowrap; }
.cmd-sep{ width:1px; height:22px; background:var(--linha); }
.segm{ display:flex; background:var(--papel-2); border-radius:var(--r-ctrl); padding:3px; gap:2px; }
.segm-btn{ font-size:12.5px; font-weight:500; color:var(--tinta-2); cursor:pointer;
    padding:6px 13px; border-radius:6px; white-space:nowrap; transition:.15s;
    display:flex; align-items:center; gap:6px; }
.segm-btn:hover{ color:var(--tinta); }
.segm-btn.on{ background:var(--papel); color:var(--tinta); font-weight:600;
    box-shadow:0 1px 2px rgba(0,0,0,.07); }
.segm-n{ font-size:10.5px; font-weight:600; opacity:.6; font-family:'IBM Plex Mono',monospace; }
.segm-btn.on .segm-n{ opacity:1; color:var(--acao); }
.cmd-dir{ margin-left:auto; display:flex; align-items:center; gap:9px; }

.btn{ font-size:12.5px; font-weight:600; cursor:pointer; display:inline-flex; align-items:center;
    gap:6px; padding:8px 13px; border-radius:var(--r-ctrl); white-space:nowrap; transition:.14s; }
.btn .material-symbols-rounded{ font-size:17px; }
.btn-acao{ background:var(--acao); color:#fff; }
.btn-acao:hover{ background:#5a4bd4; }
.btn-acao:disabled{ opacity:.55; cursor:default; }
.btn-borda{ background:var(--papel); color:var(--tinta-2); box-shadow:inset 0 0 0 1px var(--linha); }
.btn-borda:hover{ box-shadow:inset 0 0 0 1px var(--linha-2); color:var(--tinta); }
.btn-fant{ background:var(--papel-2); color:var(--tinta-2); }
.btn-fant:hover{ background:var(--linha); color:var(--tinta); }
.btn-perigo{ background:var(--papel); color:var(--critico); box-shadow:inset 0 0 0 1px var(--cr-borda); }
.btn-perigo:hover{ background:#FDEDED; }

.busca{ position:relative; width:250px; }
.busca .material-symbols-rounded{ position:absolute; left:11px; top:50%; transform:translateY(-50%);
    font-size:17px; color:var(--tinta-3); pointer-events:none; }
.busca input{ width:100%; font-size:12.5px; padding:8px 12px 8px 35px; background:var(--papel-2);
    border:1px solid transparent; border-radius:var(--r-ctrl); outline:none; color:var(--tinta); transition:.14s; }
.busca input::placeholder{ color:var(--tinta-3); }
.busca input:focus{ background:var(--papel); border-color:var(--acao); box-shadow:0 0 0 3px var(--acao-fraco); }
.filtro{ font-size:12.5px; font-weight:500; padding:8px 11px; background:var(--papel-2);
    border-radius:var(--r-ctrl); color:var(--tinta-2); cursor:pointer; outline:none; }

.wrap{ max-width:1240px; margin:0 auto; padding:20px 22px 90px; }
.painel-aba{ display:none; }
.painel-aba.on{ display:block; }

/* ===== ESTADOS ===== */
.esqueleto{ height:62px; background:var(--papel); border-radius:10px; margin-bottom:7px;
    box-shadow:var(--e1); position:relative; overflow:hidden; }
.esqueleto::after{ content:''; position:absolute; inset:0;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);
    animation:brilho 1.4s infinite; }
@keyframes brilho{ from{ transform:translateX(-100%); } to{ transform:translateX(100%); } }
.vazio{ text-align:center; padding:56px 24px; background:var(--papel);
    border-radius:var(--r-card); box-shadow:var(--e1); }
.vazio .material-symbols-rounded{ font-size:40px; color:var(--linha-2); display:block; margin-bottom:13px; }
.vazio h3{ font-size:15px; font-weight:650; margin-bottom:6px; }
.vazio p{ font-size:13px; line-height:1.6; max-width:400px; margin:0 auto 18px; color:var(--tinta-3); }

.faixa{ border-radius:var(--r-card); padding:14px 16px; display:flex; gap:12px;
    align-items:flex-start; margin-bottom:12px; }
.faixa .material-symbols-rounded{ font-size:19px; flex-shrink:0; margin-top:1px; }
.fx-t{ font-size:13px; font-weight:650; margin-bottom:3px; }
.fx-s{ font-size:12.5px; line-height:1.55; }
.faixa.aviso{ background:var(--at-fundo); box-shadow:0 0 0 1px var(--at-borda); }
.faixa.aviso .material-symbols-rounded,.faixa.aviso .fx-t,.faixa.aviso .fx-s{ color:#7A4A0C; }
.faixa.info{ background:var(--acao-fraco); box-shadow:0 0 0 1px #D6CEFB; }
.faixa.info .material-symbols-rounded,.faixa.info .fx-t,.faixa.info .fx-s{ color:#3C3489; }

/* ===== TABELA ===== */
.tabela{ background:var(--papel); border-radius:var(--r-card); box-shadow:var(--e1); overflow:hidden; }
.th,.tr{ display:grid; grid-template-columns:2.1fr 1.25fr 1.5fr 1.3fr 34px;
    gap:14px; padding:0 16px; align-items:center; }
.th{ height:38px; background:var(--papel-2); border-bottom:1px solid var(--linha); }
.th div{ font-size:10.5px; font-weight:600; text-transform:uppercase; letter-spacing:.5px; color:var(--tinta-3); }
.tr{ min-height:64px; border-bottom:1px solid var(--papel-2); cursor:pointer;
    transition:background .12s; width:100%; text-align:left; }
.tr:last-child{ border-bottom:none; }
.tr:hover{ background:var(--papel-2); }
.tr.inativa .pes-nome,.tr.inativa .av{ opacity:.45; }

.pes{ display:flex; align-items:center; gap:11px; min-width:0; }
.av{ width:34px; height:34px; min-width:34px; border-radius:50%; display:flex;
    align-items:center; justify-content:center; font-size:11px; font-weight:650; }
.pes-txt{ min-width:0; }
.pes-nome{ font-size:13px; font-weight:600; letter-spacing:-.1px; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap; display:block; }
.pes-mail{ font-size:11.5px; color:var(--tinta-3); overflow:hidden; text-overflow:ellipsis;
    white-space:nowrap; margin-top:1px; display:block; }
.cel{ font-size:12.5px; color:var(--tinta-2); overflow:hidden; text-overflow:ellipsis;
    white-space:nowrap; display:block; }
.cel.fraca{ color:var(--tinta-3); font-style:italic; }
.cel-sub{ font-size:11px; color:var(--tinta-3); display:block; margin-top:2px;
    font-family:'IBM Plex Mono',monospace; }

.tag{ font-size:11px; font-weight:600; padding:3px 10px; border-radius:99px;
    display:inline-flex; align-items:center; gap:5px; white-space:nowrap; }
.tag .material-symbols-rounded{ font-size:13px; }
.t-adm{ background:var(--cr-fundo); color:var(--critico); }
.t-quadro{ background:var(--ok-fraco); color:var(--ok); }
.t-proprio{ background:var(--papel-2); color:var(--tinta-2); }
.t-resp{ background:var(--acao-fraco); color:var(--acao); }
.t-off{ background:var(--papel-2); color:var(--tinta-3); }
.tr-seta{ color:var(--linha-2); display:flex; justify-content:flex-end; }
.tr-seta .material-symbols-rounded{ font-size:19px; }
.tr:hover .tr-seta{ color:var(--tinta-3); }

@media(max-width:1040px){
    /* Antes quadros e responsabilidade eram escondidos no celular, e
       sobrava uma lista de nomes que não respondia nada — justamente
       as duas colunas que a tela existe para mostrar. Agora tudo
       empilha numa coluna só. */
    .th{ display:none; }
    .tr{ grid-template-columns:1fr; gap:7px; padding:14px 15px; }
    .tr-seta{ display:none; }
    .cel-quadros,.cel-resp{ display:flex; flex-wrap:wrap; align-items:center; gap:6px; }
    .cel-quadros .cel,.cel-resp .cel{ white-space:normal; }
    .cel-sub{ display:inline; margin:0; }
    .cel-resp:empty{ display:none; }
}

/* ===== PAINEL LATERAL ===== */
.painel-fundo{ display:none; position:fixed; inset:0; background:rgba(23,23,26,.32); z-index:900; }
.painel-fundo.show{ display:block; }
.painel{ position:fixed; top:0; right:0; bottom:0; width:100%; max-width:452px;
    background:var(--papel); z-index:901; display:none; flex-direction:column;
    box-shadow:-8px 0 40px rgba(23,23,26,.14); }
.painel.show{ display:flex; }
.pn-head{ padding:18px 20px 16px; border-bottom:1px solid var(--linha); display:flex;
    gap:13px; align-items:flex-start; flex-shrink:0; }
.pn-av{ width:42px; height:42px; min-width:42px; border-radius:50%; display:flex;
    align-items:center; justify-content:center; font-size:13px; font-weight:650; }
.pn-id{ flex:1; min-width:0; }
.pn-nome{ font-size:16px; font-weight:650; letter-spacing:-.3px; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap; }
.pn-mail{ font-size:12px; color:var(--tinta-3); margin-top:2px; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap; }
.pn-x{ width:30px; height:30px; border-radius:8px; background:var(--papel-2); color:var(--tinta-3);
    display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; }
.pn-x:hover{ background:var(--linha); color:var(--tinta); }
.pn-x .material-symbols-rounded{ font-size:18px; }
.pn-corpo{ padding:18px 20px 24px; overflow-y:auto; flex:1; }
.pn-pe{ padding:12px 20px; border-top:1px solid var(--linha); background:var(--papel-2);
    display:flex; gap:9px; align-items:center; flex-shrink:0; flex-wrap:wrap; }
.pn-status{ font-size:11.5px; color:var(--tinta-3); font-weight:500; flex:1; min-width:110px;
    display:flex; align-items:center; gap:6px; }
.pn-status.salvo{ color:var(--ok); }
.pn-status.erro{ color:var(--critico); }
.pn-status .material-symbols-rounded{ font-size:14px; }

.bloco{ margin-bottom:22px; }
.bloco:last-child{ margin-bottom:0; }
.bl-t{ font-size:10.5px; font-weight:600; text-transform:uppercase; letter-spacing:.5px;
    color:var(--tinta-3); margin-bottom:10px; display:flex; align-items:center; gap:8px; }
.bl-cnt{ font-weight:600; color:var(--tinta-2); background:var(--papel-2); padding:1px 7px;
    border-radius:99px; letter-spacing:0; font-family:'IBM Plex Mono',monospace; }
.bl-acao{ margin-left:auto; font-size:11px; font-weight:600; color:var(--acao); cursor:pointer;
    padding:4px 8px; border-radius:6px; letter-spacing:0; text-transform:none; }
.bl-acao:hover{ background:var(--acao-fraco); }
.dica{ font-size:11.5px; color:var(--tinta-3); line-height:1.5; margin-top:9px; }
.dica.alerta{ color:var(--atencao); }
.dica b{ font-weight:650; color:var(--tinta-2); }

/* interruptor */
.sw-linha{ display:flex; align-items:center; gap:12px; padding:12px 13px;
    border-radius:var(--r-ctrl); background:var(--papel-2); transition:.16s; }
.sw-linha.ligado{ background:var(--cr-fundo); box-shadow:inset 0 0 0 1px var(--cr-borda); }
.sw-txt{ flex:1; min-width:0; }
.sw-t{ font-size:12.5px; font-weight:650; }
.sw-d{ font-size:11px; color:var(--tinta-3); line-height:1.45; margin-top:2px; }
.sw-linha.ligado .sw-d{ color:#8A1F1F; opacity:.85; }
.sw{ width:40px; height:23px; border-radius:99px; background:var(--linha-2); position:relative;
    flex-shrink:0; cursor:pointer; transition:.16s; border:none; }
.sw::after{ content:''; position:absolute; top:3px; left:3px; width:17px; height:17px;
    border-radius:50%; background:#fff; transition:.16s; box-shadow:0 1px 3px rgba(0,0,0,.22); }
.sw.on{ background:var(--critico); }
.sw.on::after{ transform:translateX(17px); }

/* segmentado de alcance */
.alc{ display:flex; background:var(--papel-2); border-radius:var(--r-ctrl); padding:3px; gap:2px; }
.alc-op{ flex:1; font-size:12px; font-weight:550; color:var(--tinta-2); padding:9px 10px;
    border-radius:6px; text-align:center; cursor:pointer; white-space:nowrap; transition:.14s; }
.alc-op:hover{ color:var(--tinta); }
.alc-op.on{ background:var(--papel); color:var(--tinta); font-weight:650;
    box-shadow:0 1px 2px rgba(0,0,0,.07); }

/* pílulas */
.chips{ display:flex; gap:6px; flex-wrap:wrap; }
.chip{ font-size:12px; font-weight:500; padding:7px 12px; border-radius:var(--r-pill);
    background:var(--papel-2); color:var(--tinta-2); cursor:pointer; display:inline-flex;
    align-items:center; gap:6px; transition:.14s; border:none; }
.chip:hover{ background:var(--linha); }
.chip .material-symbols-rounded{ font-size:14px; display:none; }
.chip.on{ background:var(--acao-fraco); color:var(--acao); font-weight:600;
    box-shadow:inset 0 0 0 1px var(--acao); }
.chip.on .material-symbols-rounded{ display:block; }
.chip.verde.on{ background:var(--ok-fraco); color:var(--ok); box-shadow:inset 0 0 0 1px var(--ok); }
.chip:disabled{ opacity:.4; cursor:not-allowed; }
.chip:disabled:hover{ background:var(--papel-2); }

.caixa-adm{ background:var(--cr-fundo); border-radius:var(--r-ctrl);
    box-shadow:0 0 0 1px var(--cr-borda); padding:13px 15px; display:flex; gap:10px;
    align-items:flex-start; }
.caixa-adm .material-symbols-rounded{ font-size:18px; color:var(--critico);
    flex-shrink:0; margin-top:1px; }
.caixa-adm span:last-child{ font-size:12px; line-height:1.55; color:#8A1F1F; }

/* ===== REGISTRO ===== */
.reg-l{ display:grid; grid-template-columns:132px 1fr 150px; gap:14px; padding:12px 16px;
    border-bottom:1px solid var(--papel-2); align-items:baseline; }
.reg-l:last-child{ border:none; }
.reg-q{ font-size:11.5px; color:var(--tinta-3); font-family:'IBM Plex Mono',monospace; }
.reg-o{ font-size:12.5px; color:var(--tinta-2); line-height:1.5; }
.reg-o b{ font-weight:650; color:var(--tinta); }
.reg-w{ font-size:12px; color:var(--tinta-2); font-weight:500; }
@media(max-width:760px){ .reg-l{ grid-template-columns:1fr; gap:4px; } }

/* ===== MODAL ===== */
.modal-fundo{ display:none; position:fixed; inset:0; background:rgba(23,23,26,.45); z-index:1000;
    justify-content:center; align-items:center; padding:20px; }
.modal-fundo.show{ display:flex; }
.modal{ background:var(--papel); border-radius:16px; width:100%; max-width:500px; max-height:92vh;
    overflow:hidden; display:flex; flex-direction:column; box-shadow:0 24px 60px rgba(23,23,26,.22); }
.md-head{ padding:17px 20px 15px; border-bottom:1px solid var(--linha); flex-shrink:0; }
.md-ey{ font-size:10.5px; font-weight:600; text-transform:uppercase; letter-spacing:.5px;
    color:var(--tinta-3); margin-bottom:4px; }
.md-t{ font-size:16px; font-weight:650; letter-spacing:-.3px; }
.md-corpo{ padding:18px 20px 22px; display:flex; flex-direction:column; gap:14px; overflow-y:auto; }
.md-pe{ padding:13px 20px; border-top:1px solid var(--linha); display:flex; gap:9px;
    background:var(--papel-2); flex-shrink:0; flex-wrap:wrap; justify-content:flex-end; }
.ig label{ display:block; font-size:11px; font-weight:600; color:var(--tinta-3);
    text-transform:uppercase; letter-spacing:.5px; margin-bottom:7px; }
.ig input{ width:100%; font-size:13px; padding:10px 12px; background:var(--papel-2);
    border:1px solid transparent; border-radius:var(--r-ctrl); color:var(--tinta);
    outline:none; transition:.14s; }
.ig input:focus{ background:var(--papel); border-color:var(--acao); box-shadow:0 0 0 3px var(--acao-fraco); }
.ig2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
@media(max-width:520px){ .ig2{ grid-template-columns:1fr; } }
.ig-dica{ font-size:11px; color:var(--tinta-3); line-height:1.5; margin-top:6px; }
.senha-linha{ display:flex; gap:8px; }
.senha-linha input{ flex:1; font-family:'IBM Plex Mono',monospace; }
.md-erro{ font-size:12px; color:var(--critico); font-weight:500; display:none;
    background:var(--cr-fundo); padding:10px 12px; border-radius:var(--r-ctrl); }
.md-erro.show{ display:block; }

.toast-container{ position:fixed; bottom:26px; left:50%; transform:translateX(-50%); z-index:10002;
    display:flex; flex-direction:column; gap:9px; }
.toast{ background:rgba(23,23,26,.95); color:#fff; padding:11px 20px; border-radius:var(--r-pill);
    font-size:12.5px; font-weight:500; box-shadow:0 10px 30px rgba(0,0,0,.2);
    display:flex; align-items:center; gap:9px; max-width:88vw; }
.toast .material-symbols-rounded{ font-size:17px; }
.toast.erro{ background:var(--critico); }

@media (max-width:900px){
    .top-bar{ padding:0 16px 0 60px; }
    .cmd{ padding:10px 16px; height:auto; row-gap:9px; }
    .cmd-tit,.cmd-sep{ display:none; }
    .segm{ width:100%; }
    .segm-btn{ flex:1; justify-content:center; }

    /* A BARRA DE AÇÕES QUEBRA EM DUAS LINHAS.
       Busca, filtro e botão somam cerca de 400px de largura mínima.
       Numa tela de 360px eles não cabiam lado a lado e o excesso
       empurrava o documento inteiro para o lado — era o que deixava
       uma faixa cinza na direita e cortava o botão. Busca ocupa a
       primeira linha; filtro e botão dividem a segunda. */
    .cmd-dir{ width:100%; margin-left:0; flex-wrap:wrap; }
    .busca{ flex:1 1 100%; width:auto; min-width:0; order:-1; }
    .filtro{ flex:1 1 40%; min-width:0; }
    .cmd-dir .btn{ flex:1 1 40%; justify-content:center; }

    .wrap{ padding:16px 16px 80px; }
    .painel{ max-width:none; }
    .modal-fundo{ padding:0; align-items:flex-end; }
    .modal{ max-width:none; border-radius:18px 18px 0 0; }
}
</style>
</head>
<body>
<div class="top-bar">
    <div class="top-bar-logo" onclick="window.location.href='/'">CX<span>Projetos</span></div>
    {% include '_usermenu.html' %}
</div>
{% include '_sidebar.html' %}

<div class="cmd">
    <span class="cmd-tit">Acessos</span>
    <div class="cmd-sep"></div>
    <div class="segm" role="tablist">
        <button class="segm-btn on" id="tab-pessoas" role="tab" aria-selected="true"
                onclick="Acessos.aba('pessoas')">Pessoas<span class="segm-n" id="nPessoas"></span></button>
        <button class="segm-btn" id="tab-registro" role="tab" aria-selected="false"
                onclick="Acessos.aba('registro')">Registro</button>
    </div>
    <div class="cmd-dir" id="cmdDir"></div>
</div>

<div class="wrap">
    <div class="painel-aba on" id="abaPessoas"></div>
    <div class="painel-aba" id="abaRegistro"></div>
</div>

<!-- painel lateral da pessoa -->
<div class="painel-fundo" id="painelFundo" onclick="Acessos.fecharPainel()"></div>
<aside class="painel" id="painelPessoa" role="dialog" aria-modal="true" aria-labelledby="pnNome">
    <div class="pn-head">
        <span class="pn-av" id="pnAv"></span>
        <div class="pn-id">
            <div class="pn-nome" id="pnNome">—</div>
            <div class="pn-mail" id="pnMail"></div>
        </div>
        <button class="pn-x" onclick="Acessos.fecharPainel()" aria-label="Fechar">
            <span class="material-symbols-rounded">close</span></button>
    </div>
    <div class="pn-corpo" id="pnCorpo"></div>
    <div class="pn-pe">
        <span class="pn-status" id="pnStatus">Vale no próximo login desta pessoa.</span>
        <button class="btn btn-borda" id="pnSenha">
            <span class="material-symbols-rounded">key</span>Senha</button>
        <button class="btn btn-perigo" id="pnAtivo"></button>
    </div>
</aside>

<!-- modal genérico -->
<div class="modal-fundo" id="modalFundo">
    <div class="modal" role="dialog" aria-modal="true">
        <div class="md-head">
            <div class="md-ey" id="mdEy"></div>
            <div class="md-t" id="mdT"></div>
        </div>
        <div class="md-corpo" id="mdCorpo"></div>
        <div class="md-pe" id="mdPe"></div>
    </div>
</div>

<div class="toast-container" id="toasts"></div>

<script>
"use strict";
/* ===========================================================================
   ACESSOS · duas decisões por pessoa e nada de hierarquia
   ---------------------------------------------------------------------------
   A tela guarda o estado da pessoa aberta em `edicao` e só envia ao servidor
   quando algo muda de fato. Cada alteração salva sozinha: não existe botão
   "Salvar" no painel porque não existe rascunho — o que está na tela é o que
   vale, e o rodapé confirma.
   =========================================================================== */
const Acessos = (function(){

  const st = {
    pessoas: [], catalogo: null, registros: [],
    busca: '', filtro: 'todos',
    abaAtual: 'pessoas',
    aberta: null,        // pessoa aberta no painel
    edicao: null,        // cópia editável
    salvando: false,
  };

  /* ---------- utilidades ---------- */
  const esc = s => String(s ?? '').replace(/[&<>"']/g,
    c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  const iniciais = n => {
    const p = String(n||'').trim().split(/\s+/);
    if(!p[0]) return '?';
    return (p.length>1 ? p[0][0]+p[p.length-1][0] : p[0].slice(0,2)).toUpperCase();
  };

  // Cor derivada do nome: a mesma pessoa tem sempre o mesmo avatar, sem
  // precisar guardar isso no banco.
  const PALETA = [
    ['#EEEDFE','#3C3489'], ['#E1F5EE','#0F6E56'], ['#FAECE7','#993C1D'],
    ['#E6F1FB','#185FA5'], ['#FBEAF0','#993556'], ['#EAF3DE','#3B6D11'],
    ['#FFF0D6','#8A5A0B'], ['#E8F0FE','#2B4E8C'],
  ];
  const cor = n => {
    let h = 0;
    for(const ch of String(n||'')) h = (h*31 + ch.charCodeAt(0)) >>> 0;
    return PALETA[h % PALETA.length];
  };

  const av = (nome, cls) => {
    const [bg, fg] = cor(nome);
    return `<span class="${cls}" style="background:${bg};color:${fg}">${esc(iniciais(nome))}</span>`;
  };

  const quando = iso => {
    if(!iso) return '—';
    const d = new Date(iso);
    if(isNaN(d)) return '—';
    const dias = Math.floor((Date.now() - d.getTime())/86400000);
    if(dias === 0) return 'hoje';
    if(dias === 1) return 'ontem';
    if(dias < 30) return `há ${dias} dias`;
    return d.toLocaleDateString('pt-BR');
  };

  function toast(msg, tipo){
    const c = document.getElementById('toasts');
    const t = document.createElement('div');
    t.className = 'toast' + (tipo === 'erro' ? ' erro' : '');
    t.innerHTML = `<span class="material-symbols-rounded">${
      tipo === 'erro' ? 'error' : 'check_circle'}</span><span>${esc(msg)}</span>`;
    c.appendChild(t);
    setTimeout(() => t.remove(), 3600);
  }

  async function api(url, opts){
    const r = await fetch(url, Object.assign({
      headers: {'Content-Type':'application/json'}
    }, opts || {}));
    let corpo = {};
    try { corpo = await r.json(); } catch(e){}
    if(r.status === 401){ window.location.href = '/login?proximo=/acessos'; throw new Error('401'); }
    if(!r.ok) throw new Error(corpo.mensagem || 'Não foi possível concluir.');
    return corpo;
  }

  /* ---------- carga ---------- */
  async function carregar(){
    pintarEsqueleto();
    try{
      const [cat, pes] = await Promise.all([
        api('/api/v2/catalogo'),
        api('/api/v2/acessos/pessoas'),
      ]);
      st.catalogo = cat;
      st.pessoas = pes.pessoas || [];
      document.getElementById('nPessoas').textContent = st.pessoas.length;
      pintarComando();
      pintarLista();
    }catch(e){
      document.getElementById('abaPessoas').innerHTML = `
        <div class="vazio"><span class="material-symbols-rounded">cloud_off</span>
          <h3>Não foi possível carregar</h3><p>${esc(e.message)}</p>
          <button class="btn btn-acao" onclick="Acessos.recarregar()" style="margin:0 auto">
            <span class="material-symbols-rounded">refresh</span>Tentar de novo</button></div>`;
    }
  }

  function pintarEsqueleto(){
    document.getElementById('abaPessoas').innerHTML =
      '<div class="tabela">' + '<div class="esqueleto"></div>'.repeat(6) + '</div>';
  }

  function pintarComando(){
    document.getElementById('cmdDir').innerHTML = `
      <div class="busca">
        <span class="material-symbols-rounded">search</span>
        <input type="search" placeholder="Buscar pessoa" aria-label="Buscar pessoa"
               value="${esc(st.busca)}" oninput="Acessos.buscar(this.value)">
      </div>
      <select class="filtro" aria-label="Filtrar" onchange="Acessos.filtrar(this.value)">
        <option value="todos"${st.filtro==='todos'?' selected':''}>Todas</option>
        <option value="admin"${st.filtro==='admin'?' selected':''}>Administradores</option>
        <option value="semquadro"${st.filtro==='semquadro'?' selected':''}>Sem quadro</option>
        <option value="inativos"${st.filtro==='inativos'?' selected':''}>Desativadas</option>
      </select>
      <button class="btn btn-acao" onclick="Acessos.modalNova()">
        <span class="material-symbols-rounded">person_add</span>Nova pessoa</button>`;
  }

  function visiveis(){
    const b = st.busca.trim().toLowerCase();
    return st.pessoas.filter(p => {
      if(st.filtro === 'admin' && !p.admin) return false;
      if(st.filtro === 'inativos' && p.ativo) return false;
      if(st.filtro === 'semquadro' && (p.admin || p.quadros.length)) return false;
      if(st.filtro !== 'inativos' && !p.ativo && st.filtro !== 'todos') return false;
      if(!b) return true;
      return (p.nome + ' ' + p.email + ' ' + p.cargo).toLowerCase().includes(b);
    });
  }

  function nomeQuadro(chave){
    const q = (st.catalogo?.quadros || []).find(x => x.chave === chave);
    return q ? q.nome : chave;
  }

  function pintarLista(){
    const lista = visiveis();
    const alvo = document.getElementById('abaPessoas');

    if(!lista.length){
      alvo.innerHTML = `<div class="vazio">
        <span class="material-symbols-rounded">person_search</span>
        <h3>Nenhuma pessoa aqui</h3>
        <p>Ajuste a busca ou o filtro para ver outras pessoas.</p></div>`;
      return;
    }

    // Quem está sem quadro nenhum não consegue trabalhar: avisar é mais
    // útil do que deixar a pessoa descobrir no primeiro login.
    const orfaos = st.pessoas.filter(p => p.ativo && !p.admin && !p.quadros.length);
    const aviso = orfaos.length ? `
      <div class="faixa aviso">
        <span class="material-symbols-rounded">warning</span>
        <span><div class="fx-t">${orfaos.length} pessoa${orfaos.length>1?'s':''} sem quadro nenhum</div>
        <div class="fx-s">${esc(orfaos.map(p=>p.nome).join(', '))} — sem quadro,
        não há o que abrir depois do login.</div></span>
      </div>` : '';

    alvo.innerHTML = aviso + `<div class="tabela">
      <div class="th">
        <div>Pessoa</div><div>Acesso</div><div>Quadros</div>
        <div>Responsável em</div><div></div>
      </div>
      ${lista.map(linha).join('')}
    </div>`;
  }

  function linha(p){
    const acesso = p.admin
      ? `<span class="tag t-adm"><span class="material-symbols-rounded">shield</span>Administrador</span>`
      : (p.alcance === 'quadro'
          ? `<span class="tag t-quadro">Vê tudo do quadro</span>`
          : `<span class="tag t-proprio">Só os próprios cards</span>`);

    const quadros = p.admin
      ? `<span class="cel">todos os quadros</span>`
      : (p.quadros.length
          ? `<span class="cel">${esc(p.quadros.slice(0,2).map(nomeQuadro).join(', '))}${
              p.quadros.length>2 ? ' +'+(p.quadros.length-2) : ''}</span>
             <span class="cel-sub">${p.quadros.length} quadro${p.quadros.length>1?'s':''}</span>`
          : `<span class="cel fraca">nenhum quadro</span>`);

    const resp = p.responsavel_em.length
      ? p.responsavel_em.slice(0,2).map(q =>
          `<span class="tag t-resp">${esc(nomeQuadro(q))}</span>`).join(' ') +
        (p.responsavel_em.length>2 ? ` <span class="cel-sub">+${p.responsavel_em.length-2}</span>` : '')
      : `<span class="cel fraca">—</span>`;

    return `<button class="tr${p.ativo?'':' inativa'}" onclick="Acessos.abrir('${p.id}')">
      <span class="pes">${av(p.nome,'av')}
        <span class="pes-txt">
          <span class="pes-nome">${esc(p.nome)}${p.ativo?'':' · desativada'}</span>
          <span class="pes-mail">${esc(p.cargo || p.email)}</span>
        </span></span>
      <span>${acesso}</span>
      <span class="cel-quadros">${quadros}</span>
      <span class="cel-resp">${resp}</span>
      <span class="tr-seta"><span class="material-symbols-rounded">chevron_right</span></span>
    </button>`;
  }

  /* ---------- painel da pessoa ---------- */
  function abrir(id){
    const p = st.pessoas.find(x => x.id === id);
    if(!p) return;
    st.aberta = p;
    st.edicao = JSON.parse(JSON.stringify(p));

    const [bg,fg] = cor(p.nome);
    const pnAv = document.getElementById('pnAv');
    pnAv.style.background = bg; pnAv.style.color = fg;
    pnAv.textContent = iniciais(p.nome);
    document.getElementById('pnNome').textContent = p.nome;
    document.getElementById('pnMail').textContent =
      (p.cargo ? p.cargo + ' · ' : '') + p.email;

    pintarPainel();
    status('Vale no próximo login desta pessoa.');

    document.getElementById('pnSenha').onclick = () => modalSenha(p);
    const btnAtivo = document.getElementById('pnAtivo');
    btnAtivo.innerHTML = `<span class="material-symbols-rounded">${
      p.ativo ? 'block' : 'check_circle'}</span>${p.ativo ? 'Desativar' : 'Reativar'}`;
    btnAtivo.className = 'btn ' + (p.ativo ? 'btn-perigo' : 'btn-borda');
    btnAtivo.onclick = () => alternarAtivo();

    document.getElementById('painelFundo').classList.add('show');
    document.getElementById('painelPessoa').classList.add('show');
  }

  function fecharPainel(){
    document.getElementById('painelFundo').classList.remove('show');
    document.getElementById('painelPessoa').classList.remove('show');
    st.aberta = null; st.edicao = null;
  }

  function status(txt, tipo){
    const el = document.getElementById('pnStatus');
    el.className = 'pn-status' + (tipo ? ' ' + tipo : '');
    const ico = tipo === 'salvo' ? 'check_circle' : tipo === 'erro' ? 'error' : '';
    el.innerHTML = (ico ? `<span class="material-symbols-rounded">${ico}</span>` : '') + esc(txt);
  }

  function pintarPainel(){
    const e = st.edicao;
    const cat = st.catalogo;
    const corpo = document.getElementById('pnCorpo');

    // Administrador tem tudo: mostrar chips desabilitadas seria oferecer
    // uma escolha que não existe.
    if(e.admin){
      corpo.innerHTML = `
        <div class="bloco">${blocoAdmin(e)}</div>
        <div class="bloco">
          <div class="caixa-adm">
            <span class="material-symbols-rounded">shield</span>
            <span><b>Administrador vê e faz tudo.</b> Todos os quadros, todas as telas,
            configurar acessos, apagar em definitivo e o registro de auditoria.
            Não há o que configurar abaixo — desligue o interruptor para
            escolher item a item.</span>
          </div>
        </div>`;
      return;
    }

    const marcados = new Set(e.quadros);
    const resp = new Set(e.responsavel_em);
    const telas = new Set(e.telas);

    corpo.innerHTML = `
      <div class="bloco">${blocoAdmin(e)}</div>

      <div class="bloco">
        <div class="bl-t">Quadros que acessa
          <span class="bl-cnt">${e.quadros.length} de ${cat.quadros.length}</span>
          <button class="bl-acao" onclick="Acessos.todosQuadros()">${
            e.quadros.length === cat.quadros.length ? 'Limpar' : 'Marcar todos'}</button></div>
        <div class="chips">
          ${cat.quadros.map(q => `
            <button class="chip${marcados.has(q.chave)?' on':''}"
                    onclick="Acessos.alternarQuadro('${q.chave}')">
              <span class="material-symbols-rounded">check</span>${esc(q.nome)}</button>`).join('')}
        </div>
        ${!e.quadros.length ? `<div class="dica alerta">Sem quadro nenhum, não há
          o que abrir depois do login.</div>` : ''}
      </div>

      <div class="bloco">
        <div class="bl-t">Dentro desses quadros</div>
        <div class="alc">
          ${cat.alcances.map(a => `
            <button class="alc-op${e.alcance===a.chave?' on':''}"
                    onclick="Acessos.definirAlcance('${a.chave}')">${esc(a.nome)}</button>`).join('')}
        </div>
        <div class="dica">${esc(
          (cat.alcances.find(a => a.chave === e.alcance) || {}).descricao || '')}</div>
      </div>

      <div class="bloco">
        <div class="bl-t">Pode ser responsável em
          <span class="bl-cnt">${e.responsavel_em.length} de ${e.quadros.length}</span></div>
        ${e.quadros.length ? `
          <div class="chips">
            ${e.quadros.map(c => {
              const q = cat.quadros.find(x => x.chave === c) || {chave:c, nome:c};
              return `<button class="chip verde${resp.has(c)?' on':''}"
                        onclick="Acessos.alternarResp('${c}')">
                <span class="material-symbols-rounded">check</span>${esc(q.nome)}</button>`;
            }).join('')}
          </div>
          <div class="dica">Só aparecem os quadros que ela acessa. Marcada aqui, ela
          vira opção em <b>Configurações</b> na hora de definir quem recebe os cards.</div>`
        : `<div class="dica">Escolha ao menos um quadro acima para poder marcar
           responsabilidade.</div>`}
      </div>

      <div class="bloco">
        <div class="bl-t">Telas da plataforma
          <span class="bl-cnt">${e.telas.length} de ${cat.telas.length}</span>
          <button class="bl-acao" onclick="Acessos.todasTelas()">${
            e.telas.length === cat.telas.length ? 'Limpar' : 'Marcar todas'}</button></div>
        <div class="chips">
          ${cat.telas.map(t => `
            <button class="chip${telas.has(t.chave)?' on':''}"
                    onclick="Acessos.alternarTela('${t.chave}')" title="${esc(t.descricao)}">
              <span class="material-symbols-rounded">check</span>${esc(t.nome)}</button>`).join('')}
        </div>
      </div>

      <div class="bloco">
        <div class="bl-t">Sempre liberado</div>
        <div class="dica" style="margin-top:0">
          ${esc((cat.liberado_sempre || []).join(' · '))}.
          <b>Todo mundo tem.</b> O que muda de pessoa para pessoa são os quadros
          e as telas acima.</div>
      </div>`;
  }

  function blocoAdmin(e){
    return `<div class="sw-linha${e.admin?' ligado':''}">
      <div class="sw-txt">
        <div class="sw-t">Administrador</div>
        <div class="sw-d">Tudo liberado, inclusive gerir acessos e apagar em definitivo.</div>
      </div>
      <button class="sw${e.admin?' on':''}" role="switch" aria-checked="${e.admin}"
              aria-label="Administrador" onclick="Acessos.alternarAdmin()"></button>
    </div>`;
  }

  /* ---------- alterações ---------- */
  function alternarAdmin(){
    const e = st.edicao;
    if(!e.admin){
      confirmar('Dar acesso de administrador',
        `<b>${esc(e.nome)}</b> passa a ver e fazer tudo: todos os quadros, todas as
         telas, configurar acessos de qualquer pessoa e apagar itens em definitivo.`,
        'Tornar administrador', () => { e.admin = true; salvar({admin:true}); });
    }else{
      confirmar('Remover acesso de administrador',
        `<b>${esc(e.nome)}</b> perde o acesso total. Você escolhe em seguida quais
         quadros e telas ficam liberados para ela.`,
        'Remover', () => { e.admin = false; salvar({admin:false}); }, true);
    }
  }

  function alternarQuadro(chave){
    const e = st.edicao;
    const i = e.quadros.indexOf(chave);
    if(i >= 0){
      e.quadros.splice(i, 1);
      // Perder o quadro tira a responsabilidade junto: alguém que recebe
      // card de um quadro que não abre é um beco sem saída.
      const j = e.responsavel_em.indexOf(chave);
      if(j >= 0){
        e.responsavel_em.splice(j, 1);
        toast(`${nomeQuadro(chave)}: responsabilidade removida junto`);
      }
    }else{
      e.quadros.push(chave);
    }
    pintarPainel();
    salvar({quadros: e.quadros, responsavel_em: e.responsavel_em});
  }

  function todosQuadros(){
    const e = st.edicao;
    const todas = st.catalogo.quadros.map(q => q.chave);
    if(e.quadros.length === todas.length){
      e.quadros = []; e.responsavel_em = [];
    }else{
      e.quadros = todas;
    }
    pintarPainel();
    salvar({quadros: e.quadros, responsavel_em: e.responsavel_em});
  }

  function alternarResp(chave){
    const e = st.edicao;
    const i = e.responsavel_em.indexOf(chave);
    if(i >= 0) e.responsavel_em.splice(i, 1);
    else e.responsavel_em.push(chave);
    pintarPainel();
    salvar({responsavel_em: e.responsavel_em});
  }

  function alternarTela(chave){
    const e = st.edicao;
    const i = e.telas.indexOf(chave);
    if(i >= 0) e.telas.splice(i, 1);
    else e.telas.push(chave);
    pintarPainel();
    salvar({telas: e.telas});
  }

  function todasTelas(){
    const e = st.edicao;
    const todas = st.catalogo.telas.map(t => t.chave);
    e.telas = e.telas.length === todas.length ? [] : todas;
    pintarPainel();
    salvar({telas: e.telas});
  }

  function definirAlcance(v){
    const e = st.edicao;
    if(e.alcance === v) return;
    e.alcance = v;
    pintarPainel();
    salvar({alcance: v});
  }

  function alternarAtivo(){
    const p = st.aberta;
    const acao = p.ativo ? 'Desativar' : 'Reativar';
    confirmar(`${acao} ${p.nome}`,
      p.ativo
        ? `Ela deixa de conseguir entrar. O histórico, o tempo lançado e os cards
           dela continuam onde estão.`
        : `Ela volta a conseguir entrar com os mesmos acessos de antes.`,
      acao, () => { st.edicao.ativo = !p.ativo; salvar({ativo: st.edicao.ativo}); },
      p.ativo);
  }

  /* ---------- gravação ---------- */
  async function salvar(campos){
    if(!st.aberta || st.salvando) return;
    st.salvando = true;
    status('Salvando…');
    try{
      await api(`/api/v2/acessos/pessoas/${st.aberta.id}`, {
        method: 'PUT', body: JSON.stringify(campos)
      });
      // A fonte da verdade é o servidor; a tela só espelha.
      Object.assign(st.aberta, st.edicao);
      status('Salvo. Vale no próximo login dela.', 'salvo');
      pintarLista();
      if(st.aberta) abrirDeNovoSeAdminMudou(campos);
    }catch(err){
      // Reverte para o que o servidor tem: deixar a tela mostrando algo
      // que não foi gravado é pior do que o erro em si.
      st.edicao = JSON.parse(JSON.stringify(st.aberta));
      pintarPainel();
      status(err.message, 'erro');
      toast(err.message, 'erro');
    }finally{
      st.salvando = false;
    }
  }

  function abrirDeNovoSeAdminMudou(campos){
    if(!('admin' in campos)) return;
    // Virar admin muda quadros e telas no servidor; recarregar mantém a
    // tela igual ao banco em vez de adivinhar.
    recarregar().then(() => {
      const atual = st.pessoas.find(p => p.id === st.aberta?.id);
      if(atual) abrir(atual.id);
    });
  }

  /* ---------- modais ---------- */
  function fecharModal(){ document.getElementById('modalFundo').classList.remove('show'); }

  function modal(ey, titulo, corpo, pe){
    document.getElementById('mdEy').textContent = ey;
    document.getElementById('mdT').textContent = titulo;
    document.getElementById('mdCorpo').innerHTML = corpo;
    document.getElementById('mdPe').innerHTML = pe;
    document.getElementById('modalFundo').classList.add('show');
  }

  function confirmar(titulo, texto, rotulo, aoConfirmar, perigo){
    window.__confirmar = () => { fecharModal(); aoConfirmar(); };
    modal('Confirmar', titulo,
      `<div style="font-size:13px;line-height:1.6;color:var(--tinta-2)">${texto}</div>`,
      `<button class="btn btn-fant" onclick="Acessos.fecharModal()">Cancelar</button>
       <button class="btn ${perigo?'btn-perigo':'btn-acao'}" onclick="window.__confirmar()">
         ${esc(rotulo)}</button>`);
  }

  function senhaSugerida(){
    const abc = 'abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    const b = new Uint32Array(14);
    crypto.getRandomValues(b);
    return Array.from(b, n => abc[n % abc.length]).join('');
  }

  function modalNova(){
    modal('Acessos', 'Nova pessoa', `
      <div class="ig2">
        <div class="ig"><label for="nvNome">Nome</label>
          <input id="nvNome" autocomplete="off" placeholder="Nome completo"></div>
        <div class="ig"><label for="nvCargo">Cargo</label>
          <input id="nvCargo" autocomplete="off" placeholder="Consultora de RH"></div>
      </div>
      <div class="ig"><label for="nvEmail">E-mail</label>
        <input id="nvEmail" type="email" autocomplete="off" placeholder="pessoa@conexaocx.com.br"></div>
      <div class="ig"><label for="nvSenha">Senha provisória</label>
        <div class="senha-linha">
          <input id="nvSenha" value="${senhaSugerida()}">
          <button class="btn btn-fant" onclick="document.getElementById('nvSenha').value=Acessos.senhaSugerida()">
            <span class="material-symbols-rounded">refresh</span></button>
        </div>
        <div class="ig-dica">Passe por um canal seguro. A pessoa entra com ela e você
        pode trocar depois — a senha nunca fica legível no banco.</div></div>
      <div class="md-erro" id="nvErro"></div>
      <div class="ig-dica">Ela nasce <b>sem quadro e sem tela</b>. Você escolhe
      o acesso na página dela, logo depois de criar.</div>`,
      `<button class="btn btn-fant" onclick="Acessos.fecharModal()">Cancelar</button>
       <button class="btn btn-acao" id="nvOk" onclick="Acessos.criar()">
         <span class="material-symbols-rounded">person_add</span>Cadastrar</button>`);
    setTimeout(() => document.getElementById('nvNome').focus(), 60);
  }

  async function criar(){
    const btn = document.getElementById('nvOk');
    const err = document.getElementById('nvErro');
    const dados = {
      nome:  document.getElementById('nvNome').value.trim(),
      cargo: document.getElementById('nvCargo').value.trim(),
      email: document.getElementById('nvEmail').value.trim(),
      senha: document.getElementById('nvSenha').value,
    };
    btn.disabled = true; err.classList.remove('show');
    try{
      const r = await api('/api/v2/acessos/pessoas', {
        method:'POST', body: JSON.stringify(dados)});
      fecharModal();
      await recarregar();
      toast(`${dados.nome} cadastrada. Agora escolha os acessos.`);
      if(r.pessoa) abrir(r.pessoa.id);
    }catch(e){
      err.textContent = e.message; err.classList.add('show');
      btn.disabled = false;
    }
  }

  function modalSenha(p){
    modal('Acessos', `Senha de ${p.nome}`, `
      <div class="ig"><label for="sNova">Nova senha</label>
        <div class="senha-linha">
          <input id="sNova" value="${senhaSugerida()}">
          <button class="btn btn-fant" onclick="document.getElementById('sNova').value=Acessos.senhaSugerida()">
            <span class="material-symbols-rounded">refresh</span></button>
        </div>
        <div class="ig-dica">A senha atual não pode ser consultada — ela não existe
        em texto puro no banco. Defina uma nova e passe por um canal seguro.</div></div>
      <div class="md-erro" id="sErro"></div>`,
      `<button class="btn btn-fant" onclick="Acessos.fecharModal()">Cancelar</button>
       <button class="btn btn-acao" id="sOk" onclick="Acessos.gravarSenha('${p.id}')">
         <span class="material-symbols-rounded">key</span>Definir senha</button>`);
  }

  async function gravarSenha(id){
    const btn = document.getElementById('sOk');
    const err = document.getElementById('sErro');
    btn.disabled = true; err.classList.remove('show');
    try{
      await api(`/api/v2/acessos/pessoas/${id}/senha`, {
        method:'PUT',
        body: JSON.stringify({senha: document.getElementById('sNova').value})});
      fecharModal();
      toast('Senha definida.');
    }catch(e){
      err.textContent = e.message; err.classList.add('show');
      btn.disabled = false;
    }
  }

  /* ---------- registro ---------- */
  const ROTULOS = {
    acesso_alterado: 'alterou o acesso de',
    pessoa_criada: 'cadastrou',
    senha_redefinida: 'redefiniu a senha de',
    quadro_configurado: 'configurou o quadro',
    responsavel_alterado: 'mudou o responsável de',
  };

  async function carregarRegistro(){
    const alvo = document.getElementById('abaRegistro');
    alvo.innerHTML = '<div class="tabela">' + '<div class="esqueleto"></div>'.repeat(5) + '</div>';
    try{
      const r = await api('/api/v2/acessos/registro');
      st.registros = r.registros || [];
      if(!st.registros.length){
        alvo.innerHTML = `<div class="vazio">
          <span class="material-symbols-rounded">history</span>
          <h3>Nada registrado ainda</h3>
          <p>Toda alteração de acesso aparece aqui, com quem fez e quando.</p></div>`;
        return;
      }
      const nomePorId = Object.fromEntries(st.pessoas.map(p => [p.id, p.nome]));
      alvo.innerHTML = `<div class="tabela">${st.registros.map(r2 => {
        const alvoNome = nomePorId[String(r2.alvo_id)] || r2.alvo_id || '';
        return `<div class="reg-l">
          <div class="reg-q">${esc(quando(r2.criado_em))}</div>
          <div class="reg-o"><b>${esc(r2.usuario || 'sistema')}</b>
            ${esc(ROTULOS[r2.acao] || r2.acao)} <b>${esc(alvoNome)}</b></div>
          <div class="reg-w">${esc(new Date(r2.criado_em).toLocaleString('pt-BR'))}</div>
        </div>`;
      }).join('')}</div>`;
    }catch(e){
      alvo.innerHTML = `<div class="vazio"><span class="material-symbols-rounded">cloud_off</span>
        <h3>Não foi possível carregar</h3><p>${esc(e.message)}</p></div>`;
    }
  }

  /* ---------- navegação ---------- */
  function aba(nome){
    st.abaAtual = nome;
    ['pessoas','registro'].forEach(n => {
      const b = document.getElementById('tab-'+n);
      const p = document.getElementById('aba' + n[0].toUpperCase() + n.slice(1));
      b.classList.toggle('on', n === nome);
      b.setAttribute('aria-selected', n === nome);
      p.classList.toggle('on', n === nome);
    });
    document.getElementById('cmdDir').style.display = nome === 'pessoas' ? '' : 'none';
    if(nome === 'registro') carregarRegistro();
  }

  function buscar(v){ st.busca = v; pintarLista(); }
  function filtrar(v){ st.filtro = v; pintarLista(); }
  async function recarregar(){
    const r = await api('/api/v2/acessos/pessoas');
    st.pessoas = r.pessoas || [];
    document.getElementById('nPessoas').textContent = st.pessoas.length;
    pintarLista();
  }

  document.addEventListener('keydown', e => {
    if(e.key !== 'Escape') return;
    if(document.getElementById('modalFundo').classList.contains('show')) fecharModal();
    else if(document.getElementById('painelPessoa').classList.contains('show')) fecharPainel();
  });

  document.addEventListener('DOMContentLoaded', carregar);

  return { aba, abrir, fecharPainel, buscar, filtrar, recarregar, fecharModal,
           alternarAdmin, alternarQuadro, alternarResp, alternarTela,
           todosQuadros, todasTelas, definirAlcance,
           modalNova, criar, gravarSenha, senhaSugerida };
})();
</script>
</body>
</html>
