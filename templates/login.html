<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | core.cx</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='core-cx-favicon.png') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
<style>
:root{
    --mesa:#EFEFF3; --papel:#FFF; --papel-2:#F7F7F9;
    --linha:#E4E4EA; --linha-2:#D3D3DC;
    --tinta:#17171A; --tinta-2:#56565F; --tinta-3:#7C7C88;
    --acao:#6C5CE7; --acao-fraco:#F1EFFE; --acao-escuro:#5546C9;
    --ok:#0E9F6E; --ok-fraco:#E6F7F0;
    --critico:#D42F2F; --cr-fundo:#FBE3E3; --cr-borda:#E9A9A9;
    --r-card:16px; --r-ctrl:10px;
}
*,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
button,input{ font-family:inherit; border:none; background:none; color:inherit; }
html,body{ height:100%; }
body{ font-family:'Inter',system-ui,sans-serif; background:var(--mesa); color:var(--tinta);
      -webkit-font-smoothing:antialiased; }
:focus-visible{ outline:2px solid var(--acao); outline-offset:2px; border-radius:6px; }
@media (prefers-reduced-motion:reduce){ *{ animation:none!important; transition:none!important; } }

/* ============================================================
   DUAS COLUNAS

   A marca ganha metade da tela e para de disputar espaço com o
   formulário. Antes as duas assinaturas viviam dentro do cartão,
   acima do título, e a primeira coisa que se lia numa tela de
   login era publicidade -- não o campo de e-mail.

   Aqui o olho entra pela esquerda, reconhece onde está, e cruza
   para a direita já sabendo o que fazer.
   ============================================================ */
.tela{ min-height:100%; display:grid; grid-template-columns:1.05fr 1fr; }

/* ---------- painel da marca ---------- */
.marca{ position:relative; overflow:hidden; padding:48px 56px;
    display:flex; flex-direction:column; justify-content:space-between;
    background:linear-gradient(155deg,#17171A 0%,#221F3D 48%,#2E2657 100%); color:#fff; }
.marca-topo{ display:flex; align-items:center; gap:14px; position:relative; z-index:2; }
.marca-simbolo{ width:34px; height:auto; display:block; filter:brightness(0) invert(1); }
.marca-nome{ font-size:19px; font-weight:700; letter-spacing:-.5px; }
.marca-nome span{ color:#A99BFF; }

.marca-meio{ position:relative; z-index:2; max-width:420px; }
.marca-frase{ font-size:29px; font-weight:600; letter-spacing:-.9px; line-height:1.3; }
.marca-frase b{ color:#BEF533; font-weight:600; }
/* A frase de apoio encurtou e virou uma linha só. Com menos texto ela
   precisa de mais respiro acima e de um corpo um pouco maior, senão
   fica boiando sob o título em vez de completá-lo. */
.marca-sub{ font-size:15px; line-height:1.6; color:rgba(255,255,255,.66);
    margin-top:20px; max-width:380px; }

.marca-pe{ position:relative; z-index:2; display:flex; align-items:center; gap:10px;
    font-size:12.5px; color:rgba(255,255,255,.45); }
.marca-pe b{ color:rgba(255,255,255,.75); font-weight:600; }

/* O símbolo como marca-d'água: presença sem ruído. `aria-hidden`
   porque é decoração -- o leitor de tela já leu o nome acima. */
.marca-agua{ position:absolute; right:-90px; bottom:-70px; width:460px; opacity:.05;
    filter:brightness(0) invert(1); pointer-events:none; z-index:1; }
.halo{ position:absolute; border-radius:50%; pointer-events:none; z-index:0;
    filter:blur(76px); }
.halo.a{ width:380px; height:380px; background:#6C5CE7; opacity:.34; top:-110px; left:-90px; }
.halo.b{ width:300px; height:300px; background:#BEF533; opacity:.10; bottom:60px; right:-60px; }

/* ---------- painel do formulário ---------- */
.painel{ display:flex; align-items:center; justify-content:center;
    padding:48px 40px; background:var(--papel); }
.forma{ width:100%; max-width:388px; }

.f-cab{ margin-bottom:30px; }
.f-cab h1{ font-size:26px; font-weight:700; letter-spacing:-.8px; line-height:1.2; }
.f-cab p{ font-size:14px; color:var(--tinta-3); margin-top:8px; line-height:1.55; }

.aviso{ display:none; gap:11px; align-items:flex-start; padding:12px 14px;
    border-radius:var(--r-ctrl); font-size:13px; line-height:1.5; margin-bottom:20px; }
.aviso.on{ display:flex; }
.aviso .material-symbols-rounded{ font-size:18px; flex-shrink:0; margin-top:1px; }
.aviso.erro{ background:var(--cr-fundo); color:#8A1F1F; box-shadow:inset 0 0 0 1px var(--cr-borda); }
.aviso.info{ background:var(--acao-fraco); color:#3C3489; box-shadow:inset 0 0 0 1px #D6CEFB; }

.campo{ margin-bottom:16px; }
.campo label{ display:block; font-size:12.5px; font-weight:600; color:var(--tinta-2);
    margin-bottom:7px; }

/* A caixa inteira reage ao foco, não só o input: a borda de foco
   precisa cercar o campo todo, senão o ícone e o olho ficam de fora
   e a área clicável parece menor do que é. */
.caixa{ display:flex; align-items:center; gap:11px; background:var(--papel-2);
    border:1.5px solid transparent; border-radius:var(--r-ctrl); padding:0 14px;
    height:48px; transition:border-color .15s, background .15s, box-shadow .15s; }
.caixa:focus-within{ background:var(--papel); border-color:var(--acao);
    box-shadow:0 0 0 4px var(--acao-fraco); }
.caixa > .material-symbols-rounded{ font-size:19px; color:var(--tinta-3); flex-shrink:0;
    transition:color .15s; }
.caixa:focus-within > .material-symbols-rounded{ color:var(--acao); }
.caixa input{ flex:1; min-width:0; font-size:14.5px; height:100%; outline:none;
    color:var(--tinta); background:none; }
.caixa input::placeholder{ color:var(--tinta-3); }
.caixa input:disabled{ opacity:.55; }
.olho{ width:32px; height:32px; border-radius:8px; color:var(--tinta-3); cursor:pointer;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
    transition:.14s; margin-right:-6px; }
.olho:hover{ background:var(--linha); color:var(--tinta-2); }
.olho .material-symbols-rounded{ font-size:19px; }

.linha{ display:flex; align-items:center; justify-content:space-between; gap:14px;
    margin:20px 0 24px; flex-wrap:wrap; }
.lembrar{ display:flex; align-items:center; gap:9px; font-size:13px; font-weight:500;
    color:var(--tinta-2); cursor:pointer; }
.lembrar:hover{ color:var(--tinta); }
.checkbox{ width:18px; height:18px; border-radius:6px; background:var(--papel);
    box-shadow:inset 0 0 0 1.5px var(--linha-2); position:relative; flex-shrink:0;
    transition:.15s; }
.checkbox.on{ background:var(--acao); box-shadow:inset 0 0 0 1.5px var(--acao); }
.checkbox.on::after{ content:''; position:absolute; left:5.5px; top:2.5px;
    width:5px; height:9px; border:solid #fff; border-width:0 2px 2px 0;
    transform:rotate(45deg); }
.esqueci{ font-size:13px; font-weight:600; color:var(--acao); cursor:pointer; }
.esqueci:hover{ color:var(--acao-escuro); text-decoration:underline; }

.entrar{ width:100%; height:50px; border-radius:var(--r-ctrl); background:var(--acao);
    color:#fff; font-size:14.5px; font-weight:650; cursor:pointer; display:flex;
    align-items:center; justify-content:center; gap:9px; transition:.16s;
    box-shadow:0 2px 12px rgba(108,92,231,.28); }
.entrar:hover:not(:disabled){ background:var(--acao-escuro);
    box-shadow:0 4px 18px rgba(108,92,231,.36); transform:translateY(-1px); }
.entrar:active:not(:disabled){ transform:translateY(0); }
.entrar:disabled{ opacity:.72; cursor:default; box-shadow:none; transform:none; }
.entrar .material-symbols-rounded{ font-size:19px; }
.girando{ animation:girar 1s linear infinite; }
@keyframes girar{ to{ transform:rotate(360deg); } }

.ajuda{ font-size:12.5px; color:var(--tinta-3); line-height:1.6; margin-top:26px;
    padding-top:22px; border-top:1px solid var(--linha); text-align:center; }
.ajuda b{ color:var(--tinta-2); font-weight:600; }

/* Só aparece quando a marca some, no toque. */
.marca-mobile{ display:none; }

/* ============================================================
   RESPONSIVO

   Abaixo de 900px a coluna da marca sai inteira, em vez de virar
   uma faixa espremida: numa tela de telefone o que importa é o
   campo de e-mail, e a marca reaparece como assinatura no topo do
   formulário.
   ============================================================ */
@media (max-width:900px){
    .tela{ grid-template-columns:1fr; }
    .marca{ display:none; }
    .painel{ padding:32px 22px 40px; align-items:flex-start; min-height:100%; }
    .forma{ max-width:420px; margin:0 auto; }
    .marca-mobile{ display:flex; align-items:center; gap:11px; margin-bottom:34px; }
    .marca-mobile img{ width:30px; height:auto; display:block; }
    .marca-mobile span{ font-size:18px; font-weight:700; letter-spacing:-.45px; }
    .marca-mobile span i{ color:var(--acao); font-style:normal; }
    .f-cab h1{ font-size:23px; }
}
@media (max-width:400px){
    .linha{ gap:10px; }
    .esqueci{ font-size:12.5px; }
}

/* Telas altas e estreitas em paisagem: evita o formulário colado. */
@media (max-height:640px) and (min-width:901px){
    .marca{ padding:34px 44px; }
    .marca-frase{ font-size:24px; }
    .painel{ padding:34px 40px; }
}
</style>
</head>
<body>
<main class="tela">

    <section class="marca" aria-hidden="true">
        <span class="halo a"></span>
        <span class="halo b"></span>
        <img class="marca-agua" src="{{ url_for('static', filename='core-cx-mark.png') }}" alt="">

        <div class="marca-topo">
            <img class="marca-simbolo" src="{{ url_for('static', filename='core-cx-mark.png') }}" alt="">
            <span class="marca-nome">core<span>.cx</span></span>
        </div>

        <div class="marca-meio">
            <p class="marca-frase">O trabalho da equipe,<br><b>em um lugar só.</b></p>
            <p class="marca-sub">A operação da conexão.cx, do primeiro contato à entrega.</p>
        </div>

        <div class="marca-pe">
            <span>uma plataforma <b>conexão.cx</b></span>
        </div>
    </section>

    <section class="painel">
        <form class="forma" onsubmit="entrar(); return false;" aria-labelledby="titulo-login">

            <div class="marca-mobile">
                <img src="{{ url_for('static', filename='core-cx-mark.png') }}" alt="core.cx">
                <span>core<i>.cx</i></span>
            </div>

            <header class="f-cab">
                <h1 id="titulo-login">Entrar</h1>
                <p>Acesse com o e-mail da sua conta.</p>
            </header>

            <div class="aviso" id="aviso" role="alert" aria-live="polite">
                <span class="material-symbols-rounded" id="avisoIcone">error</span>
                <span id="avisoTexto"></span>
            </div>

            <div class="campo">
                <label for="email">E-mail</label>
                <div class="caixa">
                    <span class="material-symbols-rounded">mail</span>
                    <input type="email" id="email" placeholder="nome@conexaocx.com.br"
                           autocomplete="username" autocapitalize="none" spellcheck="false">
                </div>
            </div>

            <div class="campo">
                <label for="senha">Senha</label>
                <div class="caixa">
                    <span class="material-symbols-rounded">lock</span>
                    <input type="password" id="senha" placeholder="Sua senha"
                           autocomplete="current-password">
                    <button type="button" class="olho" id="olho" onclick="verSenha()"
                            aria-label="Mostrar senha" title="Mostrar senha">
                        <span class="material-symbols-rounded">visibility</span></button>
                </div>
            </div>

            <div class="linha">
                <button type="button" class="lembrar" onclick="alternarLembrar()" aria-pressed="true">
                    <span class="checkbox on" id="cx" aria-hidden="true"></span>Manter conectado</button>
                <button type="button" class="esqueci" onclick="esqueci()">Esqueci minha senha</button>
            </div>

            <button class="entrar" id="btnEntrar" type="submit">
                <span class="material-symbols-rounded" id="btnIcone">login</span>
                <span id="btnTexto">Entrar</span></button>

            <p class="ajuda"><b>Precisa de ajuda?</b><br>
            Fale com quem administra a plataforma.</p>
        </form>
    </section>

</main>

<script>
        let mostrando = false;
        let lembrar = true;
        let enviando = false;

        document.addEventListener('DOMContentLoaded', function(){
            const email = document.getElementById('email');
            setTimeout(function(){
                if(email.value.trim()) document.getElementById('senha').focus();
                else email.focus();
            }, 90);
        });

        function verSenha(){
            mostrando = !mostrando;
            const senha = document.getElementById('senha');
            const botao = document.getElementById('olho');
            senha.type = mostrando ? 'text' : 'password';
            botao.querySelector('.material-symbols-rounded').innerText = mostrando ? 'visibility_off' : 'visibility';
            botao.setAttribute('aria-label', mostrando ? 'Ocultar senha' : 'Mostrar senha');
            botao.setAttribute('title', mostrando ? 'Ocultar senha' : 'Mostrar senha');
            senha.focus();
        }

        function alternarLembrar(){
            lembrar = !lembrar;
            document.getElementById('cx').classList.toggle('on', lembrar);
            document.querySelector('.lembrar').setAttribute('aria-pressed', lembrar ? 'true' : 'false');
        }

        function mostrarAviso(texto, tipo){
            const aviso = document.getElementById('aviso');
            document.getElementById('avisoTexto').innerText = texto;
            document.getElementById('avisoIcone').innerText = tipo === 'info' ? 'info' : 'error';
            aviso.className = 'aviso on ' + (tipo === 'info' ? 'info' : 'erro');
        }

        function limparAviso(){
            document.getElementById('aviso').className = 'aviso';
        }

        function carregando(estado){
            enviando = estado;
            const botao = document.getElementById('btnEntrar');
            botao.disabled = estado;
            document.getElementById('email').disabled = estado;
            document.getElementById('senha').disabled = estado;
            document.getElementById('btnTexto').innerText = estado ? 'Acessando' : 'Entrar';
            const icone = document.getElementById('btnIcone');
            icone.innerText = estado ? 'progress_activity' : 'login';
            icone.classList.toggle('girando', estado);
        }

        async function entrar(){
            if(enviando) return;
            const email = document.getElementById('email').value.trim();
            const senha = document.getElementById('senha').value;

            if(!email){
                mostrarAviso('Informe o email.', 'erro');
                document.getElementById('email').focus();
                return;
            }

            if(!senha){
                mostrarAviso('Informe a senha.', 'erro');
                document.getElementById('senha').focus();
                return;
            }

            limparAviso();
            carregando(true);

            try{
                const resposta = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, senha: senha, lembrar: lembrar })
                });

                if(resposta.ok){
                    window.location.href = destinoSeguro();
                    return;
                }

                let mensagem = 'Não foi possível entrar. Confira seu email e sua senha.';
                try{
                    const dados = await resposta.json();
                    if(dados && dados.mensagem) mensagem = dados.mensagem;
                }catch(erro){}

                mostrarAviso(mensagem, 'erro');
                const senhaCampo = document.getElementById('senha');
                carregando(false);
                senhaCampo.value = '';
                senhaCampo.focus();
            }catch(erro){
                carregando(false);
                mostrarAviso('Não foi possível falar com o servidor. Verifique sua conexão.', 'erro');
            }
        }

        /* Para onde ir depois de entrar.

           Recusa tres coisas, e a terceira e a que morde:

           1. endereco externo -- "//outro.site" comeca com barra mas leva
              para fora do dominio;
           2. barra invertida -- alguns navegadores tratam "/\\x" como "//x";
           3. rotas que desfazem o login. Um link de /logout gerava
              ?proximo=/logout, e entrar levava direto a sair de novo.
              A tela parecia so recarregar. */
        function destinoSeguro(){
            const destino = new URLSearchParams(window.location.search).get('proximo');
            if(!destino) return '/';
            if(destino[0] !== '/') return '/';
            if(destino[1] === '/' || destino[1] === '\\') return '/';
            const caminho = destino.split('?')[0].replace(/\/+$/, '');
            if(caminho === '/logout' || caminho === '/login') return '/';
            return destino;
        }

        function esqueci(){
            mostrarAviso('A redefinição de senha ainda não está disponível. Peça ajuda a quem administra a plataforma.', 'info');
        }
    </script>
</body>
</html>
