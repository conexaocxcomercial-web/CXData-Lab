<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | core.cx</title>
    <link rel="icon" href="{{ url_for('static', filename='core-cx-icon.png') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <style>
        :root{
            --fundo:#f5f4fa;
            --papel:#ffffff;
            --papel-suave:#f9f8fc;
            --linha:#e7e4ef;
            --linha-forte:#d8d2ea;
            --texto:#1d1928;
            --texto-secundario:#706a7e;
            --texto-suave:#9993a5;
            --roxo:#6c63f6;
            --roxo-escuro:#5a50e2;
            --roxo-suave:#efedff;
            --erro:#bb3045;
            --erro-fundo:#fff1f3;
            --erro-linha:#f7c9d1;
            --raio:16px;
        }

        *{box-sizing:border-box}
        html,body{min-height:100%}
        body{
            margin:0;
            overflow-x:hidden;
            background:var(--fundo);
            color:var(--texto);
            font-family:'Inter',system-ui,sans-serif;
            -webkit-font-smoothing:antialiased;
        }

        button,input{font:inherit}
        button{border:0}
        :focus-visible{outline:3px solid rgba(108,99,246,.24);outline-offset:3px}

        .pagina-login{
            position:relative;
            display:grid;
            place-items:center;
            min-height:100vh;
            padding:clamp(20px,3vh,36px) 24px;
            overflow:hidden;
            background:
                radial-gradient(circle at 15% 13%,rgba(119,99,248,.10),transparent 25%),
                radial-gradient(circle at 88% 88%,rgba(108,99,246,.10),transparent 27%),
                var(--fundo);
        }

        .grafismo{
            position:absolute;
            width:510px;
            height:510px;
            border:1px solid rgba(108,99,246,.09);
            border-radius:50%;
            pointer-events:none;
        }

        .grafismo.um{left:-310px;bottom:-245px;box-shadow:0 0 0 55px rgba(108,99,246,.022),0 0 0 110px rgba(108,99,246,.015)}
        .grafismo.dois{right:-330px;top:-285px;box-shadow:0 0 0 50px rgba(108,99,246,.022)}

        .marca-fundo{
            position:absolute;
            right:clamp(22px,7vw,120px);
            bottom:clamp(18px,5vh,66px);
            color:transparent;
            font-size:clamp(120px,18vw,270px);
            font-weight:700;
            letter-spacing:-.17em;
            line-height:.75;
            pointer-events:none;
            transform:rotate(-9deg);
            -webkit-text-stroke:1px rgba(108,99,246,.10);
        }

        .cartao-login{
            position:relative;
            z-index:1;
            width:min(100%,426px);
            padding:32px 39px;
            border:1px solid rgba(77,58,142,.10);
            border-radius:20px;
            background:rgba(255,255,255,.96);
            box-shadow:0 20px 52px rgba(45,34,82,.10);
        }

        .marcas-login{
            display:flex;
            align-items:center;
            gap:10px;
            height:26px;
            margin-bottom:25px;
            white-space:nowrap;
        }

        .marca-core{
            color:#1d1928;
            font-size:21px;
            font-weight:700;
            letter-spacing:-1.1px;
            line-height:1;
        }

        .marca-core span{color:var(--roxo)}
        .divisor-marca{width:1px;height:18px;background:#ded9ea}

        .marca-conexao{
            color:var(--roxo);
            font-size:18px;
            font-weight:700;
            letter-spacing:-.7px;
            line-height:1;
            white-space:nowrap;
        }

        .cabecalho-formulario h1{
            margin:0;
            font-size:28px;
            font-weight:700;
            letter-spacing:-1.15px;
            line-height:1.12;
        }

        .cabecalho-formulario p{
            margin:8px 0 22px;
            color:var(--texto-secundario);
            font-size:13px;
            line-height:1.6;
        }

        .aviso{
            display:none;
            align-items:flex-start;
            gap:9px;
            margin:0 0 20px;
            padding:11px 12px;
            border:1px solid transparent;
            border-radius:10px;
            font-size:12px;
            line-height:1.5;
        }

        .aviso.on{display:flex}
        .aviso .material-symbols-rounded{flex:0 0 auto;margin-top:1px;font-size:17px}
        .aviso.erro{border-color:var(--erro-linha);background:var(--erro-fundo);color:#a7273b}
        .aviso.info{border-color:#dcd7fb;background:#f7f6ff;color:#4d43b1}

        .campo{margin-top:15px}
        .campo label{display:block;margin-bottom:8px;color:#4c4658;font-size:11px;font-weight:700}
        .caixa{position:relative}

        .caixa > .material-symbols-rounded{
            position:absolute;
            z-index:1;
            top:50%;
            left:14px;
            transform:translateY(-50%);
            color:#928b9e;
            font-size:18px;
            pointer-events:none;
        }

        .campo input{
            width:100%;
            height:48px;
            padding:0 45px 0 43px;
            border:1px solid var(--linha);
            border-radius:11px;
            outline:0;
            background:var(--papel-suave);
            color:var(--texto);
            font-size:13px;
            transition:border-color .16s ease,background .16s ease,box-shadow .16s ease;
        }

        .campo input::placeholder{color:#aaa4b2}
        .campo input:hover{border-color:var(--linha-forte)}
        .campo input:focus{border-color:var(--roxo);background:#fff;box-shadow:0 0 0 3px rgba(108,99,246,.12)}
        .campo input:disabled{cursor:wait;opacity:.65}

        .olho{
            position:absolute;
            z-index:2;
            top:50%;
            right:7px;
            display:grid;
            place-items:center;
            width:34px;
            height:34px;
            transform:translateY(-50%);
            border-radius:8px;
            background:transparent;
            color:#928b9e;
            cursor:pointer;
            transition:background .16s ease,color .16s ease;
        }

        .olho:hover{background:#eeecf4;color:var(--texto)}
        .olho .material-symbols-rounded{font-size:18px}

        .linha-login{
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:14px;
            margin:17px 0 18px;
        }

        .lembrar,.esqueci{
            border:0;
            background:transparent;
            cursor:pointer;
            font-size:11.5px;
            font-weight:600;
        }

        .lembrar{display:inline-flex;align-items:center;gap:8px;color:var(--texto-secundario);white-space:nowrap}
        .checkbox{display:grid;place-items:center;width:16px;height:16px;border:1.5px solid #d6d0e2;border-radius:4px;transition:background .16s ease,border-color .16s ease}
        .checkbox.on{border-color:var(--roxo);background:var(--roxo)}
        .checkbox.on::after{content:'';width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
        .esqueci{color:var(--roxo)}
        .esqueci:hover{color:var(--roxo-escuro);text-decoration:underline}

        .entrar{
            display:flex;
            align-items:center;
            justify-content:center;
            gap:8px;
            width:100%;
            height:49px;
            border-radius:11px;
            background:var(--roxo);
            color:#fff;
            box-shadow:0 10px 17px rgba(86,70,220,.20);
            cursor:pointer;
            font-size:13px;
            font-weight:700;
            transition:background .16s ease,box-shadow .16s ease,transform .16s ease;
        }

        .entrar:hover{background:var(--roxo-escuro);box-shadow:0 13px 22px rgba(86,70,220,.25);transform:translateY(-1px)}
        .entrar:active{transform:translateY(0)}
        .entrar:disabled{cursor:wait;opacity:.7;box-shadow:none;transform:none}
        .entrar .material-symbols-rounded{font-size:18px}
        .girando{animation:girar .8s linear infinite}
        @keyframes girar{to{transform:rotate(360deg)}}

        .ajuda{margin:18px 0 0;text-align:center;color:var(--texto-suave);font-size:11px;line-height:1.65}
        .ajuda b{color:var(--texto-secundario);font-weight:600}

        @media(max-width:520px){
            .pagina-login{place-items:start center;padding:29px 18px}
            .cartao-login{padding:30px 24px;border-radius:18px}
            .marca-fundo{right:-12px;bottom:8px;font-size:138px}
            .marcas-login{gap:8px;margin-bottom:29px}
            .marca-core{font-size:19px}
            .marca-conexao{font-size:17px}
            .cabecalho-formulario h1{font-size:26px}
            .linha-login{align-items:flex-start;flex-direction:column;gap:14px}
        }

        @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
    </style>
</head>
<body>
    <main class="pagina-login">
        <span class="grafismo um"></span>
        <span class="grafismo dois"></span>
        <span class="marca-fundo" aria-hidden="true">cx</span>

        <form class="cartao-login" onsubmit="entrar(); return false;" aria-labelledby="titulo-login">
            <div class="marcas-login" aria-label="core.cx e conexão.cx">
                <span class="marca-core">core<span>.cx</span></span>
                <span class="divisor-marca"></span>
                <span class="marca-conexao">conexão.cx</span>
            </div>

            <header class="cabecalho-formulario">
                <h1 id="titulo-login">Acesse sua conta</h1>
                <p>Informe seus dados para continuar.</p>
            </header>

            <div class="aviso" id="aviso" role="alert" aria-live="polite">
                <span class="material-symbols-rounded" id="avisoIcone">error</span>
                <span id="avisoTexto"></span>
            </div>

            <div class="campo">
                <label for="email">Email</label>
                <div class="caixa">
                    <span class="material-symbols-rounded">mail</span>
                    <input type="email" id="email" placeholder="nome@empresa.com" autocomplete="username" autocapitalize="none" spellcheck="false">
                </div>
            </div>

            <div class="campo">
                <label for="senha">Senha</label>
                <div class="caixa">
                    <span class="material-symbols-rounded">lock</span>
                    <input type="password" id="senha" placeholder="Digite sua senha" autocomplete="current-password">
                    <button type="button" class="olho" id="olho" onclick="verSenha()" aria-label="Mostrar senha" title="Mostrar senha"><span class="material-symbols-rounded">visibility</span></button>
                </div>
            </div>

            <div class="linha-login">
                <button type="button" class="lembrar" onclick="alternarLembrar()" aria-pressed="true"><span class="checkbox on" id="cx" aria-hidden="true"></span>Manter conectado</button>
                <button type="button" class="esqueci" onclick="esqueci()">Esqueci minha senha</button>
            </div>

            <button class="entrar" id="btnEntrar" type="submit"><span class="material-symbols-rounded" id="btnIcone">login</span><span id="btnTexto">Entrar</span></button>
            <p class="ajuda"><b>Precisa de ajuda?</b><br>Fale com quem administra a plataforma.</p>
        </form>
    </main>

    <script>
        let mostrando = false;
        let lembrar = true;
        let enviando = false;

        document.addEventListener('DOMContentLoaded', function(){
            const email = document.getElementById('email');
            setTimeout(function(){
                if(email.value.trim()) document.getElementById('senha').focus();
                else email.focus();
            }, 90);
        });

        function verSenha(){
            mostrando = !mostrando;
            const senha = document.getElementById('senha');
            const botao = document.getElementById('olho');
            senha.type = mostrando ? 'text' : 'password';
            botao.querySelector('.material-symbols-rounded').innerText = mostrando ? 'visibility_off' : 'visibility';
            botao.setAttribute('aria-label', mostrando ? 'Ocultar senha' : 'Mostrar senha');
            botao.setAttribute('title', mostrando ? 'Ocultar senha' : 'Mostrar senha');
            senha.focus();
        }

        function alternarLembrar(){
            lembrar = !lembrar;
            document.getElementById('cx').classList.toggle('on', lembrar);
            document.querySelector('.lembrar').setAttribute('aria-pressed', lembrar ? 'true' : 'false');
        }

        function mostrarAviso(texto, tipo){
            const aviso = document.getElementById('aviso');
            document.getElementById('avisoTexto').innerText = texto;
            document.getElementById('avisoIcone').innerText = tipo === 'info' ? 'info' : 'error';
            aviso.className = 'aviso on ' + (tipo === 'info' ? 'info' : 'erro');
        }

        function limparAviso(){
            document.getElementById('aviso').className = 'aviso';
        }

        function carregando(estado){
            enviando = estado;
            const botao = document.getElementById('btnEntrar');
            botao.disabled = estado;
            document.getElementById('email').disabled = estado;
            document.getElementById('senha').disabled = estado;
            document.getElementById('btnTexto').innerText = estado ? 'Acessando' : 'Entrar';
            const icone = document.getElementById('btnIcone');
            icone.innerText = estado ? 'progress_activity' : 'login';
            icone.classList.toggle('girando', estado);
        }

        async function entrar(){
            if(enviando) return;
            const email = document.getElementById('email').value.trim();
            const senha = document.getElementById('senha').value;

            if(!email){
                mostrarAviso('Informe o email.', 'erro');
                document.getElementById('email').focus();
                return;
            }

            if(!senha){
                mostrarAviso('Informe a senha.', 'erro');
                document.getElementById('senha').focus();
                return;
            }

            limparAviso();
            carregando(true);

            try{
                const resposta = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, senha: senha, lembrar: lembrar })
                });

                if(resposta.ok){
                    window.location.href = destinoSeguro();
                    return;
                }

                let mensagem = 'Não foi possível entrar. Confira seu email e sua senha.';
                try{
                    const dados = await resposta.json();
                    if(dados && dados.mensagem) mensagem = dados.mensagem;
                }catch(erro){}

                mostrarAviso(mensagem, 'erro');
                const senhaCampo = document.getElementById('senha');
                carregando(false);
                senhaCampo.value = '';
                senhaCampo.focus();
            }catch(erro){
                carregando(false);
                mostrarAviso('Não foi possível falar com o servidor. Verifique sua conexão.', 'erro');
            }
        }

        function destinoSeguro(){
            const destino = new URLSearchParams(window.location.search).get('proximo');
            if(!destino) return '/';
            if(destino[0] !== '/') return '/';
            if(destino[1] === '/' || destino[1] === '\\') return '/';
            return destino;
        }

        function esqueci(){
            mostrarAviso('A redefinição de senha ainda não está disponível. Peça ajuda a quem administra a plataforma.', 'info');
        }
    </script>
</body>
</html>
