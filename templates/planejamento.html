<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda | core.cx</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        :root{
            --mesa:#EFEFF3; --papel:#FFF; --papel-2:#F7F7F9;
            --linha:#E4E4EA; --linha-2:#D3D3DC;
            --tinta:#17171A; --tinta-2:#56565F; --tinta-3:#7C7C88;
            --acao:#6C5CE7; --acao-fraco:#F1EFFE; --lime:#BEF533;
            --ok:#0E9F6E; --ok-fraco:#E6F7F0;
            --atencao:#C2660B; --at-fundo:#FFF0D6; --at-borda:#E5BE7F;
            --critico:#D42F2F; --cr-fundo:#FBE3E3; --cr-borda:#E9A9A9;
            --np:#0891B2; --np-fraco:#E0F5F9; --np-borda:#B6E2EB;
            --r-card:12px; --r-ctrl:9px; --r-pill:999px;
            --e1:0 1px 2px rgba(23,23,26,.05), 0 0 0 1px var(--linha);
            --e2:0 4px 14px rgba(23,23,26,.07), 0 0 0 1px var(--linha);
            --e3:0 16px 44px rgba(23,23,26,.14), 0 0 0 1px var(--linha);
            --text-main:#17171A; --text-muted:#7C7C88; --accent-lime:#BEF533; --accent-pink:#FF43C0;
        }
        *,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
        button,input,select,textarea{ font-family:inherit; border:none; }
        body{ font-family:'Inter',system-ui,sans-serif; background:var(--mesa); color:var(--tinta);
              height:100vh; overflow:hidden; display:flex; flex-direction:column; -webkit-font-smoothing:antialiased; }
        .num{ font-family:'IBM Plex Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums; letter-spacing:-.2px; }
        :focus-visible{ outline:2px solid var(--acao); outline-offset:2px; border-radius:4px; }
        @media (prefers-reduced-motion:reduce){ *{ animation:none!important; transition:none!important; } }
        ::-webkit-scrollbar{ width:8px; height:8px; } ::-webkit-scrollbar-track{ background:transparent; }
        ::-webkit-scrollbar-thumb{ background:var(--linha-2); border-radius:99px; }

        .top-bar{ background:var(--papel); height:56px; min-height:56px; flex-shrink:0; padding:0 22px;
            display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--linha); z-index:10; }
        .top-bar-logo{ font-size:17px; font-weight:700; letter-spacing:-.4px; cursor:pointer; }
        .top-bar-logo span{ color:var(--acao); }

        .cmd{ display:flex; align-items:center; gap:11px; padding:0 22px; height:56px; flex-shrink:0;
            background:var(--papel); border-bottom:1px solid var(--linha); flex-wrap:wrap; }
        .cmd-tit{ font-size:16px; font-weight:650; letter-spacing:-.35px; white-space:nowrap; }
        .cmd-sep{ width:1px; height:22px; background:var(--linha); }
        .segm{ display:flex; background:var(--papel-2); border-radius:var(--r-ctrl); padding:3px; gap:2px; }
        .segm-btn{ font-size:12.5px; font-weight:500; color:var(--tinta-2); background:none; cursor:pointer;
            padding:6px 12px; border-radius:6px; display:flex; align-items:center; gap:6px; white-space:nowrap; transition:.15s; }
        .segm-btn.on{ background:var(--papel); color:var(--tinta); font-weight:600; box-shadow:0 1px 2px rgba(0,0,0,.07); }
        .segm-btn .material-symbols-rounded{ font-size:16px; }
        .nav{ display:flex; align-items:center; gap:4px; }
        .nav-btn{ width:30px; height:30px; border-radius:8px; background:var(--papel-2); color:var(--tinta-2);
            display:flex; align-items:center; justify-content:center; cursor:pointer; transition:.15s; }
        .nav-btn:hover{ background:var(--linha); }
        .nav-btn .material-symbols-rounded{ font-size:18px; }
        .nav-tit{ font-size:13.5px; font-weight:650; letter-spacing:-.2px; min-width:150px; text-align:center; text-transform:capitalize; }
        .btn-hoje{ font-size:12.5px; font-weight:600; color:var(--tinta-2); background:var(--papel-2);
            padding:6px 12px; border-radius:var(--r-pill); cursor:pointer; }
        .btn-hoje:hover{ background:var(--linha); }
        .cmd-dir{ margin-left:auto; display:flex; align-items:center; gap:9px; }
        .sel{ font-size:12.5px; font-weight:500; color:var(--tinta); padding:7px 11px; background:var(--papel-2);
            border:1px solid transparent; border-radius:var(--r-ctrl); outline:none; cursor:pointer; }
        .sel:focus{ background:var(--papel); border-color:var(--acao); box-shadow:0 0 0 3px var(--acao-fraco); }
        .btn{ font-size:13px; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:7px;
            padding:8px 14px; border-radius:var(--r-ctrl); transition:.15s; white-space:nowrap; }
        .btn .material-symbols-rounded{ font-size:18px; }
        .btn-fant{ background:var(--papel-2); color:var(--tinta-2); }
        .btn-fant:hover{ background:var(--linha); color:var(--tinta); }
        .btn-acao{ background:var(--acao); color:#fff; }
        .btn-acao:hover{ background:#5a4bd4; }

        .scroll-area{ flex:1; overflow-y:auto; padding:16px 22px 26px; }
        .loading{ text-align:center; padding:56px; color:var(--tinta-3); font-size:13px; font-weight:500; }
        .vazio{ border:1.5px dashed var(--linha-2); border-radius:10px; padding:26px 14px; text-align:center;
            font-size:12.5px; color:var(--tinta-3); font-weight:500; line-height:1.55; }

        /* ===== RESUMO ===== */
        .resumo{ background:var(--papel); border-radius:var(--r-card); box-shadow:var(--e1); padding:15px 18px;
            margin-bottom:14px; display:flex; align-items:center; gap:24px; flex-wrap:wrap; }
        .rz{ min-width:0; }
        .rz-rot{ font-size:10.5px; font-weight:600; text-transform:uppercase; letter-spacing:.5px; color:var(--tinta-3); margin-bottom:5px; }
        .rz-val{ font-size:21px; font-weight:700; letter-spacing:-.6px; line-height:1; }
        .rz-pe{ font-size:11px; color:var(--tinta-3); font-weight:500; margin-top:4px; }
        .rz-barra-wrap{ flex:1; min-width:230px; }
        .rz-topo{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:7px; }
        .rz-lbl{ font-size:11.5px; font-weight:550; color:var(--tinta-2); }
        .rz-num{ font-size:11.5px; color:var(--tinta-3); font-family:'IBM Plex Mono',monospace; }
        .barra{ height:8px; background:var(--papel-2); border-radius:99px; overflow:hidden; display:flex; }
        .barra i{ height:100%; display:block; transition:width .4s; }
        .b-ok{ background:var(--ok); } .b-and{ background:var(--acao); } .b-nao{ background:var(--critico); } .b-np{ background:var(--np); }
        .rz-leg{ display:flex; gap:14px; margin-top:9px; font-size:11px; color:var(--tinta-3); font-weight:500; flex-wrap:wrap; }
        .rz-leg span{ display:flex; align-items:center; gap:5px; }
        .lg{ width:8px; height:8px; border-radius:2px; }

        /* ===== ITEM ===== */
        .at{ background:var(--papel); border-radius:var(--r-card); box-shadow:var(--e1); padding:12px 14px;
            margin-bottom:8px; display:flex; align-items:center; gap:12px; position:relative; overflow:hidden; transition:box-shadow .16s; }
        .at:hover{ box-shadow:var(--e2); }
        .at::before{ content:''; position:absolute; left:0; top:0; bottom:0; width:3px; background:transparent; }
        .at.feito::before{ background:var(--ok); }
        .at.andamento::before{ background:var(--acao); }
        .at.nao::before{ background:var(--critico); }
        .at.naoplan::before{ background:var(--np); }
        .at.feito{ background:var(--papel-2); }
        .at.nao{ background:var(--cr-fundo); box-shadow:0 1px 2px rgba(23,23,26,.05),0 0 0 1px var(--cr-borda); }
        .at.naoplan{ background:var(--np-fraco); box-shadow:0 1px 2px rgba(23,23,26,.05),0 0 0 1px var(--np-borda); }
        .at-check{ width:19px; height:19px; min-width:19px; border-radius:6px; border:1.5px solid var(--linha-2);
            cursor:pointer; display:flex; align-items:center; justify-content:center; background:var(--papel); transition:.15s; padding:0; }
        .at-check:hover{ border-color:var(--ok); }
        .at-check.on{ background:var(--ok); border-color:var(--ok); color:#fff; }
        .at-check .material-symbols-rounded{ font-size:13px; opacity:0; }
        .at-check.on .material-symbols-rounded{ opacity:1; }
        .at-ico{ width:19px; height:19px; min-width:19px; display:flex; align-items:center; justify-content:center; color:var(--np); }
        .at-ico .material-symbols-rounded{ font-size:17px; }
        .at-corpo{ flex:1; min-width:0; }
        .at-nome{ font-size:13.5px; font-weight:600; letter-spacing:-.1px; color:var(--tinta); line-height:1.35; }
        .at.feito .at-nome{ color:var(--tinta-2); }
        .at-meta{ display:flex; align-items:center; gap:9px; margin-top:4px; flex-wrap:wrap; }
        .at-proj{ display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:500; color:var(--tinta-2); min-width:0; }
        .at-proj .pt{ width:6px; height:6px; border-radius:50%; flex-shrink:0; }
        .at-quem{ font-size:11.5px; color:var(--tinta-3); font-weight:500; }
        .selo{ font-size:10px; font-weight:600; padding:2px 7px; border-radius:99px; white-space:nowrap;
            display:inline-flex; align-items:center; gap:4px; }
        .selo .material-symbols-rounded{ font-size:12px; }
        .s-np{ background:rgba(8,145,178,.13); color:var(--np); }
        .s-quadro{ background:rgba(0,0,0,.05); color:var(--tinta-3); }
        .s-nao{ background:rgba(212,47,47,.12); color:var(--critico); }
        .at-dir{ display:flex; align-items:center; gap:9px; flex-shrink:0; }
        .tempo{ display:flex; align-items:baseline; gap:5px; font-family:'IBM Plex Mono',monospace; white-space:nowrap; }
        .t-real{ font-size:13px; font-weight:650; }
        .t-plan{ font-size:11px; color:var(--tinta-3); }
        .at-btn{ font-size:11.5px; font-weight:600; color:var(--tinta-3); background:none; cursor:pointer;
            padding:5px 9px; border-radius:var(--r-ctrl); display:inline-flex; align-items:center; gap:5px; white-space:nowrap; }
        .at-btn:hover{ background:rgba(0,0,0,.05); color:var(--tinta); }
        .at-btn .material-symbols-rounded{ font-size:14px; }
        .at-play{ width:30px; height:30px; min-width:30px; border-radius:50%; background:var(--tinta); color:#fff;
            display:flex; align-items:center; justify-content:center; cursor:pointer; transition:.15s; }
        .at-play:hover{ background:var(--acao); }
        .at-play .material-symbols-rounded{ font-size:16px; }
        .at-rodando{ margin:0 -14px -12px; padding:8px 14px; background:var(--tinta); display:flex; align-items:center; gap:9px; }
        .at-rodando .num{ font-size:12.5px; font-weight:600; color:var(--lime); }
        .at-rodando .lbl{ font-size:10.5px; color:rgba(255,255,255,.6); font-weight:500; }
        .at-rodando .btn-parar{ margin-left:auto; width:24px; height:24px; border-radius:50%; background:var(--lime);
            color:var(--tinta); display:flex; align-items:center; justify-content:center; cursor:pointer; }
        .at-rodando .btn-parar .material-symbols-rounded{ font-size:14px; }

        /* ===== SEMANA ===== */
        .semana{ display:grid; grid-template-columns:repeat(7,1fr); gap:9px; }
        .sd{ background:rgba(255,255,255,.5); border-radius:var(--r-card); padding:8px; min-height:170px; }
        .sd.hoje{ background:var(--acao-fraco); box-shadow:inset 0 0 0 1.5px var(--acao); }
        .sd-cab{ display:flex; align-items:baseline; gap:6px; padding:4px 6px 10px; }
        .sd-dia{ font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.5px; color:var(--tinta-3); }
        .sd-num{ font-size:15px; font-weight:700; letter-spacing:-.4px; }
        .sd.hoje .sd-num,.sd.hoje .sd-dia{ color:var(--acao); }
        .sd-carga{ margin-left:auto; font-size:10.5px; font-weight:600; color:var(--tinta-3); font-family:'IBM Plex Mono',monospace; }
        .sc{ background:var(--papel); border-radius:9px; box-shadow:0 1px 2px rgba(0,0,0,.04),0 0 0 1px var(--linha);
            padding:9px 10px; margin-bottom:6px; cursor:pointer; border-left:3px solid var(--acao); transition:box-shadow .15s; }
        .sc:hover{ box-shadow:var(--e2); }
        .sc.feito{ opacity:.68; border-left-color:var(--ok); }
        .sc.nao{ border-left-color:var(--critico); background:var(--cr-fundo); }
        .sc.np{ border-left-color:var(--np); background:var(--np-fraco); }
        .sc-nome{ font-size:11.5px; font-weight:600; line-height:1.35; color:var(--tinta); margin-bottom:4px; }
        .sc-pe{ display:flex; align-items:center; gap:6px; font-size:10px; color:var(--tinta-3); font-weight:500; }

        /* ===== HISTÓRICO ===== */
        .hg{ background:var(--papel); border-radius:var(--r-card); box-shadow:var(--e1); overflow:hidden; margin-bottom:10px; }
        .hg-cab{ padding:12px 15px; display:flex; align-items:center; gap:11px; border-bottom:1px solid var(--linha); cursor:pointer; }
        .hg-cab:hover{ background:var(--papel-2); }
        .hg-pt{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }
        .hg-nome{ font-size:13px; font-weight:650; letter-spacing:-.1px; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .hg-qtd{ font-size:11px; color:var(--tinta-3); font-weight:500; white-space:nowrap; }
        .hg-tempo{ font-size:13.5px; font-weight:650; font-family:'IBM Plex Mono',monospace; white-space:nowrap; }
        .hg-lista{ max-height:0; overflow:hidden; transition:max-height .25s ease; }
        .hg.aberto .hg-lista{ max-height:1400px; }
        .hl{ padding:10px 15px 10px 34px; border-bottom:1px solid var(--papel-2); display:flex; align-items:center; gap:11px; }
        .hl:last-child{ border-bottom:none; }
        .hl.np{ background:var(--np-fraco); }
        .hl-nome{ flex:1; min-width:0; font-size:12.5px; font-weight:500; color:var(--tinta-2); }
        .hl-quem{ font-size:11px; color:var(--tinta-3); font-weight:500; white-space:nowrap; }
        .hl-data{ font-size:11px; color:var(--tinta-3); font-family:'IBM Plex Mono',monospace; white-space:nowrap; }
        .hl-t{ font-size:12.5px; font-weight:600; font-family:'IBM Plex Mono',monospace; white-space:nowrap; min-width:54px; text-align:right; }

        /* ===== MODAL ===== */
        .modal-overlay{ display:none; position:fixed; inset:0; background:rgba(23,23,26,.45); z-index:1000;
            justify-content:center; align-items:center; padding:20px; }
        .modal-overlay.show{ display:flex; }
        .modal-box{ background:var(--papel); border-radius:16px; width:100%; max-width:470px; overflow:hidden;
            box-shadow:0 24px 60px rgba(23,23,26,.22); }
        .modal-header{ padding:17px 20px 15px; border-bottom:1px solid var(--linha); display:flex; align-items:center; justify-content:space-between; gap:12px; }
        .modal-title{ font-size:16px; font-weight:650; letter-spacing:-.3px; }
        .btn-icon-round{ width:28px; height:28px; border-radius:8px; background:var(--papel-2); color:var(--tinta-3);
            display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; }
        .btn-icon-round:hover{ background:var(--linha); color:var(--tinta); }
        .modal-body{ padding:18px 20px; display:flex; flex-direction:column; gap:15px; }
        .input-group label{ display:block; font-size:11px; font-weight:600; color:var(--tinta-3);
            text-transform:uppercase; letter-spacing:.5px; margin-bottom:7px; }
        .input-item{ width:100%; font-size:13px; color:var(--tinta); padding:9px 11px; background:var(--papel-2);
            border:1px solid transparent; border-radius:var(--r-ctrl); outline:none; transition:.15s; }
        .input-item:focus{ background:var(--papel); border-color:var(--acao); box-shadow:0 0 0 3px var(--acao-fraco); }
        .modal-footer{ padding:13px 20px; border-top:1px solid var(--linha); display:flex; gap:9px; justify-content:flex-end; background:var(--papel-2); }

        /* ===== PLAYER ===== */
        .floating-player{ position:fixed; bottom:20px; right:20px; z-index:900; background:var(--tinta); color:#fff;
            padding:11px 13px 11px 16px; border-radius:14px; display:flex; align-items:center; gap:14px;
            box-shadow:0 14px 40px rgba(23,23,26,.28); max-width:calc(100vw - 40px); }
        .fp-info{ display:flex; flex-direction:column; min-width:0; max-width:210px; }
        .fp-area{ font-size:10px; font-weight:600; letter-spacing:.4px; text-transform:uppercase; color:rgba(255,255,255,.55);
            white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .fp-nome{ font-size:13px; font-weight:600; line-height:1.3; letter-spacing:-.15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin:1px 0; }
        .fp-tarefa{ font-size:10.5px; color:rgba(255,255,255,.55); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .fp-timer{ font-family:'IBM Plex Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums;
            font-size:16px; font-weight:600; color:var(--lime); flex-shrink:0; }
        .fp-btn{ width:32px; height:32px; min-width:32px; border-radius:50%; cursor:pointer;
            display:flex; align-items:center; justify-content:center; transition:.15s; }
        .fp-btn .material-symbols-rounded{ font-size:17px; }
        .fp-pausar{ background:rgba(255,255,255,.14); color:#fff; }
        .fp-parar{ background:var(--lime); color:var(--tinta); }

        /* ===== TOAST ===== */
        .toast-container{ position:fixed; bottom:26px; left:50%; transform:translateX(-50%); z-index:10001; display:flex; flex-direction:column; gap:9px; }
        .toast{ background:rgba(23,23,26,.95); color:#fff; padding:11px 20px; border-radius:var(--r-pill);
            font-size:12.5px; font-weight:500; box-shadow:0 10px 30px rgba(0,0,0,.2); display:flex; align-items:center; gap:9px;
            animation:sobe .3s ease forwards; }
        @keyframes sobe{ from{ opacity:0; transform:translateY(14px);} to{ opacity:1; transform:translateY(0);} }

        /* ===== TIRA DE DIAS (celular) ===== */
        .m-tiras{ display:none; gap:5px; padding:10px 16px; overflow-x:auto; background:var(--papel);
            border-bottom:1px solid var(--linha); flex-shrink:0; }
        .m-tiras::-webkit-scrollbar{ display:none; }
        .mt{ min-width:46px; padding:7px 4px; border-radius:10px; background:var(--papel-2); text-align:center;
            flex-shrink:0; cursor:pointer; border:none; }
        .mt.on{ background:var(--tinta); }
        .mt-d{ font-size:9.5px; font-weight:600; text-transform:uppercase; color:var(--tinta-3); }
        .mt.on .mt-d{ color:rgba(255,255,255,.6); }
        .mt-n{ font-size:14px; font-weight:700; letter-spacing:-.3px; margin-top:2px; }
        .mt.on .mt-n{ color:#fff; }
        .mt-p{ display:flex; gap:2px; justify-content:center; margin-top:4px; height:5px; }
        .mt-p i{ width:4px; height:4px; border-radius:50%; display:block; }

        /* ===== RESPONSIVO ===== */
        @media (max-width:1100px){ .semana{ grid-template-columns:repeat(4,1fr); } }
        @media (max-width:900px){
            body{ height:auto; min-height:100vh; overflow:visible; }
            .top-bar{ padding:0 16px 0 60px; }
            .cmd{ padding:10px 16px; height:auto; row-gap:9px; }
            .cmd-dir{ width:100%; margin-left:0; }
            .cmd-dir .sel{ flex:1; }
            .nav-tit{ min-width:0; flex:1; }
            .scroll-area{ padding:14px 16px 24px; }
            .semana{ grid-template-columns:1fr; }
            .m-tiras{ display:flex; }
            .nav{ display:none; }
            .btn-hoje{ display:none; }
            .floating-player{ left:12px; right:12px; bottom:12px; max-width:none; padding:10px 11px 10px 14px; gap:11px; }
            .fp-info{ flex:1; max-width:none; }
            .modal-overlay{ padding:0; align-items:flex-end; }
            .modal-box{ max-width:none; border-radius:18px 18px 0 0; max-height:92vh; overflow-y:auto; }
            .at-btn span:not(.material-symbols-rounded){ display:none; }
            .hl-quem{ display:none; }
        }
        .btn-sec{ font-size:13px; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:7px;
            padding:8px 14px; border-radius:var(--r-ctrl); background:var(--papel-2); color:var(--tinta-2); transition:.15s; }
        .btn-sec:hover{ background:var(--linha); color:var(--tinta); }
    </style>
</head>
<body>
    <div class="top-bar">
        <div class="top-bar-logo" onclick="window.location.href='/'">CX<span>Projetos</span></div>
        {% include '_usermenu.html' %}
    </div>
    {% include '_sidebar.html' %}

    <div class="cmd">
        <span class="cmd-tit">Agenda</span>
        <div class="cmd-sep"></div>
        <div class="segm" role="tablist">
            <button class="segm-btn on" id="tab-dia" onclick="mudarView('dia')"><span class="material-symbols-rounded">today</span>Dia</button>
            <button class="segm-btn" id="tab-semana" onclick="mudarView('semana')"><span class="material-symbols-rounded">view_week</span>Semana</button>
            <button class="segm-btn" id="tab-historico" onclick="mudarView('historico')"><span class="material-symbols-rounded">history</span>Histórico</button>
        </div>
        <div class="nav" id="navGrupo">
            <button class="nav-btn" onclick="navegar(-1)" aria-label="Anterior"><span class="material-symbols-rounded">chevron_left</span></button>
            <span class="nav-tit" id="navTitulo"></span>
            <button class="nav-btn" onclick="navegar(1)" aria-label="Próximo"><span class="material-symbols-rounded">chevron_right</span></button>
        </div>
        <button class="btn-hoje" onclick="voltarHoje()">Hoje</button>
        <div class="cmd-dir">
            <select class="sel" id="filtroColab" onchange="renderizar()">
                <option value="__eu__">Só as minhas</option>
                <option value="">Toda a equipe</option>
            </select>
            <select class="sel" id="filtroPeriodo" style="display:none;" onchange="renderizar()"></select>
            <select class="sel" id="filtroAgrupar" style="display:none;" onchange="renderizar()">
                <option value="projeto">Agrupar por projeto</option>
                <option value="pessoa">Agrupar por pessoa</option>
            </select>
            <button class="btn btn-acao" id="btnNova" onclick="abrirModalNovo()"><span class="material-symbols-rounded">add</span>Planejar</button>
        </div>
    </div>

    <div class="m-tiras" id="tiraDias"></div>

    <div class="scroll-area" id="conteudo"><div class="loading">Carregando...</div></div>

    <div class="modal-overlay" id="modalNovo">
        <div class="modal-box">
            <div class="modal-header">
                <span class="modal-title" id="modalTitulo">Nova Atividade</span>
                <div class="btn-icon-round" onclick="fecharModal()">
                    <span class="material-symbols-rounded" style="font-size:18px;">close</span>
                </div>
            </div>
            <input type="hidden" id="editandoId">
            <div class="input-group">
                <label>Cliente *</label>
                <select id="selectCliente" onchange="filtrarProjetosPorCliente()">
                    <option value="">Selecione um cliente...</option>
                </select>
            </div>
            <div class="input-group">
                <label>Projeto *</label>
                <select id="selectProjeto" disabled onchange="carregarAtividadesDoProjetoSelecionado()">
                    <option value="">Selecione o cliente primeiro...</option>
                </select>
            </div>
            <div class="input-group">
                <label>Atividade *</label>
                <select id="selectAtividade" disabled>
                    <option value="">Selecione o projeto primeiro...</option>
                </select>
            </div>
            <div class="input-group">
                <label>Data Planejada *</label>
                <input type="date" id="inputData">
            </div>
            <div class="modal-footer">
                <button class="btn-sec" onclick="fecharModal()">CANCELAR</button>
                <button class="btn-acao" id="btnSalvar" onclick="salvarAtividade()">SALVAR</button>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>
    <div id="floatingPlayer" class="floating-player" style="display:none;">
        <div class="fp-info">
            <span class="fp-area" id="fpArea"></span>
            <span class="fp-nome" id="fpNome"></span>
            <span class="fp-tarefa" id="fpTarefa"></span>
        </div>
        <div class="fp-timer" id="fpTempo">00:00:00</div>
        <button class="fp-btn fp-pausar" id="btnPauseResume" onclick="togglePauseTimer()" aria-label="Pausar ou retomar">
            <span class="material-symbols-rounded" id="iconPauseResume">pause</span>
        </button>
        <button class="fp-btn fp-parar" onclick="pararTimer()" aria-label="Finalizar">
            <span class="material-symbols-rounded">stop</span>
        </button>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script>
        const NOME_USUARIO = "{{ usuario_nome }}";
        const NIVEL_ACESSO = "{{ nivel_acesso }}";

        let projetos = [], projetosMap = {};
        let planejamentos = [], planejamentosMap = {};
        let logs = [];                 // time_logs do período
        let temEndpointLogs = true;    // degrada sem quebrar se a rota não existir
        let viewAtual = 'dia';
        let dataRef = new Date();
        let activeTimerData = null, intervaloRelogio = null;
        let editandoId = null;

        const CORES_AREA = {
            'Recrutamento e seleção':'#6C5CE7', 'RH Estratégico':'#0E9F6E', 'Projetos':'#6C5CE7',
            'RH Interno':'#C2660B', 'CX Data':'#0EA5E9', 'Comercial':'#C2660B',
            'Marketing':'#DB2777', 'Adm/Fin':'#0891B2'
        };
        const QUADRO_AREA = {
            'Recrutamento e seleção':'R&S', 'RH Estratégico':'RH Estratégico', 'Projetos':'Projetos',
            'RH Interno':'RH Interno', 'CX Data':'CX Data', 'Comercial':'Comercial',
            'Marketing':'Marketing', 'Adm/Fin':'Financeiro'
        };
        function corArea(a){ return CORES_AREA[a] || '#7C7C88'; }
        function quadroArea(a){ return QUADRO_AREA[a] || (a || '—'); }

        document.addEventListener('DOMContentLoaded', iniciar);

        function escH(s){ if(s===null||s===undefined) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
        function escA(s){ return escH(s).replace(/'/g,'&#39;'); }
        function fmtSeg(t){ const h=Math.floor(t/3600),m=Math.floor((t%3600)/60),s=t%60;
            return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'); }
        function fmtTempo(seg){ seg=seg||0; if(seg<60) return '0min';
            const h=Math.floor(seg/3600), m=Math.floor((seg%3600)/60);
            return h===0 ? m+'min' : h+'h'+(m?String(m).padStart(2,'0'):''); }
        function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
        function dataDe(s){ if(!s) return null; const p=String(s).split('T')[0].split('-'); if(p.length!==3) return null;
            const d=new Date(+p[0],+p[1]-1,+p[2]); d.setHours(0,0,0,0); return d; }
        function inicioSemana(d){ const x=new Date(d); const dia=x.getDay(); x.setDate(x.getDate()-dia); x.setHours(0,0,0,0); return x; }
        function ehHoje(d){ const h=new Date(); return d.getDate()===h.getDate()&&d.getMonth()===h.getMonth()&&d.getFullYear()===h.getFullYear(); }

        // ===================== CARGA =====================
        async function iniciar(){
            restaurarTimer();
            try {
                const rp = await fetch('/api/projetos');
                const dp = await rp.json();
                projetos = (dp.projetos || dp || []).filter(p => !p.excluido_em);
                projetos.forEach(p => projetosMap[p.id] = p);
            } catch(e){ projetos = []; }
            await recarregar();
        }

        async function recarregar(){
            try {
                const r = await fetch('/api/planejamento');
                const d = await r.json();
                planejamentos = d.planejamentos || [];
                planejamentosMap = {};
                planejamentos.forEach(p => planejamentosMap[p.id] = p);
            } catch(e){ planejamentos = []; }
            await carregarLogs();
            montarFiltros();
            renderizar();
        }

        // time_logs do período visível. Sem a rota, a tela segue funcionando
        // só com o plano — apenas o "realizado" fica vazio.
        async function carregarLogs(){
            if (!temEndpointLogs) { logs = []; return; }
            const [de, ate] = intervaloAtual();
            try {
                const r = await fetch(`/api/timelogs?de=${de}&ate=${ate}`);
                if (r.status === 404) { temEndpointLogs = false; logs = []; return; }
                const d = await r.json();
                logs = d.logs || [];
            } catch(e){ temEndpointLogs = false; logs = []; }
        }

        function intervaloAtual(){
            if (viewAtual === 'dia') { const s = iso(dataRef); return [s, s]; }
            if (viewAtual === 'semana'){
                const i = inicioSemana(dataRef), f = new Date(i); f.setDate(f.getDate()+6);
                return [iso(i), iso(f)];
            }
            const sel = document.getElementById('filtroPeriodo');
            if (sel && sel.value) { const [a,m] = sel.value.split('-').map(Number);
                return [iso(new Date(a,m-1,1)), iso(new Date(a,m,0))]; }
            const h = new Date();
            return [iso(new Date(h.getFullYear(),h.getMonth(),1)), iso(new Date(h.getFullYear(),h.getMonth()+1,0))];
        }

        function montarFiltros(){
            const sc = document.getElementById('filtroColab');
            const nomes = [...new Set(planejamentos.map(p=>p.colaborador).concat(logs.map(l=>l.colaborador)).filter(Boolean))].sort();
            const atual = sc.value;
            sc.innerHTML = '<option value="__eu__">Só as minhas</option><option value="">Toda a equipe</option>' +
                nomes.filter(n=>n!==NOME_USUARIO).map(n=>`<option value="${escA(n)}">${escH(n)}</option>`).join('');
            sc.value = atual || '__eu__';

            const sp = document.getElementById('filtroPeriodo');
            if (!sp.options.length){
                const h = new Date(); let ops = '';
                for (let i=0;i<12;i++){ const d=new Date(h.getFullYear(),h.getMonth()-i,1);
                    const v = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
                    ops += `<option value="${v}">${d.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}</option>`; }
                sp.innerHTML = ops;
            }
        }

        function euFiltro(){ const v = document.getElementById('filtroColab').value;
            return v === '__eu__' ? NOME_USUARIO : v; }
        function passaColab(nome){ const f = euFiltro(); return !f || (nome||'') === f; }

        // ===================== MODELO =====================
        // Une plano e execução: um item por planejamento, mais os logs órfãos.
        function itensDoDia(dataStr){
            const plans = planejamentos.filter(p => String(p.data_planejada).split('T')[0] === dataStr && passaColab(p.colaborador));
            const logsDia = logs.filter(l => String(l.criado_em).split('T')[0] === dataStr && passaColab(l.colaborador));

            const itens = plans.map(p => {
                const meus = logsDia.filter(l => String(l.planejamento_id) === String(p.id));
                const seg = meus.reduce((a,l)=>a+(l.tempo_segundos||0),0);
                return { tipo:'plano', plan:p, projeto:projetosMap[p.projeto_id],
                         nome:p.atividade, colaborador:p.colaborador, status:p.status, segundos:seg };
            });
            // logs sem plano = trabalho iniciado no quadro
            logsDia.filter(l => !l.planejamento_id).forEach(l => {
                itens.push({ tipo:'naoplan', log:l, projeto:projetosMap[l.projeto_id],
                             nome:l.descricao_tarefa || 'Atividade', colaborador:l.colaborador,
                             status:'Concluído', segundos:l.tempo_segundos||0 });
            });
            return itens;
        }

        function resumoDe(itens){
            const plan = itens.filter(i=>i.tipo==='plano');
            const np   = itens.filter(i=>i.tipo==='naoplan');
            const feitas = plan.filter(i=>i.status==='Concluído').length;
            const nao    = plan.filter(i=>i.status==='Não Realizado').length;
            const and    = plan.filter(i=>i.status==='Em Andamento').length;
            const segPlan = plan.reduce((a,i)=>a+i.segundos,0);
            const segNp   = np.reduce((a,i)=>a+i.segundos,0);
            return { total:plan.length, feitas, nao, andamento:and, pend:plan.length-feitas-nao-and,
                     segPlan, segNp, segTotal:segPlan+segNp, qtdNp:np.length };
        }

        // ===================== NAVEGAÇÃO =====================
        function mudarView(v){
            viewAtual = v;
            ['dia','semana','historico'].forEach(x=>{
                const b=document.getElementById('tab-'+x); if(b) b.classList.toggle('on', x===v);
            });
            document.getElementById('navGrupo').style.display = (v==='historico') ? 'none' : '';
            document.querySelector('.btn-hoje').style.display = (v==='historico') ? 'none' : '';
            document.getElementById('filtroPeriodo').style.display = (v==='historico') ? '' : 'none';
            document.getElementById('filtroAgrupar').style.display = (v==='historico') ? '' : 'none';
            document.getElementById('btnNova').style.display = (v==='historico') ? 'none' : 'inline-flex';
            document.getElementById('tiraDias').style.display = (v==='historico') ? 'none' : '';
            carregarLogs().then(renderizar);
        }
        function navegar(d){
            if (viewAtual==='dia') dataRef.setDate(dataRef.getDate()+d);
            else dataRef.setDate(dataRef.getDate()+7*d);
            carregarLogs().then(renderizar);
        }
        function voltarHoje(){ dataRef = new Date(); carregarLogs().then(renderizar); }
        function irParaDia(s){ const d=dataDe(s); if(d){ dataRef=d; viewAtual='dia'; mudarView('dia'); } }

        function atualizarTitulo(){
            const t = document.getElementById('navTitulo');
            if (viewAtual==='dia') t.textContent = dataRef.toLocaleDateString('pt-BR',{weekday:'short',day:'numeric',month:'long'});
            else { const i=inicioSemana(dataRef), f=new Date(i); f.setDate(f.getDate()+6);
                t.textContent = i.toLocaleDateString('pt-BR',{day:'numeric',month:'short'})+' — '+f.toLocaleDateString('pt-BR',{day:'numeric',month:'short'}); }
        }

        function montarTira(){
            const alvo = document.getElementById('tiraDias');
            const i = inicioSemana(dataRef);
            let h = '';
            for (let k=0;k<7;k++){
                const d = new Date(i); d.setDate(d.getDate()+k);
                const s = iso(d);
                const itens = itensDoDia(s);
                const pts = itens.slice(0,4).map(it=>{
                    const c = it.tipo==='naoplan' ? 'b-np'
                        : it.status==='Concluído' ? 'b-ok'
                        : it.status==='Não Realizado' ? 'b-nao'
                        : it.status==='Em Andamento' ? 'b-and' : '';
                    return `<i class="${c}" ${c?'':'style="background:var(--linha-2)"'}></i>`;
                }).join('');
                h += `<button class="mt ${iso(dataRef)===s?'on':''}" onclick="irParaDia('${s}')">
                        <div class="mt-d">${d.toLocaleDateString('pt-BR',{weekday:'short'}).replace('.','')}</div>
                        <div class="mt-n num">${d.getDate()}</div>
                        <div class="mt-p">${pts}</div>
                      </button>`;
            }
            alvo.innerHTML = h;
        }

        // ===================== RENDER =====================
        function renderizar(){
            atualizarTitulo();
            if (viewAtual !== 'historico') montarTira();
            if (viewAtual === 'dia') return renderDia();
            if (viewAtual === 'semana') return renderSemana();
            return renderHistorico();
        }

        function blocoResumo(r, rotulo){
            const seg = Math.max(1, r.segTotal);
            const pFeito = (r.feitas/Math.max(1,r.total))*100;
            const pAnd   = (r.andamento/Math.max(1,r.total))*100;
            const pNao   = (r.nao/Math.max(1,r.total))*100;
            const pNp    = r.segTotal ? (r.segNp/seg)*100 : 0;
            return `<div class="resumo">
                <div class="rz"><div class="rz-rot">Planejado</div><div class="rz-val num">${r.total}</div><div class="rz-pe">atividade${r.total!==1?'s':''}</div></div>
                <div class="rz"><div class="rz-rot">Registrado</div><div class="rz-val num" style="color:var(--ok)">${fmtTempo(r.segTotal)}</div><div class="rz-pe">${rotulo}</div></div>
                <div class="rz"><div class="rz-rot">Fora do plano</div><div class="rz-val num" style="color:${r.segNp?'var(--np)':'var(--tinta-3)'}">${r.segNp?fmtTempo(r.segNp):'—'}</div><div class="rz-pe">${r.segNp?Math.round(pNp)+'% do registrado':'nada fora do plano'}</div></div>
                <div class="rz-barra-wrap">
                    <div class="rz-topo"><span class="rz-lbl">Andamento</span><span class="rz-num">${r.feitas} de ${r.total} concluída${r.feitas!==1?'s':''}</span></div>
                    <div class="barra">
                        <i class="b-ok" style="width:${pFeito}%"></i>
                        <i class="b-and" style="width:${pAnd}%"></i>
                        <i class="b-nao" style="width:${pNao}%"></i>
                    </div>
                    <div class="rz-leg">
                        <span><span class="lg b-ok"></span>Concluída (${r.feitas})</span>
                        <span><span class="lg b-and"></span>Em andamento (${r.andamento})</span>
                        <span><span class="lg b-nao"></span>Não realizada (${r.nao})</span>
                        ${r.qtdNp?`<span><span class="lg b-np"></span>Fora do plano (${r.qtdNp})</span>`:''}
                    </div>
                </div>
            </div>`;
        }

        function linhaItem(it){
            const proj = it.projeto;
            const cor = corArea(proj && proj.area);
            const rodando = activeTimerData && it.tipo==='plano' && String(activeTimerData.planId)===String(it.plan.id);
            const feito = it.status==='Concluído';
            const nao   = it.status==='Não Realizado';
            let classe = it.tipo==='naoplan' ? 'naoplan' : feito ? 'feito' : nao ? 'nao' : rodando ? 'andamento' : '';

            const projHtml = proj
                ? `<span class="at-proj"><span class="pt" style="background:${cor}"></span>${escH(quadroArea(proj.area))} · ${escH(proj.nome_projeto)}</span>`
                : '<span class="at-proj" style="color:var(--tinta-3)">Sem projeto</span>';

            const quem = (euFiltro() ? '' : `<span class="at-quem">${escH(it.colaborador)}</span>`);

            if (it.tipo === 'naoplan') {
                return `<div class="at naoplan">
                    <span class="at-ico"><span class="material-symbols-rounded">bolt</span></span>
                    <div class="at-corpo">
                        <div class="at-nome">${escH(it.nome)}</div>
                        <div class="at-meta">${projHtml}<span class="selo s-quadro"><span class="material-symbols-rounded">view_kanban</span>iniciado no quadro</span>${quem}</div>
                    </div>
                    <div class="at-dir">
                        <button class="at-btn" onclick="incorporarAoPlano('${escA(it.log.id)}')" title="Criar o planejamento correspondente">
                            <span class="material-symbols-rounded">playlist_add</span><span>Incorporar ao plano</span></button>
                        <span class="tempo"><span class="t-real num" style="color:var(--np)">${fmtTempo(it.segundos)}</span></span>
                    </div>
                </div>`;
            }

            const acao = rodando ? '' : (feito || nao ? '' :
                `<button class="at-play" title="Iniciar timer" onclick="iniciarTimerPlan('${escA(it.plan.id)}')"><span class="material-symbols-rounded">play_arrow</span></button>`);
            const tempoHtml = it.segundos
                ? `<span class="tempo"><span class="t-real num" style="color:var(--ok)">${fmtTempo(it.segundos)}</span></span>`
                : '';
            const btnAdiar = nao
                ? `<button class="at-btn" onclick="passarParaAmanha('${escA(it.plan.id)}')"><span class="material-symbols-rounded">event_repeat</span><span>Passar para amanhã</span></button>`
                : '';

            const rodape = rodando
                ? `<div class="at-rodando"><span class="num" id="relogioInline">00:00:00</span><span class="lbl">cronometrando pela agenda</span>
                     <span class="btn-parar" onclick="pararTimer()"><span class="material-symbols-rounded">stop</span></span></div>`
                : '';

            return `<div class="at ${classe}" ${rodando?'style="flex-direction:column;align-items:stretch;gap:0;padding-bottom:0"':''}>
                ${rodando?'<div style="display:flex;align-items:center;gap:12px;padding-bottom:11px">':''}
                <button class="at-check ${feito?'on':''}" onclick="alternarConcluida('${escA(it.plan.id)}')" aria-label="Concluir">
                    <span class="material-symbols-rounded">check</span></button>
                <div class="at-corpo">
                    <div class="at-nome">${escH(it.nome)}</div>
                    <div class="at-meta">${projHtml}${nao?'<span class="selo s-nao">não realizada</span>':''}${quem}</div>
                </div>
                <div class="at-dir">${btnAdiar}${tempoHtml}${acao}
                    <button class="at-btn" onclick="abrirModalEditar('${escA(it.plan.id)}')" title="Editar"><span class="material-symbols-rounded">edit</span></button>
                </div>
                ${rodando?'</div>':''}
                ${rodape}
            </div>`;
        }

        function renderDia(){
            const s = iso(dataRef);
            const itens = itensDoDia(s);
            const c = document.getElementById('conteudo');
            if (!itens.length){
                c.innerHTML = `<div class="vazio">Nada planejado nem registrado neste dia.<br>Use <b>Planejar</b> para adicionar uma atividade.</div>`;
                return;
            }
            c.innerHTML = blocoResumo(resumoDe(itens), 'neste dia') + itens.map(linhaItem).join('');
            if (activeTimerData) iniciarRelogioVisual();
        }

        function renderSemana(){
            const i = inicioSemana(dataRef);
            let cols = '', todos = [];
            for (let k=0;k<7;k++){
                const d = new Date(i); d.setDate(d.getDate()+k);
                const s = iso(d);
                const itens = itensDoDia(s); todos = todos.concat(itens);
                const seg = itens.reduce((a,x)=>a+x.segundos,0);
                const cards = itens.map(it=>{
                    const cls = it.tipo==='naoplan' ? 'np' : it.status==='Concluído' ? 'feito' : it.status==='Não Realizado' ? 'nao' : '';
                    const proj = it.projeto;
                    return `<div class="sc ${cls}" onclick="irParaDia('${s}')">
                        <div class="sc-nome">${escH(it.nome)}</div>
                        <div class="sc-pe">${proj?escH(quadroArea(proj.area)):'—'}${it.segundos?`<span class="num" style="margin-left:auto">${fmtTempo(it.segundos)}</span>`:''}</div>
                    </div>`;
                }).join('') || '<div class="vazio" style="padding:14px 8px;font-size:11.5px">Nada</div>';
                cols += `<div class="sd ${ehHoje(d)?'hoje':''}">
                    <div class="sd-cab">
                        <span class="sd-dia">${d.toLocaleDateString('pt-BR',{weekday:'short'}).replace('.','')}</span>
                        <span class="sd-num num">${d.getDate()}</span>
                        <span class="sd-carga num">${seg?fmtTempo(seg):'—'}</span>
                    </div>${cards}</div>`;
            }
            document.getElementById('conteudo').innerHTML =
                blocoResumo(resumoDe(todos), 'nesta semana') + `<div class="semana">${cols}</div>`;
        }

        function renderHistorico(){
            const [de, ate] = intervaloAtual();
            const agrupar = document.getElementById('filtroAgrupar').value || 'projeto';
            const meus = logs.filter(l => passaColab(l.colaborador));

            if (!temEndpointLogs){
                document.getElementById('conteudo').innerHTML =
                    `<div class="vazio">O histórico precisa da rota <code>/api/timelogs</code>, que ainda não existe no servidor.<br>
                     Enquanto isso, Dia e Semana funcionam mostrando só o planejamento.</div>`;
                return;
            }
            if (!meus.length){
                document.getElementById('conteudo').innerHTML = `<div class="vazio">Nenhum tempo registrado neste período.</div>`;
                return;
            }

            const segTotal = meus.reduce((a,l)=>a+(l.tempo_segundos||0),0);
            const segNp = meus.filter(l=>!l.planejamento_id).reduce((a,l)=>a+(l.tempo_segundos||0),0);
            const plansPeriodo = planejamentos.filter(p=>{
                const s = String(p.data_planejada).split('T')[0];
                return s>=de && s<=ate && passaColab(p.colaborador);
            });
            const aderencia = plansPeriodo.length
                ? Math.round(plansPeriodo.filter(p=>p.status==='Concluído').length / plansPeriodo.length * 100) : null;

            const grupos = {};
            meus.forEach(l=>{
                let chave, nome, cor;
                if (agrupar==='pessoa'){ chave = l.colaborador||'—'; nome = chave; cor = '#6C5CE7'; }
                else { const p = projetosMap[l.projeto_id];
                    chave = l.projeto_id||'—';
                    nome = p ? quadroArea(p.area)+' · '+p.nome_projeto : 'Projeto removido';
                    cor = corArea(p && p.area); }
                if (!grupos[chave]) grupos[chave] = { nome, cor, seg:0, itens:[], sub: agrupar==='pessoa'?'':(projetosMap[l.projeto_id]||{}).empresa||'' };
                grupos[chave].seg += l.tempo_segundos||0;
                grupos[chave].itens.push(l);
            });
            const lista = Object.values(grupos).sort((a,b)=>b.seg-a.seg);

            const cabecalho = `<div class="resumo">
                <div class="rz"><div class="rz-rot">Registrado</div><div class="rz-val num">${fmtTempo(segTotal)}</div><div class="rz-pe">em ${lista.length} ${agrupar==='pessoa'?'pessoa(s)':'projeto(s)'}</div></div>
                <div class="rz"><div class="rz-rot">Aderência ao plano</div><div class="rz-val num" style="color:${aderencia===null?'var(--tinta-3)':aderencia>=70?'var(--ok)':'var(--atencao)'}">${aderencia===null?'—':aderencia+'%'}</div><div class="rz-pe">${plansPeriodo.length} planejada(s)</div></div>
                <div class="rz"><div class="rz-rot">Fora do plano</div><div class="rz-val num" style="color:var(--np)">${segTotal?Math.round(segNp/segTotal*100):0}%</div><div class="rz-pe">${fmtTempo(segNp)} do total</div></div>
                <div class="rz"><div class="rz-rot">Registros</div><div class="rz-val num">${meus.length}</div><div class="rz-pe">no período</div></div>
            </div>`;

            const grupoHtml = lista.map((g,idx)=>`
                <div class="hg ${idx===0?'aberto':''}" id="hg${idx}">
                    <div class="hg-cab" onclick="document.getElementById('hg${idx}').classList.toggle('aberto')">
                        <span class="hg-pt" style="background:${g.cor}"></span>
                        <span class="hg-nome">${escH(g.nome)}</span>
                        <span class="hg-qtd">${g.sub?escH(g.sub)+' · ':''}${g.itens.length} registro${g.itens.length!==1?'s':''}</span>
                        <span class="hg-tempo">${fmtTempo(g.seg)}</span>
                    </div>
                    <div class="hg-lista">
                        ${g.itens.sort((a,b)=>String(b.criado_em).localeCompare(String(a.criado_em))).map(l=>{
                            const np = !l.planejamento_id;
                            const d = dataDe(l.criado_em);
                            return `<div class="hl ${np?'np':''}">
                                <span class="hl-nome">${escH(l.descricao_tarefa||'Atividade')}${np?'<span class="selo s-np" style="margin-left:6px"><span class="material-symbols-rounded">bolt</span>fora do plano</span>':''}</span>
                                <span class="hl-quem">${escH(l.colaborador)}</span>
                                <span class="hl-data">${d?d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}):'—'}</span>
                                <span class="hl-t" ${np?'style="color:var(--np)"':''}>${fmtTempo(l.tempo_segundos||0)}</span>
                            </div>`;
                        }).join('')}
                    </div>
                </div>`).join('');

            document.getElementById('conteudo').innerHTML = cabecalho + grupoHtml;
        }

        // ===================== AÇÕES =====================
        async function alternarConcluida(planId){
            const p = planejamentosMap[planId]; if(!p) return;
            const novo = p.status === 'Concluído' ? 'Planejado' : 'Concluído';
            await atualizarStatus(planId, novo);
        }
        async function passarParaAmanha(planId){
            const p = planejamentosMap[planId]; if(!p) return;
            const d = dataDe(p.data_planejada) || new Date();
            d.setDate(d.getDate()+1);
            try{
                const r = await fetch(`/api/planejamento/${planId}`, { method:'PUT', headers:{'Content-Type':'application/json'},
                    body: JSON.stringify({ projeto_id:p.projeto_id, atividade:p.atividade, data_planejada:iso(d), colaborador:p.colaborador, status:'Planejado' })});
                if(r.ok){ showToast('Passada para o dia seguinte.','success'); await recarregar(); }
                else showToast('Erro ao mover.','error');
            }catch(e){ showToast('Erro de conexão.','error'); }
        }
        // Cria o planejamento correspondente a um trabalho feito fora do plano.
        async function incorporarAoPlano(logId){
            const l = logs.find(x=>String(x.id)===String(logId)); if(!l) return;
            try{
                const r = await fetch('/api/planejamento', { method:'POST', headers:{'Content-Type':'application/json'},
                    body: JSON.stringify({ projeto_id:l.projeto_id, atividade:l.descricao_tarefa||'Atividade',
                        data_planejada:String(l.criado_em).split('T')[0], colaborador:l.colaborador, status:'Concluído' })});
                if(r.ok){ showToast('Incorporado ao plano.','success'); await recarregar(); }
                else showToast('Erro ao incorporar.','error');
            }catch(e){ showToast('Erro de conexão.','error'); }
        }

        // ===================== TIMER =====================
        function iniciarTimerPlan(planId){
            if (activeTimerData){ showToast('Você já tem um timer ativo. Finalize-o primeiro.','error'); return; }
            const p = planejamentosMap[planId]; if(!p) return;
            const proj = projetosMap[p.projeto_id];
            activeTimerData = {
                id: p.projeto_id, planId: p.id,
                nome: proj ? proj.nome_projeto : 'Projeto', area: proj ? proj.area : '',
                tarefa: p.atividade, colaborador: p.colaborador || NOME_USUARIO,
                baseSegundosOriginal: 0, sessaoAtualSegundos: 0,
                startTime: Date.now(), isoInicio: new Date().toISOString(), paused: false
            };
            localStorage.setItem('cxdata_timer_ativo', JSON.stringify(activeTimerData));
            renderizar();
            iniciarRelogioVisual();
        }

        function restaurarTimer(){
            try{ const s = localStorage.getItem('cxdata_timer_ativo');
                if(s){ activeTimerData = JSON.parse(s); iniciarRelogioVisual(); } }catch(e){}
        }

        function iniciarRelogioVisual(){
            if (intervaloRelogio) clearInterval(intervaloRelogio);
            const player = document.getElementById('floatingPlayer');
            if (!activeTimerData){ if(player) player.style.display='none'; return; }
            if (player){
                player.style.display = 'flex';
                document.getElementById('fpArea').innerText = quadroArea(activeTimerData.area);
                document.getElementById('fpNome').innerText = activeTimerData.nome;
                document.getElementById('fpTarefa').innerText = activeTimerData.tarefa || '';
            }
            intervaloRelogio = setInterval(()=>{
                if(!activeTimerData){ clearInterval(intervaloRelogio); return; }
                if(!activeTimerData.paused)
                    activeTimerData.sessaoAtualSegundos = Math.floor((Date.now()-activeTimerData.startTime)/1000);
                const t = fmtSeg((activeTimerData.baseSegundosOriginal||0)+(activeTimerData.sessaoAtualSegundos||0));
                const fp = document.getElementById('fpTempo'); if(fp) fp.innerText = t;
                const inline = document.getElementById('relogioInline'); if(inline) inline.innerText = t;
            },1000);
        }

        function togglePauseTimer(){
            if(!activeTimerData) return;
            if(activeTimerData.paused){
                activeTimerData.startTime = Date.now() - (activeTimerData.sessaoAtualSegundos*1000);
                activeTimerData.paused = false;
                document.getElementById('iconPauseResume').innerText = 'pause';
            } else {
                activeTimerData.paused = true;
                document.getElementById('iconPauseResume').innerText = 'play_arrow';
            }
            localStorage.setItem('cxdata_timer_ativo', JSON.stringify(activeTimerData));
        }

        async function pararTimer(){
            if(!activeTimerData) return;
            const d = { ...activeTimerData };
            const seg = d.sessaoAtualSegundos || 0;
            activeTimerData = null;
            localStorage.removeItem('cxdata_timer_ativo');
            if (intervaloRelogio) clearInterval(intervaloRelogio);
            const player = document.getElementById('floatingPlayer'); if(player) player.style.display='none';
            if (seg < 3){ showToast('Tempo muito curto, não registrado.','error'); renderizar(); return; }
            try{
                // planejamento_id é o que amarra este tempo à atividade prevista
                await fetch(`/api/projetos/${d.id}/timer`, { method:'POST', headers:{'Content-Type':'application/json'},
                    body: JSON.stringify({ tempo_segundos: seg, colaborador: d.colaborador,
                        descricao_tarefa: d.tarefa, data_inicio_atividade: d.isoInicio,
                        data_fim_atividade: new Date().toISOString(), planejamento_id: d.planId || null })});
                if (d.planId) await atualizarStatus(d.planId, 'Concluído', true);
                showToast('Tempo registrado: '+fmtTempo(seg),'success');
            }catch(e){ showToast('Erro ao salvar o tempo.','error'); }
            await recarregar();
        }

        function abrirModalNovo() {
            document.getElementById('editandoId').value = '';
            document.getElementById('modalTitulo').textContent = 'Nova Atividade';
            document.getElementById('selectCliente').value = '';
            document.getElementById('selectProjeto').innerHTML = '<option value="">Selecione o cliente primeiro...</option>';
            document.getElementById('selectProjeto').disabled = true;
            document.getElementById('selectAtividade').innerHTML = '<option value="">Selecione o projeto primeiro...</option>';
            document.getElementById('selectAtividade').disabled = true;
            document.getElementById('inputData').value = HOJE_ISO;
            document.getElementById('modalNovo').classList.add('show');
        }

        function abrirModalEditar(itemId) {
            const item = planejamentosMap[itemId];
            if (!item) return;
            const proj = getProj(item.projeto_id);

            document.getElementById('editandoId').value = item.id;
            document.getElementById('modalTitulo').textContent = 'Editar Atividade';

            // 1. Seta cliente e filtra projetos
            document.getElementById('selectCliente').value = proj.empresa || '';
            filtrarProjetosPorCliente();

            // 2. Seta projeto e carrega atividades
            document.getElementById('selectProjeto').value = item.projeto_id;
            carregarAtividadesDoProjetoSelecionado();

            // 3. Seta atividade
            document.getElementById('selectAtividade').value = item.atividade;

            document.getElementById('inputData').value = item.data;
            document.getElementById('modalNovo').classList.add('show');
        }

        function fecharModal() {
            document.getElementById('modalNovo').classList.remove('show');
        }

        async function salvarAtividade() {
            const editandoId = document.getElementById('editandoId').value;
            const projetoId = document.getElementById('selectProjeto').value;
            const atividade = document.getElementById('selectAtividade').value;
            const data = document.getElementById('inputData').value;

            if (!projetoId || !atividade || !data) {
                showToast('Preencha todos os campos obrigatórios.', 'error');
                return;
            }

            const btn = document.getElementById('btnSalvar');
            btn.disabled = true; btn.textContent = 'SALVANDO...';

            try {
                const payload = {
                    projeto_id: projetoId,
                    atividade,
                    data_planejada: data,
                    colaborador: nomeUsuario,
                    status: 'Planejado'
                };
                // Na edição, não sobrescreve o status atual
                if (editandoId) delete payload.status;

                const url = editandoId ? `/api/planejamento/${editandoId}` : '/api/planejamento';
                const method = editandoId ? 'PUT' : 'POST';
                const res = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                if (res.ok) {
                    showToast(editandoId ? 'Atividade atualizada!' : 'Atividade criada!', 'success');
                    fecharModal();
                    await carregarPlanejamentos();
                } else {
                    const err = await res.json();
                    showToast(`Erro: ${err.mensagem || 'Falha desconhecida'}`, 'error');
                }
            } catch(e) { showToast('Erro de conexão.', 'error'); }
            finally { btn.disabled = false; btn.textContent = 'SALVAR'; }
        }

        async function atualizarStatus(itemId, novoStatus, recarregar = true) {
            try {
                await fetch(`/api/planejamento/${itemId}`, {
                    method: 'PUT', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: novoStatus })
                });
                // Atualiza local imediatamente
                if (planejamentosMap[itemId]) {
                    planejamentosMap[itemId].status = novoStatus;
                    const idx = planejamentos.findIndex(p => String(p.id) === String(itemId));
                    if (idx !== -1) planejamentos[idx].status = novoStatus;
                }
                if (recarregar) await carregarPlanejamentos();
                else renderizarView();
            } catch(e) { showToast('Erro ao atualizar status.', 'error'); }
        }

        async function excluirAtividade(itemId) {
            if (!confirm('Deseja excluir esta atividade?')) return;
            try {
                const res = await fetch(`/api/planejamento/${itemId}`, { method: 'DELETE' });
                if (res.ok) { showToast('Atividade excluída.', 'success'); await carregarPlanejamentos(); }
                else showToast('Erro ao excluir.', 'error');
            } catch(e) { showToast('Erro de conexão.', 'error'); }
        }

        // ==========================================
        // UTILS
        // ==========================================

        function filtrarProjetosPorCliente() {
            const cliente = document.getElementById('selectCliente').value;
            const selProjeto = document.getElementById('selectProjeto');
            const selAtiv = document.getElementById('selectAtividade');

            if (!cliente) {
                selProjeto.innerHTML = '<option value="">Selecione o cliente primeiro...</option>';
                selProjeto.disabled = true;
                selAtiv.innerHTML = '<option value="">Selecione o projeto primeiro...</option>';
                selAtiv.disabled = true;
                return;
            }

            // Só projetos ativos: exclui finalizados e cancelados (evita listas gigantes)
            const STATUS_INATIVOS = ['finalizado', 'cancelado', 'concluído', 'concluido', 'arquivado'];
            const filtrados = projetosGlobal.filter(p => {
                if (p.empresa !== cliente) return false;
                const st = (p.status || '').trim().toLowerCase();
                return !STATUS_INATIVOS.includes(st);
            });
            selProjeto.innerHTML = filtrados.length > 0
                ? '<option value="">Selecione um projeto...</option>'
                : '<option value="">Nenhum projeto ativo para este cliente</option>';
            filtrados.forEach(p => {
                const o = document.createElement('option');
                o.value = p.id;
                o.textContent = p.nome_projeto;
                o.dataset.area = p.area;
                o.dataset.status = p.status || '';
                selProjeto.appendChild(o);
            });
            selProjeto.disabled = filtrados.length === 0;

            // Limpa atividades ao trocar cliente
            selAtiv.innerHTML = '<option value="">Selecione o projeto primeiro...</option>';
            selAtiv.disabled = true;
        }

        function carregarAtividadesDoProjetoSelecionado() {
            const selProjeto = document.getElementById('selectProjeto');
            const selAtiv = document.getElementById('selectAtividade');
            const opt = selProjeto.options[selProjeto.selectedIndex];
            const area = opt ? opt.dataset.area : null;
            const status = opt ? opt.dataset.status : null;

            if (!area) {
                selAtiv.innerHTML = '<option value="">Selecione o projeto primeiro...</option>';
                selAtiv.disabled = true;
                return;
            }

            // RH Estratégico: atividades específicas da FASE (status/coluna do projeto)
            let lista;
            if (area === 'RH Estratégico' && ATIVIDADES_POR_FASE_RH[status]) {
                lista = ATIVIDADES_POR_FASE_RH[status];
            } else {
                lista = ATIVIDADES_POR_AREA[area] || [];
            }

            selAtiv.innerHTML = lista.length > 0 ? '<option value="">Selecione a atividade...</option>' : '<option value="">Sem atividades para esta fase</option>';
            lista.forEach(a => {
                const o = document.createElement('option');
                o.value = a; o.textContent = a;
                selAtiv.appendChild(o);
            });
            selAtiv.disabled = lista.length === 0;
        }

        function showToast(msg, tipo){
            const c = document.getElementById('toastContainer');
            const t = document.createElement('div');
            t.className = 'toast';
            t.innerHTML = `<span class="material-symbols-rounded" style="font-size:16px;color:${tipo==='error'?'var(--accent-pink)':'var(--accent-lime)'}">${tipo==='error'?'error':'check_circle'}</span>${msg}`;
            c.appendChild(t); setTimeout(()=>t.remove(), 3200);
        }
        document.querySelectorAll('.modal-overlay').forEach(function(m){
            m.addEventListener('click', function(e){ if(e.target===this) this.classList.remove('show'); });
        });
        document.addEventListener('keydown', function(e){
            if(e.key==='Escape') document.querySelectorAll('.modal-overlay.show').forEach(m=>m.classList.remove('show'));
        });
        window.addEventListener('resize', function(){ if(viewAtual!=='historico') montarTira(); });
    </script>
</body>
