<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comercial | core.cx</title>
<link rel="icon" type="image/png" href="{{ url_for('static', filename='core-cx-favicon.png') }}">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
<style>
:root{
    --mesa:#EFEFF3; --papel:#FFF; --papel-2:#F7F7F9;
    --linha:#E4E4EA; --linha-2:#D3D3DC;
    --tinta:#17171A; --tinta-2:#56565F; --tinta-3:#7C7C88;
    --acao:#6C5CE7; --acao-fraco:#F1EFFE; --lime:#BEF533;
    --ok:#0E9F6E; --ok-fraco:#E6F7F0;
    --atencao:#C2660B; --at-fundo:#FFF0D6; --at-borda:#E5BE7F;
    --critico:#D42F2F; --cr-fundo:#FBE3E3; --cr-borda:#E9A9A9;
    --azul:#1A5FA0; --azul-fraco:#E9F2FB;
    --r-card:12px; --r-ctrl:9px; --r-pill:999px;
    --e1:0 1px 2px rgba(23,23,26,.05), 0 0 0 1px var(--linha);
    --e2:0 4px 14px rgba(23,23,26,.07), 0 0 0 1px var(--linha);
}
*,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
button,input,select{ font-family:inherit; border:none; background:none; color:inherit; }
body{ font-family:'Inter',system-ui,sans-serif; background:var(--mesa); color:var(--tinta);
      min-height:100vh; -webkit-font-smoothing:antialiased; }
/* Nada mais largo que a tela: o que estoura empurra a página inteira
   e descola o cabeçalho fixo do conteúdo. */
.wrap, .cartao, .tb, .bh, .serie{ max-width:100%; }
.cartao{ overflow:hidden; }
.num{ font-family:'IBM Plex Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums;
      letter-spacing:-.2px; }
:focus-visible{ outline:2px solid var(--acao); outline-offset:2px; border-radius:5px; }
@media (prefers-reduced-motion:reduce){ *{ animation:none!important; transition:none!important; } }
::-webkit-scrollbar{ width:8px; height:8px; } ::-webkit-scrollbar-track{ background:transparent; }
::-webkit-scrollbar-thumb{ background:var(--linha-2); border-radius:99px; }

.top-bar{ background:var(--papel); height:56px; padding:0 22px; display:flex;
    justify-content:space-between; align-items:center; border-bottom:1px solid var(--linha);
    position:sticky; top:0; z-index:20; }
.top-bar-logo{ font-size:17px; font-weight:700; letter-spacing:-.4px; cursor:pointer; }
.top-bar-logo span{ color:var(--acao); }

/* min-height, não height: com altura fixa e flex-wrap, o que quebra sai
   da caixa e cai sobre o conteúdo. */
.cmd{ display:flex; align-items:center; gap:11px; padding:0 22px; min-height:56px;
    row-gap:8px; background:var(--papel); border-bottom:1px solid var(--linha);
    flex-wrap:wrap; position:sticky; top:56px; z-index:15; }
.cmd-tit{ font-size:16px; font-weight:650; letter-spacing:-.35px; white-space:nowrap; }
.cmd-sep{ width:1px; height:22px; background:var(--linha); }
.cmd-dir{ margin-left:auto; display:flex; align-items:center; gap:9px; flex-wrap:wrap; }

.segm{ display:flex; background:var(--papel-2); border-radius:var(--r-ctrl); padding:3px; gap:2px; }
.segm-btn{ font-size:12.5px; font-weight:500; color:var(--tinta-2); cursor:pointer;
    padding:6px 14px; border-radius:6px; white-space:nowrap; transition:.15s;
    display:flex; align-items:center; gap:6px; }
.segm-btn:hover{ color:var(--tinta); }
.segm-btn.on{ background:var(--papel); color:var(--tinta); font-weight:600;
    box-shadow:0 1px 2px rgba(0,0,0,.07); }
.segm-btn .material-symbols-rounded{ font-size:16px; }

.btn{ font-size:12.5px; font-weight:600; cursor:pointer; display:inline-flex; align-items:center;
    gap:6px; padding:8px 13px; border-radius:var(--r-ctrl); white-space:nowrap; transition:.14s; }
.btn .material-symbols-rounded{ font-size:17px; }
.btn-fant{ background:var(--papel-2); color:var(--tinta-2); }
.btn-fant:hover{ background:var(--linha); color:var(--tinta); }
.btn-fant.on{ background:var(--acao-fraco); color:var(--acao); }
.btn-acao{ background:var(--acao); color:#fff; }
.btn-acao:hover{ background:#5a4bd4; }
.chip-n{ font-size:10.5px; font-weight:700; background:var(--acao); color:#fff;
    min-width:16px; height:16px; padding:0 5px; border-radius:99px;
    display:inline-flex; align-items:center; justify-content:center; }

.sel{ font-size:12.5px; font-weight:500; padding:7px 11px; background:var(--papel-2);
    border-radius:var(--r-ctrl); color:var(--tinta-2); cursor:pointer; outline:none;
    max-width:250px; }
.datas{ display:none; align-items:center; gap:7px; }
.datas.on{ display:flex; }
.datas input{ font-size:12.5px; padding:7px 9px; background:var(--papel-2);
    border:1px solid transparent; border-radius:var(--r-ctrl); color:var(--tinta);
    outline:none; cursor:pointer; }
.datas input:focus{ background:var(--papel); border-color:var(--acao);
    box-shadow:0 0 0 3px var(--acao-fraco); }
.datas-ate{ font-size:12px; color:var(--tinta-3); }
.sel:focus{ box-shadow:0 0 0 3px var(--acao-fraco); }

/* gaveta de filtros */
.filtros{ display:none; gap:11px; align-items:flex-end; flex-wrap:wrap;
    padding:13px 22px; background:var(--papel); border-bottom:1px solid var(--linha); }
.filtros.on{ display:flex; }
.fg{ display:flex; flex-direction:column; gap:6px; min-width:132px; }
.fg label{ font-size:10.5px; font-weight:600; text-transform:uppercase;
    letter-spacing:.5px; color:var(--tinta-3); }
.fg select,.fg input{ font-size:12.5px; padding:8px 10px; background:var(--papel-2);
    border:1px solid transparent; border-radius:var(--r-ctrl); color:var(--tinta); outline:none; }
.fg select:focus,.fg input:focus{ background:var(--papel); border-color:var(--acao);
    box-shadow:0 0 0 3px var(--acao-fraco); }

.wrap{ max-width:1280px; margin:0 auto; padding:18px 22px 80px; }
.otica{ display:none; }
.otica.on{ display:block; }

.sec{ margin-bottom:22px; }
.sec-cab{ display:flex; align-items:center; gap:10px; margin-bottom:11px; }
.sec-tit{ font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.6px;
    color:var(--tinta-3); white-space:nowrap; }
.sec-linha{ flex:1; height:1px; background:var(--linha); }
.sec-nota{ font-size:11.5px; color:var(--tinta-3); font-weight:500; }

/* margin-bottom aqui, e nao no `.sec` seguinte: o bloco de KPIs vive
   fora de `.sec`, entao nada o separava do rotulo logo abaixo. */
.kpis{ display:grid; grid-template-columns:repeat(auto-fit,minmax(158px,1fr));
    gap:11px; margin-bottom:22px; }
.kpi{ background:var(--papel); border-radius:var(--r-card); box-shadow:var(--e1); padding:15px 17px; }
.kpi-r{ font-size:10.5px; font-weight:600; text-transform:uppercase; letter-spacing:.5px;
    color:var(--tinta-3); margin-bottom:7px; }
.kpi-v{ font-size:24px; font-weight:700; letter-spacing:-.9px; line-height:1; }
.kpi-v.money{ color:var(--ok); }
.kpi-p{ font-size:11.5px; color:var(--tinta-3); font-weight:500; margin-top:6px; line-height:1.4; }

.cartao{ background:var(--papel); border-radius:var(--r-card); box-shadow:var(--e1);
    padding:17px 19px; }
.cartao-t{ font-size:13px; font-weight:650; letter-spacing:-.15px; margin-bottom:3px; }
.cartao-d{ font-size:11.5px; color:var(--tinta-3); line-height:1.5; margin-bottom:15px; }
.duas{ display:grid; grid-template-columns:1fr 1fr; gap:11px; }
.tres{ display:grid; grid-template-columns:repeat(3,1fr); gap:11px; }
@media(max-width:940px){ .duas,.tres{ grid-template-columns:1fr; } }

/* ===== FUNIL EM CASCATA ===== */
.fun{ display:flex; flex-direction:column; gap:3px; }
.fun-l{ display:grid; grid-template-columns:132px 1fr 92px; gap:12px; align-items:center; }
.fun-r{ font-size:12.5px; font-weight:550; color:var(--tinta-2); }
.fun-b{ height:34px; background:var(--papel-2); border-radius:7px; position:relative;
    overflow:hidden; }
.fun-f{ height:100%; background:linear-gradient(90deg,var(--acao),#8B7BF0);
    border-radius:7px; display:flex; align-items:center; padding:0 11px;
    min-width:44px; transition:width .3s; }
.fun-n{ font-size:12.5px; font-weight:700; color:#fff; font-family:'IBM Plex Mono',monospace; }
.fun-c{ font-size:12px; font-weight:600; text-align:right; }
.fun-c.boa{ color:var(--ok); } .fun-c.media{ color:var(--atencao); }
.fun-c.ruim{ color:var(--critico); } .fun-c.neutra{ color:var(--tinta-3); }
.fun-c small{ display:block; font-size:10px; font-weight:500; color:var(--tinta-3); }
@media(max-width:640px){ .fun-l{ grid-template-columns:96px 1fr 66px; gap:8px; } }

/* ===== BARRAS HORIZONTAIS ===== */
.bh{ display:flex; flex-direction:column; gap:9px; }
.bh-l{ display:grid; grid-template-columns:1fr 76px; gap:11px; align-items:center; }
/* display:block obrigatorio. Sao <span>, e span inline ignora height e
   margin vertical -- a barra existia no HTML e nao aparecia na tela. */
.bh-c{ display:block; min-width:0; }
.bh-t{ display:block; font-size:12.5px; font-weight:500; color:var(--tinta-2);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-bottom:5px; }
.bh-t b{ font-weight:650; color:var(--tinta); }
.bh-b{ display:block; height:7px; background:var(--papel-2); border-radius:99px; overflow:hidden; }
.bh-f{ display:block; height:100%; border-radius:99px; background:var(--acao); transition:width .3s; }
.bh-v{ font-size:12.5px; font-weight:650; text-align:right; }
.bh-v{ display:block; }
.bh-v small{ display:block; font-size:10.5px; font-weight:500; color:var(--tinta-3); }

/* ===== SÉRIE TEMPORAL ===== */
.serie{ display:flex; align-items:flex-end; justify-content:flex-start; gap:4px;
    height:168px; padding-top:22px; }
/* max-width impede que um unico mes vire um bloco de 1200px, que nao
   comunica nada alem de "existe um mes". */
.sb{ flex:1 1 0; min-width:5px; max-width:76px; display:flex; flex-direction:column;
    justify-content:flex-end; align-items:center; gap:5px; position:relative; cursor:default; }
.sb-b{ width:100%; background:var(--acao); border-radius:4px 4px 0 0; min-height:2px;
    transition:.2s; }
.sb:hover .sb-b{ background:#5a4bd4; }
.sb-x{ font-size:9.5px; color:var(--tinta-3); font-family:'IBM Plex Mono',monospace;
    white-space:nowrap; }
/* Valor sobre a barra. Num toque não existe passar o mouse: sem o
   rótulo, o gráfico vira desenho e o número fica inacessível. */
.sb-n{ font-size:10.5px; font-weight:650; color:var(--tinta-2); white-space:nowrap;
    font-family:'IBM Plex Mono',monospace; margin-bottom:3px; }
.sb-dica{ position:absolute; bottom:100%; left:50%; transform:translateX(-50%);
    background:var(--tinta); color:#fff; font-size:11px; padding:5px 9px; border-radius:7px;
    white-space:nowrap; opacity:0; pointer-events:none; transition:.14s; margin-bottom:5px; z-index:5; }
.sb:hover .sb-dica{ opacity:1; }

/* ===== EXPLICADOR DAS DUAS LEITURAS =====
   A diferença entre contar por data do evento e contar por data de
   entrada do lead é abstrata em palavras e óbvia num exemplo. Então o
   exemplo fica na tela, com a leitura em uso destacada -- em vez de um
   parágrafo que ninguém lê duas vezes. */
.exp{ background:var(--papel-2); border-radius:var(--r-ctrl); padding:14px 16px;
    margin-top:15px; }
.exp-caso{ font-size:12.5px; color:var(--tinta-2); line-height:1.55; margin-bottom:11px; }
.exp-caso b{ font-weight:650; color:var(--tinta); }
.exp-l{ display:flex; gap:11px; align-items:flex-start; padding:9px 11px;
    border-radius:8px; font-size:12.5px; line-height:1.5; color:var(--tinta-3); }
.exp-l + .exp-l{ margin-top:4px; }
.exp-l.on{ background:var(--papel); color:var(--tinta-2);
    box-shadow:0 0 0 1px var(--acao); }
.exp-l .material-symbols-rounded{ font-size:17px; flex-shrink:0; margin-top:1px;
    color:var(--linha-2); }
.exp-l.on .material-symbols-rounded{ color:var(--acao); }
.exp-n{ font-weight:650; color:var(--tinta-3); }
.exp-l.on .exp-n{ color:var(--acao); }
.exp-l b{ font-weight:650; color:var(--tinta); }
.exp-alerta{ margin-top:11px; font-size:12px; line-height:1.55; color:#7A4A0C;
    background:var(--at-fundo); border-radius:8px; padding:10px 12px; }
.exp-alerta b{ font-weight:650; }

/* ===== TABELA ===== */
.tb{ border:1px solid var(--linha); border-radius:var(--r-ctrl); overflow:hidden; }
.tb-h,.tb-l{ display:grid; grid-template-columns:1.6fr .7fr 1fr 1fr; gap:11px;
    padding:9px 13px; align-items:center; font-size:12.5px; }
.tb-h{ background:var(--papel-2); border-bottom:1px solid var(--linha); font-size:10.5px;
    font-weight:600; text-transform:uppercase; letter-spacing:.4px; color:var(--tinta-3); }
.tb-l{ border-bottom:1px solid var(--papel-2); }
.tb-l:last-child{ border:none; }
.tb-l span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
/* O alinhamento vale para cabecalho E linha. Antes so `.tb-l .d` tinha
   a regra: os rotulos ficavam a esquerda da celula e os numeros a
   direita, cada um numa borda -- as colunas nao batiam. */
.tb-h .d, .tb-l .d{ text-align:right; }
.tb-l .d{ font-family:'IBM Plex Mono',monospace; font-weight:600; }
.tb-nome{ font-weight:550; }

.vazio{ text-align:center; padding:38px 20px; color:var(--tinta-3); }
.vazio .material-symbols-rounded{ font-size:32px; opacity:.3; display:block; margin-bottom:9px; }
.vazio p{ font-size:12.5px; line-height:1.6; max-width:340px; margin:0 auto; }

.esq{ height:96px; background:var(--papel); border-radius:var(--r-card); box-shadow:var(--e1);
    position:relative; overflow:hidden; }
.esq::after{ content:''; position:absolute; inset:0;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);
    animation:br 1.4s infinite; }
@keyframes br{ from{transform:translateX(-100%);} to{transform:translateX(100%);} }

.faixa{ border-radius:var(--r-card); padding:13px 16px; display:flex; gap:11px;
    align-items:flex-start; margin-bottom:14px; font-size:12.5px; line-height:1.55; }
.faixa .material-symbols-rounded{ font-size:18px; flex-shrink:0; margin-top:1px; }
.faixa.info{ background:var(--acao-fraco); color:#3C3489; }
.faixa.alerta{ background:var(--at-fundo); color:#7A4A0C; }
.faixa b{ font-weight:650; }

/* ============================================================
   TOQUE — mesma régua do painel operacional: tabela vira cartão,
   KPI vira dois por linha, e a gaveta de filtros acompanha o clique.
   ============================================================ */
@media (max-width:900px){
    .top-bar{ padding:0 16px 0 60px; height:52px; }
    .cmd{ padding:9px 14px; top:52px; gap:8px; }
    .cmd-tit,.cmd-sep{ display:none; }
    .segm{ width:100%; }
    .segm-btn{ flex:1; justify-content:center; padding:8px 6px; font-size:12px; }
    .segm-btn .material-symbols-rounded{ font-size:15px; }
    .cmd-dir{ width:100%; margin-left:0; gap:7px; }
    .cmd-dir .sel{ flex:1 1 calc(50% - 4px); max-width:none; min-width:0;
        font-size:12px; padding:8px 9px; }
    .cmd-dir .btn{ flex:1 1 100%; justify-content:center; }
    .datas{ flex:1 1 100%; }
    .datas input{ flex:1; min-width:0; }

    .filtros{ padding:12px 14px; gap:8px; }
    .fg{ flex:1 1 calc(50% - 4px); min-width:0; }
    .fg select{ width:100%; font-size:12.5px; }

    .wrap{ padding:12px 14px 64px; }

    .kpis{ grid-template-columns:1fr 1fr; gap:8px; margin-bottom:16px; }
    .kpi{ padding:12px 13px; }
    .kpi-r{ font-size:9.5px; margin-bottom:5px; }
    .kpi-v{ font-size:19px; letter-spacing:-.6px; }
    .kpi-p{ font-size:10.5px; margin-top:4px; }

    .cartao{ padding:14px 15px; }
    .cartao-t{ font-size:12.5px; }
    .cartao-d{ font-size:11px; margin-bottom:13px; }
    .sec{ margin-bottom:16px; }
    .sec-cab{ margin-bottom:9px; flex-wrap:wrap; row-gap:3px; }
    .sec-nota{ font-size:10.5px; flex-basis:100%; }
    .sec-linha{ min-width:14px; }
    .duas,.tres{ grid-template-columns:1fr; gap:8px; }

    /* funil */
    .fun-l{ grid-template-columns:78px 1fr 58px; gap:7px; }
    .fun-r{ font-size:11px; }
    .fun-b{ height:30px; }
    .fun-n{ font-size:11.5px; }
    .fun-c{ font-size:11.5px; }
    .fun-c small{ display:none; }

    .bh{ gap:11px; }
    .bh-t{ font-size:12px; }
    .bh-v{ font-size:12px; }

    .serie{ height:158px; gap:3px; }
    .sb{ max-width:none; }
    .sb-n{ font-size:9px; }
    .sb-x{ font-size:8.5px; }

    /* TABELAS VIRAM CARTÕES */
    .tb{ border:none; border-radius:0; }
    .tb-h{ display:none; }
    .tb-l{ display:block !important; background:var(--papel-2);
        border-radius:var(--r-ctrl); border:none; padding:12px 13px; margin-bottom:7px; }
    .tb-l:last-child{ margin-bottom:0; }
    .tb-l > span{ white-space:normal; }
    .tb-nome{ display:block; font-size:13px; font-weight:650; margin-bottom:9px; }
    .tb-l .d{ display:inline-flex; flex-direction:column; align-items:flex-start;
        text-align:left; margin-right:16px; margin-top:2px; font-size:14px; }
    .tb-l .d::before{ content:attr(data-r); display:block; font-family:'Inter',sans-serif;
        font-size:9.5px; font-weight:600; text-transform:uppercase; letter-spacing:.5px;
        color:var(--tinta-3); margin-bottom:2px; }

    .faixa{ padding:11px 12px; font-size:11.5px; gap:9px; }
    .faixa .material-symbols-rounded{ font-size:16px; }
    .vazio{ padding:26px 14px; }
}
@media (max-width:400px){
    .kpi-v{ font-size:17px; }
    .sb-x{ display:none; }
    .fun-l{ grid-template-columns:66px 1fr 50px; }
}
</style>
</head>
<body>
<div class="top-bar">
    <div class="top-bar-logo" onclick="window.location.href='/'">core<span>.cx</span></div>
    {% include '_usermenu.html' %}
</div>
{% include '_sidebar.html' %}

<div class="cmd">
    <span class="cmd-tit">Comercial</span>
    <div class="cmd-sep"></div>
    <div class="segm" role="tablist">
        <button class="segm-btn on" id="ot-trabalho" role="tab" aria-selected="true"
                onclick="Painel.otica('trabalho')">
            <span class="material-symbols-rounded">filter_alt</span>Trabalho</button>
        <button class="segm-btn" id="ot-resultado" role="tab" aria-selected="false"
                onclick="Painel.otica('resultado')">
            <span class="material-symbols-rounded">payments</span>Resultado</button>
    </div>
    <div class="cmd-dir">
        <select class="sel" id="periodo" onchange="Painel.periodo(this.value)">
            <option value="semana">Esta semana</option>
            <option value="mes">Este mês</option>
            <option value="30">Últimos 30 dias</option>
            <option value="90" selected>Últimos 90 dias</option>
            <option value="180">Últimos 6 meses</option>
            <option value="365">Últimos 12 meses</option>
            <option value="ano">Este ano</option>
            <option value="custom">Escolher datas…</option>
        </select>
        <span class="datas" id="datas">
            <input type="date" id="dDe" onchange="Painel.datas()" aria-label="Data inicial">
            <span class="datas-ate">até</span>
            <input type="date" id="dAte" onchange="Painel.datas()" aria-label="Data final">
        </span>
        <select class="sel" id="visao" onchange="Painel.visao(this.value)"
                title="Como as etapas do funil são contadas">
            <option value="periodo" selected>Tudo que andou no período</option>
            <option value="entrada">Só os leads que entraram</option>
        </select>
        <button class="btn btn-fant" id="btnFiltros" onclick="Painel.toggleFiltros()">
            <span class="material-symbols-rounded">tune</span>Filtros<span
                class="chip-n" id="chipF" style="display:none">0</span></button>
    </div>
</div>

<div class="filtros" id="gaveta">
    <div class="fg"><label for="fProduto">Produto</label>
        <select id="fProduto" onchange="Painel.filtrar()"><option value="">Todos</option></select></div>
    <div class="fg"><label for="fOrigem">Origem</label>
        <select id="fOrigem" onchange="Painel.filtrar()"><option value="">Todas</option></select></div>
    <div class="fg"><label for="fResp">Responsável</label>
        <select id="fResp" onchange="Painel.filtrar()"><option value="">Todos</option></select></div>
    <div class="fg"><label for="fSeg">Segmento</label>
        <select id="fSeg" onchange="Painel.filtrar()"><option value="">Todos</option></select></div>
    <div class="fg"><label for="fUF">Estado</label>
        <select id="fUF" onchange="Painel.filtrar()"><option value="">Todos</option></select></div>
    <div class="fg" style="min-width:0"><label>&nbsp;</label>
        <button class="btn btn-fant" onclick="Painel.limpar()">Limpar</button></div>
</div>

<div class="wrap">
    <div class="otica on" id="abaTrabalho"></div>
    <div class="otica" id="abaResultado"></div>
</div>

<script>
"use strict";
/* ===========================================================================
   PAINEL COMERCIAL · duas óticas

   TRABALHO   o funil andou? onde vaza? quanto demora?
   RESULTADO  quanto entrou, de onde e de quem?

   São perguntas de naturezas diferentes -- uma corrige processo, a outra
   orienta investimento -- e por isso ocupam telas separadas em vez de
   disputarem os mesmos cartões.
   =========================================================================== */
const Painel = (function(){

  const st = { dados:null, otica:'trabalho', periodo:'90', vis:'periodo',
               de:'', ate:'', filtros:{}, carregando:false };

  const esc = v => String(v ?? '').replace(/[&<>"']/g,
    c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  const money = v => v == null ? '—'
    : 'R$ ' + Number(v).toLocaleString('pt-BR', {minimumFractionDigits:0, maximumFractionDigits:0});
  const moneyCurto = v => {
    if(v == null) return '—';
    const n = Number(v);
    if(n >= 1e6) return 'R$ ' + (n/1e6).toFixed(1).replace('.',',') + 'M';
    if(n >= 1e3) return 'R$ ' + Math.round(n/1e3) + 'k';
    return 'R$ ' + Math.round(n);
  };
  const pct = v => v == null ? '—' : Number(v).toLocaleString('pt-BR',
    {minimumFractionDigits:0, maximumFractionDigits:1}) + '%';
  const dias = v => v == null ? '—' : Number(v).toLocaleString('pt-BR',
    {maximumFractionDigits:1}) + (v === 1 ? ' dia' : ' dias');

  /* ---------- carga ---------- */
  const iso = d => new Date(d.getTime() - d.getTimezoneOffset()*60000)
                     .toISOString().slice(0,10);

  function params(){
    const p = new URLSearchParams();
    const h = new Date();
    if(st.periodo === 'semana'){
      // Semana começa na segunda: sábado e domingo pertencem à semana
      // que terminou, não à que vai começar.
      const dow = (h.getDay() + 6) % 7;
      const seg = new Date(h); seg.setDate(h.getDate() - dow);
      p.set('de', iso(seg)); p.set('ate', iso(h));
    }else if(st.periodo === 'mes'){
      p.set('de', iso(new Date(h.getFullYear(), h.getMonth(), 1)));
      p.set('ate', iso(h));
    }else if(st.periodo === 'ano'){
      p.set('de', h.getFullYear() + '-01-01'); p.set('ate', iso(h));
    }else if(st.periodo === 'custom'){
      p.set('de', st.de || iso(h)); p.set('ate', st.ate || iso(h));
    }else{
      p.set('dias', st.periodo);
    }
    p.set('visao', st.vis);
    Object.entries(st.filtros).forEach(([k,v]) => { if(v) p.set(k, v); });
    return p.toString();
  }

  async function carregar(){
    if(st.carregando) return;
    st.carregando = true;
    esqueleto();
    try{
      const r = await fetch('/api/comercial/painel?' + params());
      if(r.status === 401){ location.href = '/login?proximo=/dashboard/comercial'; return; }
      const d = await r.json();
      if(!r.ok) throw new Error(d.mensagem || 'Falha ao carregar.');
      st.dados = d;
      preencherOpcoes(d.opcoes);
      pintar();
    }catch(e){
      document.getElementById('abaTrabalho').innerHTML = `
        <div class="cartao"><div class="vazio">
          <span class="material-symbols-rounded">cloud_off</span>
          <p>${esc(e.message)}</p></div></div>`;
    }finally{
      st.carregando = false;
    }
  }

  function esqueleto(){
    const h = '<div class="kpis">' + '<div class="esq"></div>'.repeat(4) + '</div>';
    document.getElementById('abaTrabalho').innerHTML = h;
    document.getElementById('abaResultado').innerHTML = h;
  }

  // Os seletores só oferecem o que existe de fato nos leads: lista fixa
  // envelhece e passa a filtrar por coisa que ninguém usa.
  function preencherOpcoes(op){
    const par = [['fProduto', op.produtos, 'Todos'], ['fOrigem', op.origens, 'Todas'],
                 ['fSeg', op.segmentos, 'Todos'],
                 ['fResp', op.responsaveis, 'Todos'], ['fUF', op.estados, 'Todos']];
    par.forEach(([id, lista, zero]) => {
      const el = document.getElementById(id);
      const atual = el.value;
      el.innerHTML = `<option value="">${zero}</option>` +
        (lista || []).map(v => `<option value="${esc(v)}">${esc(v)}</option>`).join('');
      el.value = atual;
    });
  }

  /* ---------- ótica: trabalho ---------- */
  function pintarTrabalho(){
    const t = st.dados.trabalho, vv = st.dados.ver_valor;
    const topo = t.funil[0] ? t.funil[0].qtd : 0;
    const fim = t.funil[t.funil.length - 1];
    const convGeral = topo ? (fim.qtd / topo * 100) : null;

    const tomConv = c => c == null ? 'neutra' : c >= 45 ? 'boa' : c >= 22 ? 'media' : 'ruim';

    document.getElementById('abaTrabalho').innerHTML = `
      <div class="kpis">
        ${kpi('Leads gerados', topo, 'entraram no funil no período')}
        ${kpi('Fechamentos', fim.qtd, 'contratos assinados')}
        ${kpi('Conversão ponta a ponta', pct(convGeral), 'de lead gerado a contrato')}
        ${kpi('Ciclo até fechar', dias(t.ciclo.ate_fechamento), 'mediana, do lead ao contrato')}
      </div>

      <div class="sec">
        <div class="sec-cab"><span class="sec-tit">Do lead ao contrato</span>
          <span class="sec-linha"></span>
          <span class="sec-nota">quanto sobrevive de uma etapa para a seguinte</span></div>
        <div class="cartao">
          ${topo ? `<div class="fun">
            ${t.funil.map(e => {
              const larg = topo ? Math.max(4, e.qtd / topo * 100) : 0;
              return `<div class="fun-l">
                <span class="fun-r">${esc(e.rotulo)}</span>
                <span class="fun-b"><span class="fun-f" style="width:${larg}%">
                  <span class="fun-n">${e.qtd}</span></span></span>
                <span class="fun-c ${tomConv(e.conv)}">${e.conv == null ? '—' : pct(e.conv)}
                  ${vv && e.valor ? `<small>${moneyCurto(e.valor)}</small>` : ''}</span>
              </div>`;
            }).join('')}
          </div>
          ${notaVisao()}` : semDados('Nenhum lead entrou no funil neste período.')}
        </div>
      </div>

      <div class="sec">
        <div class="sec-cab"><span class="sec-tit">Quanto tempo leva</span>
          <span class="sec-linha"></span>
          <span class="sec-nota">mediana, em dias desde a criação do lead</span></div>
        <div class="tres">
          ${kpiCard('Até agendar', dias(t.ciclo.ate_agendamento),
                    'do lead entrar até a reunião marcada')}
          ${kpiCard('Até a proposta', dias(t.ciclo.ate_proposta),
                    'do lead entrar até apresentar valor')}
          ${kpiCard('Até fechar', dias(t.ciclo.ate_fechamento),
                    'do lead entrar até o contrato')}
        </div>

      </div>

      <div class="sec">
        <div class="sec-cab"><span class="sec-tit">Por produto</span><span class="sec-linha"></span></div>
        <div class="cartao">${tabelaTrabalho(t.por_produto, 'Produto', vv)}</div>
      </div>

      <div class="sec">
        <div class="sec-cab"><span class="sec-tit">Por origem</span>
          <span class="sec-linha"></span>
          <span class="sec-nota">de onde vêm os leads e quais convertem</span></div>
        <div class="cartao">${tabelaTrabalho(t.por_origem, 'Origem', vv)}</div>
      </div>

      <div class="duas">
        <div class="cartao">
          <div class="cartao-t">Por segmento</div>
          <div class="cartao-d">Em que setor os leads chegam e convertem.</div>
          ${tabelaTrabalho(t.por_segmento || [], 'Segmento', vv)}
        </div>
        <div class="cartao">
          <div class="cartao-t">Por região</div>
          <div class="cartao-d">Estado informado ao passar o lead para o closer.</div>
          ${tabelaTrabalho(t.por_estado || [], 'Estado', vv)}
        </div>
      </div>

      <div class="duas">
        <div class="cartao">
          <div class="cartao-t">Saíram do funil</div>
          <div class="cartao-d">Percentual sobre os ${t.base || 0} leads do período —
          um número absoluto sozinho não diz se é muito ou pouco.</div>
          <div class="duas" style="gap:11px">
            ${kpiCard('Perdidos', t.perdidos,
                      t.pct_perdidos == null ? 'saíram sem fechar'
                        : pct(t.pct_perdidos) + ' dos leads do período')}
            ${kpiCard('Em nutrição', t.nutricao,
                      t.pct_nutricao == null ? 'guardados para depois'
                        : pct(t.pct_nutricao) + ' dos leads do período')}
          </div>
        </div>
        <div class="cartao">
          <div class="cartao-t">Por que perdemos</div>
          <div class="cartao-d">Objeção registrada ao mover o lead para Perdido.</div>
          ${t.objecoes.length ? `<div class="bh">
            ${barras(t.objecoes.slice(0,6), t.objecoes[0].qtd, x => x.qtd, x => x.qtd)}
          </div>` : semDados('Nenhuma objeção registrada no período.')}
        </div>
      </div>`;
  }

  /* A pergunta que todo CRM esconde, respondida com um caso concreto:
     um lead entra num mês e fecha no outro. Ele conta em qual?
     Explicar isso em palavras abstratas não funciona -- o exemplo com
     números resolve em cinco segundos. */
  /* O explicador longo saiu: quem configurou a visão uma vez não
     precisa reler o exemplo toda vez que abre a tela. Fica só o
     alerta, e só quando ele resolve algo -- uma etapa acima de 100%
     é um número que confunde, e aí a frase tem função. */
  function notaVisao(){
    const t = st.dados.trabalho;
    const cresceu = t.funil.some(e => e.conv != null && e.conv > 100);
    if(!cresceu || st.vis === 'entrada') return '';
    return `<div class="faixa alerta" style="margin:15px 0 0">
      <span class="material-symbols-rounded">warning</span>
      <span>Uma etapa passou de <b>100%</b>: houve propostas e fechamentos de
      leads que entraram antes deste período. Para medir conversão, troque para
      <b>Só os leads que entraram</b>.</span>
    </div>`;
  }

  function tabelaTrabalho(lista, rotulo, vv){
    if(!lista || !lista.length) return semDados('Sem dados no período.');
    return `<div class="tb">
      <div class="tb-h"><span>${rotulo}</span><span class="d">Leads</span>
        <span class="d">Fechados</span><span class="d">Conversão</span></div>
      ${lista.slice(0,10).map(x => `<div class="tb-l">
        <span class="tb-nome">${esc(x.chave)}</span>
        <span class="d" data-r="Leads">${x.leads}</span>
        <span class="d" data-r="Fechados">${x.ganhos}</span>
        <span class="d" data-r="Conversão" style="color:${
          x.conv >= 20 ? 'var(--ok)' : 'var(--tinta-2)'}">${pct(x.conv)}</span>
      </div>`).join('')}
    </div>`;
  }

  /* ---------- ótica: resultado ---------- */
  function pintarResultado(){
    const r = st.dados.resultado;
    if(!st.dados.ver_valor){
      document.getElementById('abaResultado').innerHTML = `
        <div class="cartao"><div class="vazio">
          <span class="material-symbols-rounded">lock</span>
          <p>Você não tem acesso aos valores. Fale com quem administra a plataforma.</p>
        </div></div>`;
      return;
    }

    const maxSerie = Math.max(1, ...r.serie.map(x => x.valor));
    const rotuloX = q => r.granularidade === 'dia'
      ? q.slice(8,10) + '/' + q.slice(5,7)
      : ({'01':'jan','02':'fev','03':'mar','04':'abr','05':'mai','06':'jun','07':'jul',
          '08':'ago','09':'set','10':'out','11':'nov','12':'dez'})[q.slice(5,7)] + '/' + q.slice(2,4);

    document.getElementById('abaResultado').innerHTML = `
      <div class="kpis">
        ${kpi('Valor fechado', money(r.total), 'contratos assinados no período', true)}
        ${kpi('Contratos', r.qtd, 'negócios ganhos')}
        ${kpi('Ticket médio', money(r.ticket_medio), 'valor por contrato')}
        ${kpi('Melhor origem', r.por_origem[0] ? r.por_origem[0].chave : '—',
              r.por_origem[0] ? moneyCurto(r.por_origem[0].valor) + ' fechados' : 'sem dados')}
      </div>

      <div class="sec">
        <div class="sec-cab">
          <span class="sec-tit">Evolução</span><span class="sec-linha"></span>
          <span class="sec-nota">${r.granularidade === 'dia' ? 'por dia' : 'por mês'}</span></div>
        <div class="cartao">
          ${r.serie.length ? `<div class="serie">
            ${r.serie.map(x => `<div class="sb">
              <span class="sb-dica">${rotuloX(x.quando)} · ${money(x.valor)} · ${
                x.qtd} contrato${x.qtd!==1?'s':''}</span>
              <span class="sb-n">${moneyCurto(x.valor)}</span>
              <span class="sb-b" style="height:${Math.max(2, x.valor/maxSerie*104)}px"></span>
              <span class="sb-x">${rotuloX(x.quando)}</span>
            </div>`).join('')}
          </div>` : semDados('Nenhum contrato fechado neste período.')}
        </div>
      </div>

      <div class="duas">
        <div class="cartao">
          <div class="cartao-t">Ticket médio por produto</div>
          <div class="cartao-d">Quanto vale, em média, cada contrato de cada produto.</div>
          ${r.por_produto.length ? `<div class="tb">
            <div class="tb-h"><span>Produto</span><span class="d">Qtd</span>
              <span class="d">Total</span><span class="d">Ticket</span></div>
            ${r.por_produto.map(x => `<div class="tb-l">
              <span class="tb-nome">${esc(x.chave)}</span>
              <span class="d" data-r="Contratos">${x.qtd}</span>
              <span class="d" data-r="Total">${moneyCurto(x.valor)}</span>
              <span class="d" data-r="Ticket" style="color:var(--ok)">${moneyCurto(x.ticket)}</span>
            </div>`).join('')}
          </div>` : semDados('Sem contratos no período.')}
        </div>

        <div class="cartao">
          <div class="cartao-t">Receita por origem</div>
          <div class="cartao-d">De qual canal veio o dinheiro que entrou.</div>
          ${r.por_origem.length ? `<div class="bh">
            ${barras(r.por_origem.slice(0,7), r.por_origem[0].valor,
                     x => x.valor, x => moneyCurto(x.valor), x => x.fatia + '% do total')}
          </div>` : semDados('Sem contratos no período.')}
        </div>
      </div>

      <div class="duas" style="margin-top:11px">
        <div class="cartao">
          <div class="cartao-t">Por região</div>
          <div class="cartao-d">Estado informado no lead ao passar para o closer.</div>
          ${r.por_estado.length ? `<div class="bh">
            ${barras(r.por_estado.slice(0,8), r.por_estado[0].valor,
                     x => x.valor, x => moneyCurto(x.valor), x => x.qtd + ' contrato' + (x.qtd!==1?'s':''))}
          </div>` : semDados('Sem contratos no período.')}
        </div>

        <div class="cartao">
          <div class="cartao-t">Receita por segmento</div>
          <div class="cartao-d">Em que setor a empresa vende mais.</div>
          ${(r.por_segmento || []).length ? `<div class="bh">
            ${barras(r.por_segmento.slice(0,7), r.por_segmento[0].valor,
                     x => x.valor, x => moneyCurto(x.valor),
                     x => x.qtd + ' contrato' + (x.qtd!==1?'s':''))}
          </div>` : semDados('Sem contratos no período.')}
        </div>
      </div>

      <div class="duas" style="margin-top:11px">
        <div class="cartao">
          <div class="cartao-t">Por responsável</div>
          <div class="cartao-d">Quem fechou o quê no período.</div>
          ${r.por_responsavel.length ? `<div class="tb">
            <div class="tb-h"><span>Pessoa</span><span class="d">Qtd</span>
              <span class="d">Total</span><span class="d">Ticket</span></div>
            ${r.por_responsavel.map(x => `<div class="tb-l">
              <span class="tb-nome">${esc(x.chave)}</span>
              <span class="d" data-r="Contratos">${x.qtd}</span>
              <span class="d" data-r="Total">${moneyCurto(x.valor)}</span>
              <span class="d" data-r="Ticket">${moneyCurto(x.ticket)}</span>
            </div>`).join('')}
          </div>` : semDados('Sem contratos no período.')}
        </div>
      </div>`;
  }

  /* ---------- peças ---------- */
  function kpi(rot, valor, pe, dinheiro){
    return `<div class="kpi"><div class="kpi-r">${esc(rot)}</div>
      <div class="kpi-v num ${dinheiro?'money':''}">${esc(valor)}</div>
      <div class="kpi-p">${esc(pe)}</div></div>`;
  }
  function kpiCard(rot, valor, pe){
    return `<div class="cartao"><div class="kpi-r">${esc(rot)}</div>
      <div class="kpi-v num" style="margin-top:6px">${esc(valor)}</div>
      <div class="kpi-p">${esc(pe)}</div></div>`;
  }
  function barras(lista, maximo, fVal, fRot, fSub){
    return lista.map(x => {
      const v = fVal(x);
      return `<div class="bh-l">
        <span class="bh-c"><span class="bh-t">${esc(x.chave)}</span>
          <span class="bh-b"><span class="bh-f" style="width:${maximo ? Math.max(2, v/maximo*100) : 0}%"></span></span></span>
        <span class="bh-v">${esc(fRot(x))}${fSub ? `<small>${esc(fSub(x))}</small>` : ''}</span>
      </div>`;
    }).join('');
  }
  function semDados(txt){
    return `<div class="vazio"><span class="material-symbols-rounded">bar_chart</span>
      <p>${esc(txt)}</p></div>`;
  }

  function pintar(){ pintarTrabalho(); pintarResultado(); }

  /* ---------- navegação ---------- */
  function otica(qual){
    st.otica = qual;
    ['trabalho','resultado'].forEach(o => {
      const b = document.getElementById('ot-' + o);
      const p = document.getElementById('aba' + o[0].toUpperCase() + o.slice(1));
      b.classList.toggle('on', o === qual);
      b.setAttribute('aria-selected', o === qual);
      p.classList.toggle('on', o === qual);
    });
  }
  function periodo(v){
    st.periodo = v;
    const cx = document.getElementById('datas');
    cx.classList.toggle('on', v === 'custom');
    if(v === 'custom'){
      // Nasce com o mês corrente: campo em branco não diz o que esperar.
      if(!st.de){
        const h = new Date();
        st.de = iso(new Date(h.getFullYear(), h.getMonth(), 1));
        st.ate = iso(h);
        document.getElementById('dDe').value = st.de;
        document.getElementById('dAte').value = st.ate;
      }
    }
    carregar();
  }
  function datas(){
    const a = document.getElementById('dDe').value;
    const b = document.getElementById('dAte').value;
    if(!a || !b) return;
    // Invertido é engano comum: corrige em vez de devolver vazio.
    st.de = a <= b ? a : b;
    st.ate = a <= b ? b : a;
    document.getElementById('dDe').value = st.de;
    document.getElementById('dAte').value = st.ate;
    st.periodo = 'custom';
    carregar();
  }
  function visao(v){ st.vis = v; carregar(); }
  /* No celular a gaveta nasce acima da dobra: abrir sem rolar fazia
     parecer que o clique não funcionou. */
  function toggleFiltros(){
    const g = document.getElementById('gaveta');
    const abriu = g.classList.toggle('on');
    if(abriu && window.innerWidth <= 900){
      requestAnimationFrame(() => {
        const y = g.getBoundingClientRect().bottom;
        if(y > window.innerHeight) g.scrollIntoView({behavior:'smooth', block:'end'});
      });
    }
  }
  function filtrar(){
    st.filtros = {
      produto: document.getElementById('fProduto').value,
      origem: document.getElementById('fOrigem').value,
      responsavel: document.getElementById('fResp').value,
      estado: document.getElementById('fUF').value,
      segmento: document.getElementById('fSeg').value,
    };
    const n = Object.values(st.filtros).filter(Boolean).length;
    const chip = document.getElementById('chipF');
    chip.style.display = n ? 'inline-flex' : 'none';
    chip.textContent = n;
    document.getElementById('btnFiltros').classList.toggle('on', n > 0);
    carregar();
  }
  function limpar(){
    ['fProduto','fOrigem','fSeg','fResp','fUF'].forEach(i => document.getElementById(i).value = '');
    filtrar();
  }

  document.addEventListener('DOMContentLoaded', carregar);
  return { otica, periodo, visao, datas, toggleFiltros, filtrar, limpar };
})();
</script>
</body>
</html>
