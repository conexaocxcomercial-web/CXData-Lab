<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel | core.cx</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='core-cx-favicon.png') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        :root{
            --mesa:#EFEFF3; --papel:#FFF; --papel-2:#F7F7F9;
            --linha:#E4E4EA; --linha-2:#D3D3DC;
            --tinta:#17171A; --tinta-2:#56565F; --tinta-3:#7C7C88;
            --acao:#6C5CE7; --acao-fraco:#F1EFFE; --lime:#BEF533;
            --ok:#0E9F6E; --ok-fraco:#E6F7F0;
            --atencao:#C2660B; --at-fundo:#FFF0D6; --at-borda:#E5BE7F;
            --critico:#D42F2F; --cr-fundo:#FBE3E3; --cr-borda:#E9A9A9;
            --sdr:#0EA5E9; --sdr-fraco:#E4F4FD; --closer:#6C5CE7; --nutri:#C2660B;
            --azul:#1A5FA0; --azul-fraco:#E9F2FB;
            --r-card:12px; --r-ctrl:9px; --r-pill:999px;
            --e1:0 1px 2px rgba(23,23,26,.05), 0 0 0 1px var(--linha);
            --e2:0 4px 14px rgba(23,23,26,.07), 0 0 0 1px var(--linha);
            --accent-lime:#BEF533; --accent-pink:#FF43C0;
        }
        *,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
        button,input,select{ font-family:inherit; border:none; background:none; color:inherit; }
        body{ font-family:'Inter',system-ui,sans-serif; background:var(--mesa); color:var(--tinta);
              min-height:100vh; -webkit-font-smoothing:antialiased; }
        .num{ font-family:'IBM Plex Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums; letter-spacing:-.2px; }
        :focus-visible{ outline:2px solid var(--acao); outline-offset:2px; border-radius:5px; }
        @media (prefers-reduced-motion:reduce){ *{ animation:none!important; transition:none!important; } }
        ::-webkit-scrollbar{ width:8px; height:8px; } ::-webkit-scrollbar-track{ background:transparent; }
        ::-webkit-scrollbar-thumb{ background:var(--linha-2); border-radius:99px; }

        .top-bar{ background:var(--papel); height:56px; padding:0 22px; display:flex;
            justify-content:space-between; align-items:center; border-bottom:1px solid var(--linha);
            position:sticky; top:0; z-index:20; }
        .top-bar-logo{ font-size:17px; font-weight:700; letter-spacing:-.4px; cursor:pointer; }
        .top-bar-logo span{ color:var(--acao); }

        .cabecalho{ background:var(--papel); border-bottom:1px solid var(--linha);
            position:sticky; top:56px; z-index:15; }
        .cb-topo{ max-width:1200px; margin:0 auto; padding:19px 22px 0; }
        .cb-tit{ font-size:22px; font-weight:700; letter-spacing:-.7px; line-height:1.1; }
        .cb-sub{ font-size:12.5px; color:var(--tinta-3); margin-top:4px; }
        .cb-abas{ max-width:1200px; margin:0 auto; padding:0 22px; display:flex; gap:2px; margin-top:15px; }
        .aba{ font-size:13px; font-weight:550; padding:10px 14px; color:var(--tinta-3); cursor:pointer;
            border-bottom:2px solid transparent; transition:.14s; }
        .aba:hover{ color:var(--tinta-2); }
        .aba.on{ color:var(--tinta); font-weight:650; border-bottom-color:var(--acao); }

        .wrap{ max-width:1200px; margin:0 auto; padding:18px 22px 80px; }
        .painel-aba{ display:none; }
        .painel-aba.on{ display:block; }
        .loading{ text-align:center; padding:64px; color:var(--tinta-3); font-size:13px; font-weight:500; }
        .empty{ text-align:center; padding:48px 24px; color:var(--tinta-3); background:var(--papel);
            border-radius:var(--r-card); box-shadow:var(--e1); }
        .empty .material-symbols-rounded{ font-size:36px; opacity:.3; display:block; margin-bottom:11px; }
        .empty h3{ font-size:14px; font-weight:650; color:var(--tinta-2); margin-bottom:5px; }
        .empty p{ font-size:12.5px; font-weight:500; line-height:1.6; max-width:340px; margin:0 auto; }

        /* ferramentas */
        .ferr{ display:flex; align-items:center; gap:9px; margin-bottom:16px; flex-wrap:wrap; }
        .seg{ display:flex; background:var(--papel); border-radius:var(--r-ctrl); padding:3px; gap:2px; box-shadow:var(--e1); }
        .seg button{ font-size:12px; font-weight:550; color:var(--tinta-2); padding:6px 12px;
            border-radius:6px; cursor:pointer; transition:.14s; }
        .seg button:hover{ color:var(--tinta); }
        .seg button.on{ background:var(--tinta); color:#fff; font-weight:600; }
        .filtro{ font-size:12px; font-weight:550; padding:8px 11px; background:var(--papel);
            border-radius:var(--r-ctrl); color:var(--tinta-2); box-shadow:var(--e1); cursor:pointer; outline:none; }
        .ferr-dir{ margin-left:auto; font-size:11.5px; color:var(--tinta-3); font-weight:500; }

        /* atenção */
        .at-bloco{ background:var(--papel); border-radius:var(--r-card); box-shadow:var(--e1);
            overflow:hidden; margin-bottom:16px; }
        .at-cab{ padding:12px 16px; border-bottom:1px solid var(--linha); display:flex; align-items:center; gap:9px; }
        .at-cab .material-symbols-rounded{ font-size:17px; color:var(--critico); }
        .at-t{ font-size:12.5px; font-weight:650; flex:1; }
        .at-n{ font-size:11px; font-weight:600; background:var(--cr-fundo); color:var(--critico);
            padding:3px 9px; border-radius:99px; }
        .al{ display:grid; grid-template-columns:1fr auto; gap:13px; padding:11px 16px;
            border-bottom:1px solid var(--papel-2); align-items:center; }
        .al:last-child{ border:none; }
        .al-t{ font-size:12.5px; font-weight:600; line-height:1.35; }
        .al-s{ font-size:11px; color:var(--tinta-3); margin-top:2px; }
        .al-v{ font-size:11.5px; font-weight:650; padding:4px 10px; border-radius:99px; white-space:nowrap; }
        .v-cr{ background:var(--cr-fundo); color:var(--critico); }
        .v-at{ background:var(--at-fundo); color:var(--atencao); }
        .v-ok{ background:var(--ok-fraco); color:var(--ok); }

        /* kpis */
        .kpis{ display:grid; grid-template-columns:repeat(auto-fit,minmax(152px,1fr)); gap:11px; margin-bottom:16px; }
        .kpi{ background:var(--papel); border-radius:var(--r-card); box-shadow:var(--e1); padding:14px 16px; }
        .kpi-r{ font-size:10.5px; font-weight:600; text-transform:uppercase; letter-spacing:.5px;
            color:var(--tinta-3); margin-bottom:8px; }
        .kpi-v{ font-size:23px; font-weight:700; letter-spacing:-.8px; line-height:1; }
        .kpi-p{ font-size:11px; color:var(--tinta-3); font-weight:500; margin-top:5px; }

        /* gráfico */
        .gr{ background:var(--papel); border-radius:var(--r-card); box-shadow:var(--e1);
            overflow:hidden; margin-bottom:14px; }
        .gr-cab{ padding:14px 17px 12px; border-bottom:1px solid var(--linha); display:flex;
            align-items:flex-start; gap:12px; flex-wrap:wrap; }
        .gr-t{ font-size:13.5px; font-weight:650; letter-spacing:-.2px; }
        .gr-s{ font-size:11.5px; color:var(--tinta-3); margin-top:3px; line-height:1.45; }
        .gr-corpo{ padding:16px 17px 17px; }
        .dupla{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
        .tripla{ display:grid; grid-template-columns:1.35fr 1fr; gap:14px; }
        @media(max-width:900px){ .dupla,.tripla{ grid-template-columns:1fr; } }

        /* barra horizontal */
        .bh{ display:flex; align-items:center; gap:12px; padding:7px 0; }
        .bh-rot{ width:130px; flex-shrink:0; font-size:12px; font-weight:550; color:var(--tinta);
            display:flex; align-items:center; gap:8px; min-width:0; }
        .bh-rot span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .bh-av{ width:22px; height:22px; min-width:22px; border-radius:50%; display:flex;
            align-items:center; justify-content:center; font-size:8.5px; font-weight:650; }
        .bh-t{ flex:1; height:21px; background:var(--papel-2); border-radius:5px; overflow:hidden;
            display:flex; min-width:56px; }
        .bh-t i{ display:block; height:100%; }
        .bh-v{ width:64px; text-align:right; font-size:12px; font-weight:650; font-family:'IBM Plex Mono',monospace; }
        @media(max-width:600px){ .bh-rot{ width:98px; } }
        .legenda{ display:flex; gap:14px; flex-wrap:wrap; margin-top:14px; padding-top:13px; border-top:1px solid var(--linha); }
        .lg{ display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--tinta-2); font-weight:500; }
        .lg i{ width:9px; height:9px; border-radius:2.5px; display:block; }
        .conclusao{ font-size:12.5px; color:var(--tinta-2); line-height:1.6; margin-top:13px;
            padding:11px 13px; background:var(--papel-2); border-radius:9px; }
        .conclusao b{ font-weight:650; color:var(--tinta); }

        /* cascata */
        .casc{ display:flex; flex-direction:column; }
        .et{ display:grid; grid-template-columns:124px 1fr 86px; gap:14px; align-items:center; padding:2px 0; }
        @media(max-width:760px){ .et{ grid-template-columns:100px 1fr 68px; gap:10px; } }
        .et-rot{ display:flex; align-items:center; gap:8px; min-width:0; }
        .et-pt{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }
        .et-nome{ font-size:12.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .et-tri{ height:36px; display:flex; align-items:center; }
        .et-b{ height:36px; border-radius:6px; display:flex; align-items:center; padding:0 12px;
            color:#fff; font-size:13px; font-weight:700; font-family:'IBM Plex Mono',monospace;
            letter-spacing:-.3px; min-width:42px; }
        .et-marca{ margin-left:11px; font-size:11px; color:var(--tinta-3); font-weight:500;
            white-space:nowrap; display:flex; align-items:center; gap:5px; }
        .et-marca .material-symbols-rounded{ font-size:13px; color:var(--linha-2); }
        .et-val{ text-align:right; font-size:12px; font-weight:600; color:var(--tinta-2);
            font-family:'IBM Plex Mono',monospace; }
        .conv{ display:grid; grid-template-columns:124px 1fr 86px; gap:14px; align-items:center; padding:1px 0; }
        @media(max-width:760px){ .conv{ grid-template-columns:100px 1fr 68px; gap:10px; } }
        .conv-tx{ display:flex; align-items:center; gap:8px; }
        .conv-l{ width:2px; height:15px; background:var(--linha-2); margin-left:16px; border-radius:2px; }
        .conv-p{ font-size:11.5px; font-weight:650; padding:2px 9px; border-radius:99px; font-family:'IBM Plex Mono',monospace; }
        .cv-bom{ background:var(--ok-fraco); color:var(--ok); }
        .cv-medio{ background:var(--at-fundo); color:var(--atencao); }
        .cv-ruim{ background:var(--cr-fundo); color:var(--critico); }
        .conv-rot{ font-size:11px; color:var(--tinta-3); font-weight:500; }
        .funil-div{ display:flex; align-items:center; gap:11px; margin:13px 0 9px; padding-top:13px;
            border-top:1px dashed var(--linha-2); }
        .funil-div.primeiro{ margin-top:0; padding-top:0; border-top:none; }
        .fd-selo{ font-size:10px; font-weight:600; letter-spacing:.6px; text-transform:uppercase;
            padding:4px 11px; border-radius:99px; }
        .fd-txt{ font-size:11.5px; color:var(--tinta-3); font-weight:500; }
        .resumo-linha{ display:flex; gap:1px; background:var(--linha); border-radius:10px;
            overflow:hidden; margin-top:16px; }
        .rl{ flex:1; background:var(--papel-2); padding:12px 14px; min-width:0; }
        .rl-r{ font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:.5px;
            color:var(--tinta-3); margin-bottom:6px; }
        .rl-v{ font-size:19px; font-weight:700; letter-spacing:-.5px; line-height:1; }
        .rl-p{ font-size:10.5px; color:var(--tinta-3); font-weight:500; margin-top:4px; }
        @media(max-width:700px){ .resumo-linha{ flex-wrap:wrap; } .rl{ min-width:calc(50% - 1px); } }

        /* matriz */
        .mz-l{ display:grid; gap:2px; align-items:center; margin-bottom:2px; }
        .mz-rot{ font-size:11.5px; font-weight:550; color:var(--tinta-2); padding-right:8px;
            overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .mz-c{ height:30px; border-radius:4px; display:flex; align-items:center; justify-content:center;
            font-size:11px; font-weight:600; font-family:'IBM Plex Mono',monospace; }
        .mz-cab{ font-size:9.5px; font-weight:600; text-transform:uppercase; letter-spacing:.4px;
            color:var(--tinta-3); text-align:center; padding-bottom:5px; line-height:1.2;
            overflow:hidden; text-overflow:ellipsis; }

        /* lista */
        .li{ display:grid; grid-template-columns:1fr auto auto; gap:12px; padding:10px 0;
            border-bottom:1px solid var(--papel-2); align-items:center; }
        .li:last-child{ border:none; }
        .li-t{ font-size:12.5px; font-weight:600; line-height:1.35; min-width:0; }
        .li-s{ font-size:11px; color:var(--tinta-3); margin-top:2px; display:flex; gap:7px; flex-wrap:wrap; align-items:center; }
        .li-v{ font-size:12px; font-weight:650; font-family:'IBM Plex Mono',monospace; white-space:nowrap; }
        .pilula{ font-size:10px; font-weight:600; padding:2px 8px; border-radius:99px; white-space:nowrap; }
        .p-neutro{ background:var(--papel-2); color:var(--tinta-3); }
        .p-ok{ background:var(--ok-fraco); color:var(--ok); }
        .p-at{ background:var(--at-fundo); color:var(--atencao); }
        .p-cr{ background:var(--cr-fundo); color:var(--critico); }
        .p-az{ background:var(--azul-fraco); color:var(--azul); }

        .toast-container{ position:fixed; bottom:26px; left:50%; transform:translateX(-50%); z-index:10001;
            display:flex; flex-direction:column; gap:9px; }
        .toast{ background:rgba(23,23,26,.95); color:#fff; padding:11px 20px; border-radius:var(--r-pill);
            font-size:12.5px; font-weight:500; box-shadow:0 10px 30px rgba(0,0,0,.2);
            display:flex; align-items:center; gap:9px; max-width:88vw; }

        @media (max-width:900px){
            .top-bar{ padding:0 16px 0 60px; }
            .cb-topo{ padding:16px 16px 0; }
            .cb-abas{ padding:0 16px; }
            .wrap{ padding:14px 16px 70px; }
            .ferr-dir{ width:100%; margin-left:0; }
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <div class="top-bar-logo" onclick="window.location.href='/'">core<span>.cx</span></div>
        {% include '_usermenu.html' %}
    </div>
    {% include '_sidebar.html' %}

    <div class="cabecalho">
        <div class="cb-topo">
            <h1 class="cb-tit">Painel</h1>
            <p class="cb-sub" id="cbSub">Carregando...</p>
        </div>
        <div class="cb-abas">
            <button class="aba on" data-aba="operacao" onclick="trocarAba('operacao')">Operação</button>
            <button class="aba" data-aba="comercial" onclick="trocarAba('comercial')">Comercial</button>
        </div>
    </div>

    <div class="wrap">
        <div class="painel-aba on" id="abaOperacao"><div class="loading">Carregando...</div></div>
        <div class="painel-aba" id="abaComercial"><div class="loading">Carregando...</div></div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script>
        const NIVEL = "{{ nivel_acesso }}";
        const PALETA = [['#EEEDFE','#3C3489'],['#E1F5EE','#0F6E56'],['#FAECE7','#993C1D'],
            ['#FBEAF0','#993556'],['#E6F1FB','#185FA5'],['#EAF3DE','#3B6D11'],['#FAEEDA','#854F0B']];
        const QUADROS = [['recrutamento','Recrutamento e Seleção'],['rhestrategico','RH Estratégico'],
            ['projetos','Projetos'],['rhinterno','RH Interno'],['cxdata','CX Data'],
            ['comercial','Comercial'],['marketing','Marketing'],['financeiro','Adm/Financeiro']];
        const ROT_PERDA = { contato_invalido:'Contato não existe', nao_localizado:'Não localizado',
            empresa_fechada:'Empresa fechou', duplicado:'Lead duplicado',
            nao_e_publico:'Fora do perfil', outra_perda:'Outro motivo' };
        const ROT_OBJECAO = { preco:'Preço', momento:'Momento', sem_verba:'Sem verba',
            concorrente:'Concorrente', nao_decisor:'Não decisor', sem_interesse:'Sem interesse',
            sem_resposta:'Sem resposta', outra:'Outra' };
        const CORES_FUNIL = { qualificacao:'#0EA5E9', fechamento:'#6C5CE7', nutricao:'#C2660B' };

        let abaAtiva = 'operacao';
        let diasOp = 30, diasCom = 90;       // comercial usa 90: o ciclo de venda é de ~38 dias
        let quadroOp = '', op = null, com = null;

        document.addEventListener('DOMContentLoaded', () => {
            // A sidebar aponta para ?aba=comercial; abrir direto na aba certa
            // evita o pisca de carregar operação e trocar em seguida.
            const alvo = new URLSearchParams(window.location.search).get('aba');
            if(alvo === 'comercial'){
                abaAtiva = 'comercial';
                document.querySelectorAll('.aba').forEach(b =>
                    b.classList.toggle('on', b.getAttribute('data-aba') === 'comercial'));
                document.querySelectorAll('.painel-aba').forEach(p => p.classList.remove('on'));
                document.getElementById('abaComercial').classList.add('on');
                carregarComercial();
            } else {
                carregarOperacao();
            }
        });

        function escH(s){ if(s===null||s===undefined) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
        function escA(s){ return escH(s).replace(/'/g,'&#39;'); }
        function cor(n){ let h=0; for(let i=0;i<(n||'').length;i++) h=n.charCodeAt(i)+((h<<5)-h); return PALETA[Math.abs(h)%PALETA.length]; }
        function iniciais(n){ return (n||'?').trim().split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase(); }
        function moeda(v){
            if(v === null || v === undefined) return '—';
            if(v >= 1000) return 'R$ ' + (v/1000).toFixed(v >= 10000 ? 0 : 1).replace('.',',') + 'k';
            return 'R$ ' + Math.round(v);
        }
        function pct(n){ return (n===null||n===undefined) ? '—' : n + '%'; }

        async function motivo(resp, padrao){
            try{ const d = await resp.json();
                if(d && d.detalhe) return (d.mensagem||padrao)+' '+d.detalhe;
                if(d && d.mensagem) return d.mensagem;
                if(d && d.erro) return d.erro;
            }catch(e){}
            return padrao+' (HTTP '+resp.status+')';
        }
        function erroEm(alvo, msg){
            document.getElementById(alvo).innerHTML =
                `<div class="empty"><span class="material-symbols-rounded">error</span>
                 <h3>Não foi possível carregar</h3><p>${escH(msg)}</p></div>`;
        }

        function trocarAba(a){
            abaAtiva = a;
            document.querySelectorAll('.aba').forEach(b => b.classList.toggle('on', b.getAttribute('data-aba')===a));
            document.querySelectorAll('.painel-aba').forEach(p => p.classList.remove('on'));
            document.getElementById('aba' + a.charAt(0).toUpperCase() + a.slice(1)).classList.add('on');
            atualizarSub();
            // Mantém a URL coerente com a aba: recarregar a página volta ao mesmo lugar.
            try{
                const u = new URL(window.location.href);
                if(a === 'comercial') u.searchParams.set('aba','comercial');
                else u.searchParams.delete('aba');
                window.history.replaceState({}, '', u);
            }catch(e){}
            if(a === 'comercial' && !com) carregarComercial();
        }
        function atualizarSub(){
            const d = abaAtiva === 'operacao' ? diasOp : diasCom;
            const escopo = abaAtiva === 'operacao'
                ? (quadroOp ? (QUADROS.find(q=>q[0]===quadroOp)||[])[1] : 'todos os quadros')
                : 'três funis';
            document.getElementById('cbSub').innerText = `Últimos ${d} dias · ${escopo}`;
        }

        function barrasHtml(itens, chaveRot, chaveVal, corFn, sufixo){
            const max = Math.max(1, ...itens.map(i => i[chaveVal]));
            return itens.map(i => `<div class="bh">
                <span class="bh-rot"><span>${escH(i[chaveRot])}</span></span>
                <span class="bh-t"><i style="width:${Math.max(2, i[chaveVal]/max*100)}%;background:${corFn(i)}"></i></span>
                <span class="bh-v">${i[chaveVal]}${sufixo||''}</span></div>`).join('');
        }

        /* ==================== OPERAÇÃO ==================== */
        async function carregarOperacao(){
            document.getElementById('abaOperacao').innerHTML = '<div class="loading">Carregando...</div>';
            try{
                const u = '/api/painel/operacao?dias=' + diasOp + (quadroOp ? '&quadro='+quadroOp : '');
                const r = await fetch(u);
                if(!r.ok){ erroEm('abaOperacao', await motivo(r,'Erro ao carregar o painel.')); return; }
                op = await r.json();
            }catch(e){ erroEm('abaOperacao','Sem conexão com o servidor.'); return; }
            renderOperacao();
            atualizarSub();
        }

        function renderOperacao(){
            const k = op.kpis, a = op.atencao;

                com = await r.json();

            renderComercial();
            atualizarSub();

                                return `<div class="li">
                                    <div><div class="li-t" style="display:flex;align-items:center;gap:8px">
                                        <span class="bh-av" style="background:${bg};color:${fg}">${iniciais(p.pessoa)}</span>${escH(p.pessoa)}</div>
                                        <div class="li-s">${p.leads} ativos · ${p.ganhos} ${p.ganhos===1?'ganho':'ganhos'}</div></div>
                                    <span class="li-v">${vv ? moeda(p.valor) : ''}</span>
                                    <span class="pilula p-neutro">${p.leads?Math.round(p.ganhos/(p.leads+p.ganhos)*100):0}% conv.</span></div>`;
                            }).join('') : '<div class="conclusao">Nenhum lead atribuído.</div>'}
                        </div>
                    </div>
                </div>`;
            document.getElementById('abaComercial').innerHTML = html;
        }

        function barra(v, destino){
            const max = Math.max(1, destino.nutricao, destino.perdido, destino.ativos);
            return Math.max(2, v/max*100);
        }

        function cascataHtml(casc, topo){
            let html = '', funilAnterior = null;
            casc.forEach((e, i) => {
                if(e.funil !== funilAnterior){
                    const nome = e.funil === 'qualificacao' ? 'Qualificação' : 'Fechamento';
                    const desc = e.funil === 'qualificacao'
                        ? 'SDR · da prospecção até virar oportunidade'
                        : 'Closer · da reunião até o contrato';
                    const c = CORES_FUNIL[e.funil] || 'var(--acao)';
                    html += `<div class="funil-div ${i===0?'primeiro':''}">
                        <span class="fd-selo" style="background:${c}1A;color:${c}">${nome}</span>
                        <span class="fd-txt">${desc}</span></div>`;
                    funilAnterior = e.funil;
                }
                const ehFim = (e.etapa === 'Ganho' || e.etapa === 'Fechamento');
                const c = ehFim ? '#0E9F6E' : degrade(i, casc.length);
                const larg = topo ? Math.max(4, e.qtd/topo*100) : 4;
                html += `<div class="et">
                    <span class="et-rot"><span class="et-pt" style="background:${c}"></span>
                        <span class="et-nome">${escH(e.etapa)}</span></span>
                    <span class="et-tri"><span class="et-b" style="width:${larg}%;background:${c}">${e.qtd}</span>
                        ${e.etapa==='Ganho' ? '<span class="et-marca"><span class="material-symbols-rounded">arrow_forward</span>viram oportunidade</span>' : ''}
                        ${e.etapa==='Fechamento' ? '<span class="et-marca"><span class="material-symbols-rounded">check</span>contratos assinados</span>' : ''}
                    </span>
                    <span class="et-val" ${ehFim && e.etapa==='Fechamento'?'style="color:var(--ok);font-weight:700"':''}>${e.pct_topo}%</span>
                </div>`;
                if(e.conversao !== null && e.conversao !== undefined && i < casc.length-1){
                    const proxFunil = casc[i+1].funil !== e.funil;
                    if(!proxFunil){
                        html += `<div class="conv"><span></span>
                            <span class="conv-tx"><span class="conv-l"></span>
                                <span class="conv-p ${classeConv(e.conversao)}">${e.conversao}%</span>
                                <span class="conv-rot">avançaram${e.sairam ? ' · '+e.sairam+' saíram aqui' : ''}</span></span>
                            <span></span></div>`;
                    }
                }
            });
            return html;
        }

        function degrade(i, total){
            const paleta = ['#0EA5E9','#2299DB','#3B8DE0','#5478E4','#6C5CE7','#8B5CF6'];
            return paleta[Math.min(i, paleta.length-1)];
        }

        function conclusaoCascata(casc){
            const comConv = casc.filter(e => e.conversao !== null && e.conversao !== undefined && e.sairam);
            if(!comConv.length) return '';
            const maiorPerda = comConv.reduce((a,b) => b.sairam > a.sairam ? b : a);
            const piorTaxa = comConv.reduce((a,b) => b.conversao < a.conversao ? b : a);
            if(maiorPerda.etapa === piorTaxa.etapa)
                return `<div class="conclusao"><b>${escH(maiorPerda.etapa)}</b> é o maior gargalo:
                    ${maiorPerda.sairam} leads saem ali, e só ${maiorPerda.conversao}% avançam.</div>`;
            return `<div class="conclusao">A maior perda em volume é em <b>${escH(maiorPerda.etapa)}</b>,
                com ${maiorPerda.sairam} leads. Mas a pior taxa é em <b>${escH(piorTaxa.etapa)}</b>,
                onde só ${piorTaxa.conversao}% avançam — e cada lead que cai ali já custou mais esforço.</div>`;
        }

        function periodoCom(d){ diasCom = d; carregarComercial(); }

        function showToast(msg,tipo){
            const c=document.getElementById('toastContainer');
            const t=document.createElement('div'); t.className='toast';
            t.innerHTML = `<span class="material-symbols-rounded" style="font-size:16px;color:${tipo==='error'?'var(--accent-pink)':'var(--accent-lime)'}">${tipo==='error'?'error':'check_circle'}</span>${escH(msg)}`;
            c.appendChild(t); setTimeout(()=>t.remove(),4000);
        }
    </script>
</body>
</html>
